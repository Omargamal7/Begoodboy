<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#f1e3c8;--accent:#f59e0b;--good:#16a34a;--bad:#dc2626;--blue:#2563eb;--sea:#bfe3ff;--sand:#f5d79a;--soft:#fef3c7}

h1{font-size:1.25rem;margin:0;flex:1;min-width:200px;line-height:1.3}

nav{display:flex;gap:6px;overflow-x:auto;max-width:1000px;margin:10px auto 0;padding-bottom:2px;scrollbar-width:none}

main{max-width:1000px;margin:auto;padding:16px}

h3{margin:.2em 0;font-size:1.1rem}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}

.btn.ghost{background:#fff;color:#92400e;border:2px solid #fcd34d;box-shadow:none}
.btn.blue{background:var(--blue);box-shadow:0 3px 0 #1e40af}

.btn.red{background:var(--bad);box-shadow:0 3px 0 #991b1b}
.tabs2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}

.fact{border-inline-start:6px solid var(--c,#f59e0b);background:#fffdf7}
.fact h3{display:flex;gap:8px;align-items:center;justify-content:space-between}
.say{border:0;background:#fef3c7;border-radius:50%;width:34px;height:34px;cursor:pointer;flex:none}
.exam{background:#ecfdf5;border:2px dashed #34d399;border-radius:12px;padding:8px 12px;margin-top:8px;font-size:.98rem}

.bookonly{display:inline-block;background:#ede9fe;color:#6d28d9;border-radius:8px;padding:0 8px;font-size:.8rem;font-weight:800}
.widget{background:#f0f9ff;border:2px solid #bae6fd}
svg{max-width:100%;height:auto;display:block;margin:auto;direction:ltr}
.info{min-height:70px;background:#fff;border-radius:12px;padding:10px 14px;border:2px solid #e5e7eb;margin-top:10px}
.q{font-weight:800;font-size:1.08rem}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:start;border:2px solid #e5e7eb;background:#fff;border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer}
.opt:hover{border-color:#f59e0b}
.opt.ok{background:#dcfce7;border-color:#16a34a}
.opt.no{background:#fee2e2;border-color:#dc2626}
.ans{display:none;background:#ecfdf5;border-radius:12px;padding:10px 14px;margin-top:8px;white-space:pre-line}
.ans.show{display:block;animation:pop .25s}
.note{background:#fff7ed;border:2px solid #fdba74;border-radius:10px;padding:6px 10px;font-size:.9rem;margin-top:6px}
.sq{border-bottom:2px dashed var(--line);padding:12px 0}
.sq:last-child{border:0}
.tag{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:8px;padding:0 8px;font-size:.8rem;font-weight:800;margin-inline-end:6px}
.done-ok{color:var(--good);font-weight:900}
.done-no{color:var(--bad);font-weight:900}
details.sheet{margin:10px 0}
details.sheet summary{cursor:pointer;font-weight:800;font-size:1.05rem;padding:6px 0}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:2px solid #e5e7eb;border-radius:12px;padding:10px;background:#fff;cursor:pointer;font:inherit;min-height:56px}
.tile.sel{border-color:#2563eb;background:#dbeafe}
.tile.gone{visibility:hidden}
.tile.wrong{animation:shake .3s;border-color:#dc2626}
.flip{perspective:900px;cursor:pointer;height:170px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-weight:800}
.flip .fa{background:linear-gradient(135deg,#fde68a,#fca5a5)}
.flip .fb{background:#ecfdf5;transform:rotateY(180deg);font-weight:600;font-size:.95rem}
.big-emoji{font-size:3rem;text-align:center}
.result{text-align:center;font-size:1.3rem;font-weight:900}
.stars{font-size:2.2rem;letter-spacing:4px}
table{border-collapse:collapse;width:100%}
td,th{border:1px solid #e5e7eb;padding:8px;text-align:start;vertical-align:top}
th{background:#fef3c7}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) scale(.8);background:#111827;color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;opacity:0;transition:.25s;z-index:50;pointer-events:none}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.clocks{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;text-align:center}
input[type=range]{width:100%}
.timer{height:8px;background:#e5e7eb;border-radius:9px;overflow:hidden}
.timer i{display:block;height:100%;background:#f97316}
.mapwrap{position:relative}
.place{cursor:pointer}
.place:hover circle{r:9}
.region{cursor:pointer;transition:filter .15s}
.region:hover{filter:brightness(1.08) saturate(1.2)}
.flash{animation:flash .8s 2}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes flash{50%{opacity:.25}}
.hide{display:none}
.en{direction:ltr;text-align:left;background:#eaf3ff;border-inline-start:4px solid #3b82f6;border-radius:10px;padding:6px 10px;margin-top:6px;font-family:Nunito,system-ui,sans-serif;font-size:.95rem;color:#1e3a8a;line-height:1.5}
.en .say2{border:0;background:#dbeafe;border-radius:50%;width:28px;height:28px;cursor:pointer;margin-right:4px}
.eno{font-family:Nunito,system-ui,sans-serif;color:#1d4ed8;font-weight:600}
.phase{background:linear-gradient(90deg,#fde68a,#fff);border-radius:14px;padding:10px 16px;margin:22px 0 6px;font-size:1.25rem;font-weight:900}
.model{border:3px solid #c7d2fe}
.model>h3{background:#e0e7ff;margin:-16px -16px 10px;padding:10px 16px;border-radius:15px 15px 0 0}
.srcbook{background:#ede9fe;color:#5b21b6;border-radius:8px;padding:2px 8px;font-size:.8rem;font-weight:800}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.kid{font-size:1.4rem}
@media (max-width:600px){body{font-size:16px}.pairs{gap:6px}.tile{padding:8px;font-size:.9rem}h1{font-size:1.05rem}}
@media print{header,nav,.btn,.say{display:none!important}.ans{display:block!important}.card{break-inside:avoid;box-shadow:none}}
</style>

  title:{ar:"الدرس الثاني: تضاريس وطننا العربي", en:"Lesson 2: Landforms of the Arab world"},
  pages:{ar:"الكتاب ص ١٦–٢٣", en:"Book pages 16–23"},
  facts:[
   {h:{ar:"كيف تكوّنت التضاريس؟", en:"How the landforms were made"},
    t:{ar:"تكونت منذ ملايين السنين بفعل عوامل باطنية (الالتواءات والانكسارات والبراكين) كونت الجبال والهضاب، وعوامل سطحية (الرياح والمياه) شكلت السهول والوديان.", en:"Millions of years ago, INSIDE forces (folds, faults, volcanoes) made the mountains and plateaus, and SURFACE forces (wind and water) shaped the plains and valleys."},
    ex:"عوامل باطنية مثل الالتواءات والانكسارات – عوامل سطحية مثل الرياح والمياه"},
   {h:{ar:"الجبال الانكسارية", en:"Fault mountains"},
    t:{ar:"نشأت نتيجة حركات انكسارية في القشرة الأرضية، منها: جبال البحر الأحمر (في مصر والسودان)، وجبال الحجاز وعسير ومرتفعات اليمن (في السعودية واليمن).", en:"Made by FAULT movements (cracks) in the Earth's crust: the Red Sea Mountains (Egypt and Sudan), and the Hijaz and Asir mountains and Yemen highlands (Saudi Arabia and Yemen)."},
    ex:"الجبال الانكسارية: جبال البحر الأحمر وجبال الحجاز وعسير ومرتفعات اليمن"},
   {h:{ar:"الجبال الالتوائية", en:"Fold mountains"},
    t:{ar:"نشأت نتيجة حركات التوائية تعرضت لها الأرض، منها: جبال زاجروس وجبال عمان وجبال أطلس التي تمتد في ثلاث دول: تونس والجزائر والمغرب، وبها أعلى جبل بالوطن العربي وهو جبل توبقال.", en:"Made by FOLD movements (bending): the Zagros mountains, the Oman mountains and the ATLAS mountains, which run through 3 countries: Tunisia, Algeria and Morocco. Atlas has the highest mountain in the Arab world: Mount TOUBKAL."},
    ex:"جبال أطلس التوائية تمتد في تونس والجزائر والمغرب – أعلى قمة جبل توبقال"},
   {h:{ar:"أهمية الجبال", en:"Why mountains matter"},
    t:{ar:"استخدمها الإنسان في استخراج المعادن ومواد البناء، وتتميز بالمناظر الخلابة التي تجذب السياح.", en:"People take minerals and building materials from them, and their beautiful views attract tourists."},
    ex:"استخراج المعادن ومواد البناء – المناظر الخلابة تجذب السياح"},
   {h:{ar:"الهضاب", en:"Plateaus"},
    t:{ar:"الهضاب أكثر مظاهر السطح انتشارًا. أكبرها هضبة شمال إفريقيا: تمتد من البحر الأحمر شرقًا إلى المحيط الأطلنطي غربًا ومن البحر المتوسط شمالًا إلى وسط إفريقيا جنوبًا. هضاب الجناح الآسيوي: بادية الشام في الشمال، نجد في الوسط، حضرموت في الجنوب.", en:"Plateaus are the MOST widespread landform. The biggest is the NORTH AFRICA plateau (Red Sea to the Atlantic, Mediterranean to central Africa). Asian wing plateaus: Badiyat al-Sham (north), NAJD (middle), HADRAMAUT (south)."},
    ex:"الهضاب أكثر مظاهر السطح انتشارًا – أكبرها هضبة شمال إفريقيا"},
   {h:{ar:"الواحات", en:"Oases"},
    t:{ar:"أرض منخفضة وسط الصحراء تُزرع باستخدام المياه الجوفية، لذلك يعيش فيها السكان ويمارسون الزراعة، منها واحة سيوة في مصر وواحة عين صالح في الجزائر.", en:"Low land in the middle of the desert, farmed with GROUNDWATER, so people live there and farm. Examples: Siwa (Egypt) and Ain Salah (Algeria)."},
    ex:"الواحة: أرض منخفضة وسط الصحراء تزرع بالمياه الجوفية – سيوة في مصر وعين صالح في الجزائر"},
   {h:{ar:"الكثبان الرملية", en:"Sand dunes"},
    t:{ar:"تجمعات من الرمال الخفيفة تكونت بفعل التعرية الهوائية، وتنتشر في المناطق الصحراوية مثل بحر الرمال العظيم بين مصر وليبيا.", en:"Piles of light sand made by WIND erosion, found in deserts, like the Great Sand Sea between Egypt and Libya."},
    ex:"تكونت بفعل التعرية الهوائية مثل بحر الرمال العظيم"},
   {h:{ar:"الأودية الجافة", en:"Dry valleys"},
    t:{ar:"مجارٍ كانت تملؤها المياه قديمًا ثم جفت، تكونت بفعل التعرية المائية، وتستخدم طرقًا للنقل والمواصلات واستخراج المياه الجوفية، مثل وادي العلاقي في مصر ووادي الدواسر في السعودية.", en:"Channels that were full of water long ago and then dried up, made by WATER erosion. Used as roads and to get groundwater, like Wadi Allaqi (Egypt) and Wadi Al-Dawasir (Saudi Arabia)."},
    ex:"الأودية الجافة: مجارٍ كانت تملؤها المياه قديمًا ثم جفت – تستخدم طرقًا للنقل واستخراج المياه الجوفية"},
   {h:{ar:"التعرية المائية والهوائية", en:"Water and wind erosion"},
    t:{ar:"التعرية المائية: نحت الصخور ونقلها وإرسابها بواسطة المياه. التعرية الهوائية: نحت الصخور ونقلها وإرسابها بواسطة الرياح.", en:"Water erosion = water carves rocks, carries them and drops them. Wind erosion = the same done by WIND."},
    ex:"التعرية المائية: نحت الصخور ونقلها وإرسابها بواسطة المياه"},
   {h:{ar:"السهول", en:"Plains"},
    t:{ar:"أراضٍ مستوية أو شبه مستوية، ثلاثة أنواع: ١) السهول الفيضية: كونها إرساب الأنهار، خصبة ويتركز بها السكان، مثل سهول النيل في مصر والسودان ودجلة والفرات في العراق. ٢) السهول الساحلية: سهول البحر المتوسط تربتها خصبة صالحة للزراعة، وسهول البحر الأحمر والخليج العربي غنية بالمعادن ومصادر الطاقة. ٣) السهول الصحراوية: كونتها الرياح بالنحت أو الترسيب، رملية أو صخرية، ونادرة الغطاء النباتي.", en:"Flat or nearly flat land, 3 kinds: 1) FLOOD plains, made by rivers dropping mud: fertile and crowded (the Nile in Egypt and Sudan; Tigris and Euphrates in Iraq). 2) COASTAL plains: Mediterranean ones have fertile farm soil; Red Sea and Gulf ones are rich in minerals and energy. 3) DESERT plains, made by wind: sandy or rocky, with very few plants."},
    ex:"السهول الفيضية – السهول الساحلية – السهول الصحراوية"},
   {h:{ar:"التضاريس والأنشطة الاقتصادية", en:"Landforms and jobs"},
    t:{ar:"ساعد تنوع مظاهر السطح على تنوع الموارد، وبالتالي تنوع الأنشطة الاقتصادية مثل الزراعة والصيد والتعدين والسياحة والصناعة.", en:"Different landforms give different resources, so many kinds of work: farming, fishing, mining, tourism and industry."},
    ex:"تنوع التضاريس يؤدي إلى تنوع الموارد والأنشطة الاقتصادية"},
   {h:{ar:"واحة سيوة", en:"Siwa Oasis"},
    t:{ar:"جوها جاف يساعد على علاج بعض أمراض الجهاز التنفسي، ورمالها البيضاء الساخنة تعالج الروماتيزم وآلام المفاصل، وعيون المياه الكبريتية تعالج بعض الأمراض الجلدية.", en:"Its dry air helps some breathing illnesses, its hot white sand treats rheumatism and joint pain, and its sulphur springs treat some skin diseases."},
    book:true}
  ]},
 {id:"l3", icon:"🌦️", color:"#059669",
  title:{ar:"الدرس الثالث: وطننا العربي (المناخ – النبات الطبيعي)", en:"Lesson 3: Climate and natural plants"},
  pages:{ar:"الكتاب ص ٢٤–٢٩", en:"Book pages 24–29"},
  facts:[
   {h:{ar:"العوامل المؤثرة في المناخ", en:"What controls the climate"},
    t:{ar:"١) الموقع الفلكي ٢) الموقع بالنسبة للمسطحات المائية ٣) مظاهر السطح.", en:"1) Astronomical location 2) Position compared with seas and oceans 3) Landforms."},
    ex:"الموقع الفلكي – الموقع بالنسبة للمسطحات المائية – مظاهر السطح"},
   {h:{ar:"الموقع الفلكي", en:"Astronomical location"},
    t:{ar:"المناطق القريبة من دائرة الاستواء أعلى حرارة، وتقل الحرارة كلما ابتعدنا عنها شمالًا أو جنوبًا؛ لذلك معظم الوطن العربي حار ما عدا الأجزاء الشمالية فمناخها معتدل.", en:"Places near the Equator are hotter; it gets cooler as you go away from it. So most of the Arab world is HOT, except the northern parts, which are mild."},
    ex:"معظم الوطن العربي يتميز بالمناخ الحار ما عدا الأجزاء الشمالية معتدلة"},
   {h:{ar:"المسطحات المائية", en:"Near or far from the sea"},
    t:{ar:"المناطق القريبة من البحار والمحيطات معتدلة المناخ، والبعيدة عنها (الداخلية) شديدة الحرارة صيفًا وشديدة البرودة شتاءً، مثل اختلاف الحرارة بين الإسكندرية والرياض.", en:"Places near seas are mild. Places far inland are very hot in summer and very cold in winter. Example: Alexandria (coast) vs Riyadh (inland)."},
    ex:"المناطق القريبة من المسطحات المائية معتدلة والبعيدة شديدة الحرارة صيفًا وشديدة البرودة شتاءً"},
   {h:{ar:"مظاهر السطح", en:"Landforms"},
    t:{ar:"الارتفاع: كلما ارتفعنا ١٥٠ مترًا عن سطح البحر تنخفض الحرارة درجة واحدة؛ لذلك تغطي الثلوج بعض القمم العالية مثل جبال لبنان. اتجاه الكتل الجبلية: السفوح المواجهة للرياح المحملة ببخار الماء أغزر مطرًا من السفوح الداخلية، مثل جبال أطلس.", en:"HEIGHT: every 150 m up, the temperature drops 1°C, so snow covers some high peaks like Lebanon's mountains. MOUNTAIN DIRECTION: slopes facing wet winds get much more rain than the inner slopes, like the Atlas mountains."},
    ex:"كلما ارتفعنا ١٥٠ مترًا تنخفض الحرارة درجة واحدة"},
   {h:{ar:"الإقليم المناخي", en:"Climate region"},
    t:{ar:"مساحة من الأرض لها نفس الخصائص المناخية من حيث الحرارة والمطر. في الوطن العربي ثلاثة أقاليم: البحر المتوسط – الصحراوي الحار – المداري.", en:"An area with the SAME climate (heat and rain). The Arab world has 3: Mediterranean, hot desert, tropical."},
    ex:"الإقليم المناخي: مساحة من الأرض لها نفس الخصائص المناخية من حيث الحرارة والمطر"},
   {h:{ar:"إقليم البحر المتوسط", en:"Mediterranean region"},
    t:{ar:"يمتد في الأجزاء الشمالية. حار صيفًا، معتدل ممطر شتاءً. تنمو الغابات المعتدلة فوق المنحدرات الجبلية (الزيتون والأرز)، والحشائش المعتدلة (الإستبس) تزدهر شتاءً وتجف صيفًا وتُربى عليها الأغنام والماعز.", en:"In the NORTH. Hot summer, mild rainy winter. Temperate forests on mountain slopes (olive and cedar trees); STEPPE grass grows in winter, dries in summer, and feeds sheep and goats."},
    ex:"الأجزاء الشمالية – حار صيفًا معتدل ممطر شتاءً – الغابات المعتدلة (الزيتون والأرز) وحشائش الإستبس"},
   {h:{ar:"الإقليم الصحراوي الحار", en:"Hot desert region"},
    t:{ar:"يقع بين إقليم البحر المتوسط شمالًا والمداري جنوبًا، ويسود معظم الوطن العربي. شديد الحرارة صيفًا (خاصة نهارًا) وشديد البرودة شتاءً (خاصة ليلًا). تنمو الأعشاب القصيرة في المناطق قليلة المطر والنباتات الشوكية في المناطق نادرة المطر. يعيش به الزواحف والإبل والغزلان.", en:"Between the Mediterranean (north) and tropical (south) regions; covers MOST of the Arab world. Very hot in summer (by day), very cold in winter (by night). Short grasses where there is little rain; THORNY plants where rain is rare. Animals: reptiles, camels, gazelles."},
    ex:"شديد الحرارة صيفًا وشديد البرودة شتاءً – نادر المطر – نباتات شوكية وأعشاب قصيرة – الإبل والغزلان والزواحف"},
   {h:{ar:"الإقليم المداري", en:"Tropical region"},
    t:{ar:"يقع في جنوب الوطن العربي. حار ممطر صيفًا، معتدل جاف شتاءً. تنمو به الغابات المدارية وتكثر بها أشجار السنط التي يُستخرج منها الصمغ العربي، وحشائش السافانا تتدرج في الطول حسب كمية المطر. من حيواناته: الزراف والأسود والنمور والأفيال، وتعيش جميعها في السافانا.", en:"In the SOUTH. Hot and rainy in summer, mild and dry in winter. Tropical forests with ACACIA trees, which give GUM ARABIC; SAVANNA grass, taller where there is more rain. Animals: giraffes, lions, tigers and elephants, all living in the savanna."},
    ex:"جنوب الوطن العربي – حار ممطر صيفًا معتدل جاف شتاءً – الغابات المدارية وأشجار السنط (الصمغ العربي) وحشائش السافانا"},
   {h:{ar:"تأثير المناخ على الاقتصاد", en:"Climate and the economy"},
    t:{ar:"تنوع المحاصيل الزراعية من مكان لآخر، وتنشيط السياحة البيئية، وتحقيق التكامل بين الدول العربية من خلال تبادل المحاصيل والمنتجات.", en:"Different crops in different places, more eco-tourism, and Arab countries helping each other by trading crops and products."},
    ex:"تنوع المحاصيل الزراعية – تنشيط السياحة البيئية – تحقيق التكامل بين الدول العربية"}
  ]},
 {id:"l4", icon:"🌱", color:"#7c3aed",
  title:{ar:"الدرس الرابع: التحديات البيئية في وطننا العربي", en:"Lesson 4: Environmental challenges"},
  pages:{ar:"الكتاب ص ٣٠–٣٦", en:"Book pages 30–36"},
  facts:[
   {h:{ar:"التغير المناخي", en:"Climate change"},
    t:{ar:"تغير طويل في درجات الحرارة وأنماط المطر، ويؤدي إلى موجات جفاف وحرائق غابات وانقراض نباتات. يواجه الوطن العربي بسببه الجفاف وندرة المياه العذبة والتصحر وتلوث الهواء والسيول.", en:"A LONG change in temperatures and rain patterns. It brings droughts, forest fires and plants dying out. Because of it the Arab world faces drought, fresh-water shortage, desertification, air pollution and flash floods."},
    ex:"التغير المناخي: تغير طويل في درجات الحرارة وأنماط المطر"},
   {h:{ar:"ندرة المياه العذبة: الأسباب", en:"Water shortage: causes"},
    t:{ar:"قلة سقوط الأمطار – سوء إدارة الموارد المائية باستخدام طرق الري التقليدية (القديمة) – زيادة عدد السكان.", en:"Little rain – bad use of water with old (flood) irrigation – more people."},
    ex:"قلة سقوط الأمطار – سوء إدارة الموارد المائية – زيادة عدد السكان"},
   {h:{ar:"ندرة المياه: الحلول", en:"Water shortage: solutions"},
    t:{ar:"ترشيد استهلاك المياه – تحسين شبكات المياه والصرف الصحي – حملات توعية – طرق ري حديثة مثل الري بالرش والتنقيط.", en:"Use less water – fix water and sewage networks – awareness campaigns – modern irrigation (sprinklers and DRIP)."},
    ex:"ترشيد الاستهلاك – تحسين شبكات المياه والصرف الصحي – الري بالرش والتنقيط"},
   {h:{ar:"الجفاف", en:"Drought"},
    t:{ar:"الجفاف: نقص كمية الأمطار خلال فترة زمنية محددة. يؤدي إلى نقص الغذاء، والتأثير السلبي على الزراعة والرعي، وانتشار الأمراض وسوء التغذية. مواجهته: إعادة تدوير المياه، تطوير شبكات الري، ترشيد استهلاك المياه. عانت الصومال من موجة جفاف أدت إلى مجاعة لأكثر من مليون إنسان.", en:"DROUGHT = less rain than normal over a period. It causes food shortage, harms farming and grazing, and spreads disease and hunger. Solutions: recycle water, improve irrigation, use less water. Somalia had a drought that caused famine for over a million people."},
    ex:"الجفاف: نقص كمية الأمطار خلال فترة زمنية محددة"},
   {h:{ar:"التصحر", en:"Desertification"},
    t:{ar:"التصحر: تناقص قدرة الأراضي الزراعية على الإنتاج. أسبابه: زحف الكثبان الرملية – قطع الأشجار – تناقص الأمطار والمياه الجوفية – الرعي الجائر – التوسع العمراني.", en:"DESERTIFICATION = farmland becomes less able to grow crops. Causes: moving sand dunes, cutting trees, less rain and groundwater, OVERGRAZING (too many animals eating), and building on farmland."},
    ex:"التصحر: تناقص قدرة الأراضي الزراعية على الإنتاج – زحف الكثبان وقطع الأشجار والرعي الجائر والتوسع العمراني"},
   {h:{ar:"تلوث الهواء", en:"Air pollution"},
    t:{ar:"أسبابه: حرق النفايات – العواصف الرملية – زيادة النشاط الصناعي – الاعتماد على مصادر الطاقة غير المتجددة. مواجهته: الطاقة المتجددة – زيادة المساحات الخضراء – النقل المستدام – إعادة تدوير النفايات.", en:"Causes: burning rubbish, sandstorms, more factories, using non-renewable energy. Solutions: renewable energy (sun, wind), more green spaces, clean (sustainable) transport, recycling."},
    ex:"أسبابه: حرق النفايات والعواصف الرملية والنشاط الصناعي – مواجهته: الطاقة المتجددة وزيادة المساحات الخضراء"},
   {h:{ar:"السيول", en:"Flash floods"},
    t:{ar:"السيول: أمطار غزيرة وفجائية تتجمع وتتدفق بسرعة في الأودية. أخطارها: تدمير البنية التحتية، إتلاف المحاصيل، خسائر في الأرواح والممتلكات، انتشار الأمراض. مواجهتها: التكنولوجيا للتنبؤ – بناء السدود للاستفادة منها في الزراعة – مخرات السيول – تطوير البنية التحتية. أنشأ المصريون القدماء مخرات (مجاري مائية) لتصريف مياه الأمطار وحماية المعابد والمقابر.", en:"FLASH FLOODS = heavy sudden rain that collects and rushes through valleys. Damage: roads and buildings, crops, lives and property, disease. Solutions: technology to predict them, DAMS (water for farming), flood channels, better infrastructure. Ancient Egyptians dug channels to protect temples and tombs."},
    ex:"السيول: أمطار غزيرة وفجائية تتجمع وتتدفق بسرعة في الأودية – بناء السدود ومخرات السيول"},
   {h:{ar:"إجراءات عاجلة", en:"Urgent actions"},
    t:{ar:"الحد من انبعاثات الغازات الدفيئة – الاعتماد على الطاقة المتجددة – تفعيل القوانين البيئية – حماية الغابات وزيادة المساحات الخضراء.", en:"Cut greenhouse gases – use renewable energy – enforce environmental laws – protect forests and add green spaces."}},
   {h:{ar:"جهود الدول العربية", en:"What Arab countries are doing"},
    t:{ar:"مصر: مبادرة زراعة ١٠٠ مليون شجرة مثمرة لتحسين الهواء وتقليل التلوث ومواجهة التغيرات المناخية. السعودية: مبادرة زراعة ٤٥٠ مليون شجرة في الدول العربية، وإنشاء مدينة نيوم الخضراء التي تعتمد على الطاقة النظيفة.", en:"EGYPT: plant 100 million fruit trees to clean the air and fight climate change. SAUDI ARABIA: plant 450 million trees in Arab countries, and build NEOM, a green city running on clean energy."},
    ex:"مصر: مبادرة زراعة ١٠٠ مليون شجرة – السعودية: ٤٥٠ مليون شجرة ومدينة نيوم الخضراء"}
  ]}
],

  {q:{ar:"يفصل بين جناحي الوطن العربي البحر ....", en:"The two wings of the Arab world are separated by the .... Sea."}, a:"البحر الأحمر", ae:"The Red Sea"},
  {q:{ar:"تتركز معظم مساحة اليابس في الجناح ....", en:"Most of the land is in the .... wing."}, a:"الإفريقي", ae:"African"},
  {q:{ar:"أصغر الدول العربية من حيث المساحة هي دولة ....", en:"The smallest Arab country is ...."}, a:"البحرين", ae:"Bahrain"},
  {q:{ar:"هل تطل جميع الدول العربية على مسطحات مائية؟ وضح.", en:"Do all Arab countries have a coast? Explain."}, a:"نعم، تطل جميع الدول العربية على مسطحات مائية، وإن كان ساحل بعضها قصيرًا مثل الأردن (خليج العقبة) والعراق (الخليج العربي)", ae:"Yes – every Arab country touches some sea, though Jordan (Gulf of Aqaba) and Iraq (Arabian Gulf) have very short coasts", note:{ar:"سؤال مفتوح؛ الإجابة اجتهاد منا.", en:"Open question; our suggested answer."}},
  {q:{ar:"ما الدولة العربية الوحيدة التي يمر بها خط جرينتش؟", en:"Which Arab country does the Greenwich line pass through? (book: the only one)"}, a:"الجزائر", ae:"Algeria"},
  {q:{ar:"اذكر أحد حدود الوطن العربي المائية.", en:"Name one water border of the Arab world."}, a:"المحيط الأطلنطي غربًا (أو البحر المتوسط شمالًا – المحيط الهندي جنوبًا – الخليج العربي شرقًا)", ae:"The Atlantic Ocean (west) – or Mediterranean, Indian Ocean, Arabian Gulf"},
  {q:{ar:"الممر المائي الذي يربط بين البحرين الأحمر والمتوسط هو ....", en:"The waterway joining the Red Sea and the Mediterranean is ...."}, a:"قناة السويس", ae:"The Suez Canal"},
  {q:{ar:"يربط مضيق جبل طارق بين البحر .... والمحيط ....", en:"The Strait of Gibraltar joins the .... Sea and the .... Ocean."}, a:"المتوسط – الأطلنطي", ae:"Mediterranean – Atlantic"},
  {q:{ar:"الدول التي تشرف على مضيق باب المندب: دولة .... ودولة ....", en:"Which countries look onto Bab el-Mandeb?"}, a:"اليمن وجيبوتي", ae:"Yemen and Djibouti"},
  {q:{ar:"تشرف دولة عُمان على مضيق ....", en:"Oman looks onto the Strait of ...."}, a:"هرمز", ae:"Hormuz"}
 ]},
 {lesson:"l1", title:{ar:"الدرس الأول – تدريبات الدرس (ص١٤–١٥) – إجابات المعلم", en:"Lesson 1 – End-of-lesson exercises (pp. 14–15) – teacher's answers"}, qs:[
  {q:{ar:"اكتب مدلول الأرقام على الخريطة: ١ المحيط .. ٢ الصحراء .. ٣ المحيط .. ٤ أكبر الدول مساحة .. ٥ البحر .. ٦ جبال .. ٧ مضيق ..", en:"Name the numbers on the map: 1 ocean, 2 desert, 3 ocean, 4 biggest country, 5 sea, 6 mountains, 7 strait."}, a:"١ الأطلنطي – ٢ الكبرى – ٣ الهندي – ٤ الجزائر – ٥ المتوسط – ٦ طوروس – ٧ باب المندب", ae:"1 Atlantic, 2 Great Sahara, 3 Indian, 4 Algeria, 5 Mediterranean, 6 Taurus, 7 Bab el-Mandeb"},
  {q:{ar:"صنّف: (مصر – قطر – البحرين – السودان – المغرب – اليمن – الجزائر – الصومال – فلسطين – العراق) إلى دول آسيوية وإفريقية.", en:"Sort into Asian and African Arab countries: Egypt, Qatar, Bahrain, Sudan, Morocco, Yemen, Algeria, Somalia, Palestine, Iraq."}, a:"آسيوية: قطر – البحرين – اليمن – فلسطين – العراق\nإفريقية: مصر – السودان – المغرب – الجزائر – الصومال", ae:"Asian: Qatar, Bahrain, Yemen, Palestine, Iraq. African: Egypt, Sudan, Morocco, Algeria, Somalia."},
  {q:{ar:"صواب أم خطأ: يجمع الدول العربية تاريخ مشترك.", en:"True or false: Arab countries share a common history."}, a:"صواب", ae:"True"},
  {q:{ar:"صواب أم خطأ: تقع جبال طوروس شرق الوطن العربي.", en:"True or false: the Taurus mountains are EAST of the Arab world."}, a:"خطأ – تقع شمال الوطن العربي", ae:"False – they are NORTH"},
  {q:{ar:"صواب أم خطأ: تطل دولتان عربيتان على المحيط الأطلنطي.", en:"True or false: two Arab countries are on the Atlantic Ocean."}, a:"صواب (المغرب وموريتانيا)", ae:"True (Morocco and Mauritania)"},
  {q:{ar:"صواب أم خطأ: توجد دولة جزر القمر خارج النطاق الفلكي للوطن العربي.", en:"True or false: Comoros is outside the Arab world's astronomical range."}, a:"صواب", ae:"True"},
  {q:{ar:"صواب أم خطأ: يمر مدار الجدي جنوب الوطن العربي.", en:"True or false: the Tropic of Capricorn passes through the south of the Arab world."}, a:"خطأ – تمر دائرة الاستواء", ae:"False – it is the EQUATOR"},
  {q:{ar:"أكمل: تعرّض الوطن العربي للاحتلال بسبب ....", en:"Complete: the Arab world was occupied because of ...."}, a:"الموقع الجغرافي والثروات الطبيعية", ae:"Its location and natural wealth"},
  {q:{ar:"أكمل: أكبر الدول العربية من حيث المساحة هي ....", en:"Complete: the biggest Arab country is ...."}, a:"الجزائر", ae:"Algeria"},
  {q:{ar:"أكمل: يضم الوطن العربي عدد .... دولة.", en:"Complete: the Arab world has .... countries."}, a:"٢٢", ae:"22"},
  {q:{ar:"أكمل: الجزء الأكبر من مساحة الوطن العربي يقع في الجناح ....", en:"Complete: most of the area is in the .... wing."}, a:"الإفريقي", ae:"African"},
  {q:{ar:"اختر: تشرف دولة اليمن على (مضيق باب المندب – مضيق جبل طارق – مضيق هرمز – قناة السويس)", en:"Choose: Yemen looks onto (Bab el-Mandeb / Gibraltar / Hormuz / Suez Canal)"}, a:"مضيق باب المندب", ae:"Bab el-Mandeb"},
  {q:{ar:"اختر: تضم فلسطين أماكن دينية مقدسة منها (المسجد الأقصى – المسجد النبوي – المسجد الأموي – الكنيسة المعلقة)", en:"Choose: a holy place in Palestine (Al-Aqsa / the Prophet's Mosque / Umayyad Mosque / Hanging Church)"}, a:"المسجد الأقصى", ae:"Al-Aqsa Mosque"},
  {q:{ar:"اختر: يمتد الوطن العربي في قارتي (أوروبا وإفريقيا – إفريقيا وآسيا – أوروبا وآسيا – إفريقيا وأستراليا)", en:"Choose: the Arab world is in (Europe+Africa / Africa+Asia / Europe+Asia / Africa+Australia)"}, a:"إفريقيا وآسيا", ae:"Africa and Asia"},
  {q:{ar:"اختر: يمر خط الطول صفر بالوطن العربي عند دولة (مصر – السعودية – تونس – الجزائر)", en:"Choose: longitude 0° passes through (Egypt / Saudi Arabia / Tunisia / Algeria)"}, a:"الجزائر", ae:"Algeria"},
  {q:{ar:"بم تفسر: الأهمية الدينية للوطن العربي؟", en:"Explain the Arab world's religious importance."}, a:"الوطن العربي مهد لثلاث ديانات سماوية ويوجد به أماكن دينية مقدسة", ae:"It is the cradle of 3 religions and has holy places"},
  {q:{ar:"بم تفسر: الأهمية الاقتصادية للوطن العربي؟", en:"Explain its economic importance."}, a:"يطل على مسطحات مائية مهمة جعلته يتحكم في طرق التجارة العالمية، وتنوع الموارد الطبيعية", ae:"It looks onto key seas, so it controls world trade, and it has many resources"},
  {q:{ar:"بم تفسر: تعرُّض الوطن العربي للاحتلال؟", en:"Why was the Arab world occupied?"}, a:"بسبب الموقع الجغرافي المتميز والموارد الطبيعية", ae:"Its special location and natural resources"},
  {q:{ar:"دلل على صحة: تتنوع المسطحات المائية التي يطل عليها الوطن العربي.", en:"Prove: the Arab world looks onto many different seas."}, a:"حيث إن الوطن العربي يطل على البحر الأحمر والمحيط الأطلنطي والهندي والخليج العربي", ae:"Red Sea, Atlantic, Indian Ocean, Arabian Gulf"},
  {q:{ar:"ما النتائج المترتبة على الموقع المتميز للوطن العربي؟", en:"What resulted from the Arab world's special location?"}, a:"جعله مطمعًا لكثير من المحتلين عبر العصور المختلفة", ae:"It became a target for many invaders through history"}
 ]},
 {lesson:"l1", src:"authored", title:{ar:"الدرس الأول – الواجب (كتيب الأداءات والتقييمات)", en:"Lesson 1 – Homework (assessment booklet)"}, qs:[
  {q:{ar:"ما النتائج المترتبة على الموقع الجغرافي المتميز والثروات الطبيعية للوطن العربي؟", en:"What resulted from the Arab world's special location and natural wealth?"}, a:"جعله مطمعًا لكثير من المحتلين عبر العصور المختلفة الذين حاولوا السيطرة عليه لنهب ثرواته والتحكم في موقعه وممراته الحيوية", ae:"Invaders wanted it, to take its wealth and control its location and waterways"},
  {q:{ar:"ماذا يحدث إذا لم يتحكم الوطن العربي في ممرات مائية مهمة؟", en:"What if the Arab world did not control important waterways?"}, a:"تقل أهميته الإستراتيجية والاقتصادية ولا يتحكم في طرق التجارة العالمية", ae:"It would lose strategic and economic importance and not control world trade"},
  {q:{ar:"بم تفسر: الأهمية الاقتصادية لموقع الوطن العربي؟", en:"Explain the economic importance of its location."}, a:"لأنه يطل على مسطحات مائية مهمة (المتوسط والأحمر والخليج العربي) مما جعله يتحكم في طرق التجارة العالمية", ae:"It looks onto key seas, so it controls world trade routes"},
  {q:{ar:"حدد العنصر المختلف: الكعبة المشرفة – المسجد الأقصى – واحة عين صالح – كنيسة المهد", en:"Odd one out: Kaaba, Al-Aqsa, Ain Salah Oasis, Church of the Nativity"}, a:"واحة عين صالح (ليست مكانًا دينيًا)", ae:"Ain Salah Oasis (not a holy place)"},
  {q:{ar:"حدد العنصر المختلف: مضيق هرمز – مضيق باب المندب – مضيق جبل طارق – مضيق البسفور", en:"Odd one out: Hormuz, Bab el-Mandeb, Gibraltar, Bosphorus"}, a:"مضيق البسفور (لا يتحكم فيه الوطن العربي)", ae:"Bosphorus (not controlled by the Arab world)"}
 ]},
 {lesson:"l1", src:"authored", title:{ar:"الدرس الأول – التقييم الأسبوعي (من المدرسة)", en:"Lesson 1 – Weekly test (school's questions)"}, qs:[
  {m:"أ / A", q:{ar:"أكمل: يحد الوطن العربي من الشرق خليج .... ومن الغرب المحيط ....", en:"Complete: the Arab world is bordered in the east by the .... Gulf and in the west by the .... Ocean."}, a:"الخليج العربي (وخليج عُمان) – المحيط الأطلنطي", ae:"Arabian Gulf (and Gulf of Oman) – Atlantic"},
  {m:"أ / A", q:{ar:"بم تفسر: الأهمية الحضارية للوطن العربي؟", en:"Explain its importance for civilisation."}, a:"لأنه نشأت على أرضه حضارات قديمة كثيرة منها الحضارة المصرية وحضارة العراق وحضارة اليمن", ae:"Ancient civilisations began there: Egypt, Iraq, Yemen"},
  {m:"أ / A", q:{ar:"دلل على صحة العبارة: يتمتع الوطن العربي بموقع جغرافي مميز.", en:"Prove: the Arab world has a special geographic location."}, a:"لأنه يقع في وسط قارات العالم القديم (إفريقيا وآسيا وأوروبا) ويطل على مسطحات مائية مهمة ويتحكم في ممرات مائية مثل قناة السويس", ae:"Middle of the Old World, on key seas, controls waterways like Suez"},
  {m:"أ / A", q:{ar:"ما المقصود بمصطلح: الوطن العربي؟", en:"What is “the Arab world”?"}, a:"مجموعة من ٢٢ دولة تقع في قارتي إفريقيا وآسيا يجمعها لغة وعادات وتقاليد واحدة وتاريخ مشترك", ae:"22 countries in Africa and Asia sharing language, customs and history"},
  {m:"ب / B", q:{ar:"أكمل: أكبر الدول العربية من حيث المساحة دولة .... بينما أصغرها دولة ....", en:"Complete: the biggest Arab country is .... and the smallest is ...."}, a:"الجزائر – البحرين", ae:"Algeria – Bahrain"},
  {m:"ب / B", q:{ar:"بم تفسر: تحكم الوطن العربي في طرق التجارة العالمية؟", en:"Why does the Arab world control world trade routes?"}, a:"لأنه يطل على مسطحات مائية مهمة ويتحكم في ممرات مائية مثل قناة السويس ومضيق هرمز وباب المندب وجبل طارق", ae:"It looks onto key seas and controls Suez, Hormuz, Bab el-Mandeb, Gibraltar"},
  {m:"ب / B", q:{ar:"دلل على صحة العبارة: للوطن العربي مكانة دينية مهمة.", en:"Prove: the Arab world has an important religious place."}, a:"لأنه مهد الديانات السماوية الثلاث وبه أماكن مقدسة مثل الكعبة المشرفة والمسجد الأقصى وكنيسة المهد", ae:"Cradle of 3 religions; Kaaba, Al-Aqsa, Church of the Nativity"},
  {m:"ب / B", q:{ar:"ما المقصود بمصطلح: الموقع الفلكي؟", en:"What is astronomical location?"}, a:"الموقع بالنسبة لخطوط الطول ودوائر العرض", ae:"Position by longitude and latitude"},
  {m:"ج / C", q:{ar:"أكمل: الجزء الأكبر من مساحة الوطن العربي يقع في الجناح .... والجزء الأصغر يقع في الجناح ....", en:"Complete: the bigger part is in the .... wing and the smaller in the .... wing."}, a:"الإفريقي – الآسيوي", ae:"African – Asian"},
  {m:"ج / C", q:{ar:"بم تفسر: الأهمية الاقتصادية للوطن العربي؟", en:"Explain its economic importance."}, a:"يطل على مسطحات مائية مهمة جعلته يتحكم في طرق التجارة العالمية، واتساع مساحته وتنوع موارده (المعادن والبترول) يساعد على تنوع الإنتاج", ae:"Key seas → trade; big area and resources → many products"},
  {m:"ج / C", q:{ar:"ما النتائج المترتبة على الموقع الفلكي للوطن العربي؟", en:"What results from its astronomical location?"}, a:"وقوع معظمه في نصف الكرة الشمالي، مما أثر على مناخه ونباتاته الطبيعية", ae:"Most of it is in the northern hemisphere, which shapes its climate and plants"},
  {m:"ج / C", q:{ar:"ما المقصود بمصطلح: الموقع الجغرافي؟", en:"What is geographic location?"}, a:"موقع الوطن العربي بالنسبة لليابس والماء", ae:"Position compared with land and water"}
 ]},
 // ---------------- Lesson 2 ----------------
 {lesson:"l2", src:"authored", title:{ar:"الدرس الثاني – الأداء الصفي (كتيب الأداءات والتقييمات)", en:"Lesson 2 – Classwork (assessment booklet)"}, qs:[
  {q:{ar:"نشأت تضاريس الوطن العربي نتيجة عوامل باطنية مثل .... و.... وعوامل سطحية مثل .... و....", en:"The landforms were made by inside forces like .... and .... and surface forces like .... and ...."}, a:"الالتواءات والانكسارات – الرياح والمياه", ae:"Folds and faults – wind and water"},
  {q:{ar:"من الجبال التي نشأت نتيجة حركات انكسارية في القشرة الأرضية جبال ....", en:"Mountains made by faults include the .... mountains."}, a:"البحر الأحمر (والحجاز وعسير ومرتفعات اليمن)", ae:"Red Sea (and Hijaz, Asir, Yemen highlands)"},
  {q:{ar:"صوّب الخطأ: يُعد جبل شايب البنات أعلى قمة جبلية بالوطن العربي.", en:"Fix: “Shayeb El Banat is the highest peak in the Arab world.”"}, a:"يُعد جبل توبقال أعلى قمة جبلية بالوطن العربي", ae:"TOUBKAL is the highest"},
  {q:{ar:"(صورة جبال البحر الأحمر) أي العبارات تعبر عن الصورة؟ أ) نشأت نتيجة حركات انكسارية ب) حركات التوائية ج) نحت الرياح د) نحت المياه", en:"(Picture: Red Sea Mountains) Which is true? a) faults b) folds c) wind d) water"}, a:"أ) نشأت نتيجة حركات انكسارية في القشرة الأرضية", ae:"a) made by faults"},
  {q:{ar:"بم تفسر: نشأة جبال أطلس بالوطن العربي؟", en:"Explain how the Atlas mountains formed."}, a:"نتيجة حركات التوائية تعرضت لها الأرض", ae:"By fold movements in the Earth"}
 ]},
 {lesson:"l2", title:{ar:"الدرس الثاني – تدريبات الدرس (ص٢٢–٢٣) – إجابات المعلم", en:"Lesson 2 – End-of-lesson exercises (pp. 22–23) – teacher's answers"}, qs:[
  {q:{ar:"اكتب مدلول الأرقام على الخريطة: ١ هضبة .. ٢ مرتفعات .. ٣ هضبة .. ٤ سهول .. ٥ جبال ..", en:"Name the numbers: 1 plateau, 2 highlands, 3 plateau, 4 plains, 5 mountains."}, a:"١ أفريقيا الشمالية – ٢ اليمن – ٣ نجد – ٤ نهر النيل – ٥ أطلس", ae:"1 North Africa, 2 Yemen, 3 Najd, 4 Nile, 5 Atlas"},
  {q:{ar:"(صورة واحة) ما اسم المظهر التضاريسي بالصورة؟", en:"(Picture of an oasis) What landform is it?"}, a:"واحة", ae:"An oasis"},
  {q:{ar:"اذكر أمثلة لهذا المظهر في الوطن العربي.", en:"Give examples in the Arab world."}, a:"واحة عين صالح في الجزائر وواحة سيوة في مصر", ae:"Ain Salah (Algeria) and Siwa (Egypt)"},
  {q:{ar:"ما أهم الأنشطة الاقتصادية به؟", en:"What work do people do there?"}, a:"الزراعة والرعي", ae:"Farming and herding"},
  {q:{ar:"صف موقع واحة سيوة في مصر وفسر أهميتها.", en:"Where is Siwa and why is it important?"}, a:"تقع في الصحراء الغربية في مصر – جوها الجاف يعالج بعض أمراض الجهاز التنفسي، ورمالها الساخنة تعالج الروماتيزم وآلام المفاصل، وعيونها الكبريتية تعالج الأمراض الجلدية", ae:"In Egypt's Western Desert; dry air, hot sand and sulphur springs treat illnesses", note:{ar:"لم يكتب المعلم إجابة لهذا الجزء؛ الإجابة من نص الكتاب.", en:"The teacher left this part blank; answer from the book text."}},
  {q:{ar:"اختر: تشكلت جبال أطلس بسبب (الحركات الانكسارية – الحركات الالتوائية – الثورات البركانية – التعرية المائية)", en:"Choose: Atlas was made by (faults / folds / volcanoes / water erosion)"}, a:"الحركات الالتوائية", ae:"Folds"},
  {q:{ar:"اختر: أعلى قمة في جبال أطلس هي جبل (أطلس التل – توبقال – سانت كاترين – شايب البنات)", en:"Choose: the highest Atlas peak is (Tell Atlas / Toubkal / St Catherine / Shayeb El Banat)"}, a:"توبقال", ae:"Toubkal"},
  {q:{ar:"اختر: توجد واحة عين صالح في دولة (مصر – ليبيا – الجزائر – السعودية)", en:"Choose: Ain Salah is in (Egypt / Libya / Algeria / Saudi Arabia)"}, a:"الجزائر", ae:"Algeria"},
  {q:{ar:"اختر: أكبر هضاب الوطن العربي مساحة هضبة (شمال إفريقيا – بادية الشام – نجد – حضرموت)", en:"Choose: the biggest plateau is (North Africa / Badiyat al-Sham / Najd / Hadramaut)"}, a:"شمال إفريقيا", ae:"North Africa"},
  {q:{ar:"اختر: أحد الجبال الانكسارية في الوطن العربي (أطلس – توبقال – مرتفعات اليمن – عمان)", en:"Choose: a FAULT mountain range (Atlas / Toubkal / Yemen highlands / Oman)"}, a:"مرتفعات اليمن", ae:"Yemen highlands"},
  {q:{ar:"بم تفسر: الأهمية الاقتصادية لمظاهر السطح في الوطن العربي؟", en:"Explain the economic importance of landforms."}, a:"يساعد تنوع مظاهر السطح على تنوع الموارد الطبيعية وبالتالي تنوع الأنشطة الاقتصادية", ae:"Varied landforms → varied resources → varied jobs"},
  {q:{ar:"بم تفسر: تنوع مظاهر السطح في الوطن العربي؟", en:"Why are the landforms so varied?"}, a:"بسبب اتساع المساحة ووجود عوامل باطنية وأخرى سطحية", ae:"Big area, plus inside and surface forces"},
  {q:{ar:"ما النتائج المترتبة على وجود المياه الجوفية في الواحات؟", en:"What results from groundwater in oases?"}, a:"أدى إلى تركز السكان وقيام الزراعة", ae:"People settle there and farm"},
  {q:{ar:"ما النتائج المترتبة على الحركات الانكسارية بالوطن العربي؟", en:"What did the fault movements produce?"}, a:"تكون جبال البحر الأحمر وعسير والحجاز واليمن", ae:"The Red Sea, Asir, Hijaz and Yemen mountains"},
  {q:{ar:"دلل على صحة العبارة: تتنوع استخدامات السهول الساحلية.", en:"Prove: coastal plains have many uses."}, a:"حيث إن سهول البحر المتوسط يقوم عليها الزراعة، وسهول البحر الأحمر والخليج العربي غنية بالثروات المعدنية ومصادر الطاقة", ae:"Mediterranean plains → farming; Red Sea and Gulf plains → minerals and energy"},
  {q:{ar:"ما العلاقة بين التضاريس والأنشطة الاقتصادية في الوطن العربي؟", en:"How are landforms linked to jobs?"}, a:"تنوع التضاريس يؤدي إلى تنوع الأنشطة الاقتصادية", ae:"More varied landforms → more kinds of work"}
 ]},
 {lesson:"l2", src:"book", title:{ar:"الدرس الثاني – تقييم بثلاثة نماذج (من تدريبات الكتاب)", en:"Lesson 2 – 3-model test (from the book's exercises)"}, qs:[
  {m:"أ / A", q:{ar:"أكمل: تمتد جبال أطلس في ثلاث دول هي .... و.... و....", en:"Complete: Atlas runs through 3 countries: ...., .... and ...."}, a:"تونس والجزائر والمغرب", ae:"Tunisia, Algeria, Morocco"},
  {m:"أ / A", q:{ar:"ما المقصود بالتعرية المائية؟", en:"What is water erosion?"}, a:"نحت الصخور ونقلها وإرسابها بواسطة المياه", ae:"Water carving, carrying and dropping rocks"},
  {m:"أ / A", q:{ar:"بم تفسر: قيام الزراعة في الواحات؟", en:"Why can people farm in oases?"}, a:"لوجود المياه الجوفية", ae:"Groundwater"},
  {m:"أ / A", q:{ar:"دلل: الهضاب أكثر مظاهر السطح انتشارًا في الوطن العربي.", en:"Prove: plateaus are the most widespread landform."}, a:"تنتشر في الجناحين مثل هضبة شمال إفريقيا (أكبرها) وبادية الشام ونجد وحضرموت", ae:"North Africa (biggest), Badiyat al-Sham, Najd, Hadramaut"},
  {m:"أ / A", q:{ar:"ماذا يحدث إذا لم توجد المياه الجوفية في الواحات؟", en:"What if oases had no groundwater?"}, a:"لا تقوم الزراعة ولا يتركز السكان", ae:"No farming and no people"},
  {m:"ب / B", q:{ar:"أكمل: تُعرف سلاسل جبال البحر الأحمر في الجناح الآسيوي باسم .... و....", en:"Complete: in the Asian wing the Red Sea mountain chains are called .... and ...."}, a:"جبال الحجاز وعسير (ومرتفعات اليمن)", ae:"Hijaz and Asir (and Yemen highlands)"},
  {m:"ب / B", q:{ar:"قارن بين جبال البحر الأحمر وجبال زاجروس.", en:"Compare the Red Sea Mountains and the Zagros."}, a:"جبال البحر الأحمر انكسارية نشأت من حركات انكسارية، وجبال زاجروس التوائية نشأت من حركات التوائية", ae:"Red Sea = fault mountains; Zagros = fold mountains"},
  {m:"ب / B", q:{ar:"ما المقصود بالأودية الجافة؟", en:"What are dry valleys?"}, a:"مجارٍ كانت تملؤها المياه قديمًا ثم جفت", ae:"Channels once full of water that dried up"},
  {m:"ب / B", q:{ar:"عدد استخدامات الأودية الجافة.", en:"List the uses of dry valleys."}, a:"طرق للنقل والمواصلات واستخراج المياه الجوفية", ae:"Roads/transport and getting groundwater"},
  {m:"ب / B", q:{ar:"اذكر مثالين للأودية الجافة.", en:"Give two dry valleys."}, a:"وادي العلاقي في مصر ووادي الدواسر في السعودية", ae:"Wadi Allaqi (Egypt), Wadi Al-Dawasir (Saudi Arabia)"},
  {m:"ج / C", q:{ar:"أكمل: تقع الكثبان الرملية .... بين مصر وليبيا.", en:"Complete: the .... dunes lie between Egypt and Libya."}, a:"بحر الرمال العظيم", ae:"Great Sand Sea"},
  {m:"ج / C", q:{ar:"استنتج أوجه التشابه بين السهول الفيضية والسهول الساحلية.", en:"How are flood plains and coastal plains alike?"}, a:"كلاهما أرض مستوية أو شبه مستوية ذات تربة خصبة تصلح للزراعة ويتركز بها السكان", ae:"Both flat, fertile, good for farming, crowded"},
  {m:"ج / C", q:{ar:"بم تفسر: تكوّن الكثبان الرملية؟", en:"How were sand dunes formed?"}, a:"بفعل التعرية الهوائية (الرياح)", ae:"By wind erosion"},
  {m:"ج / C", q:{ar:"وضح أهمية الجبال.", en:"Why are mountains important?"}, a:"استخراج المعادن ومواد البناء، والمناظر الخلابة التي تجذب السياح", ae:"Minerals, building materials, tourism"},
  {m:"ج / C", q:{ar:"حدد هضاب الجناح الآسيوي.", en:"Name the Asian wing's plateaus."}, a:"بادية الشام في الشمال، ونجد في الوسط، وحضرموت في الجنوب", ae:"Badiyat al-Sham (N), Najd (middle), Hadramaut (S)"}
 ]},
 // ---------------- Lesson 3 ----------------
 {lesson:"l3", title:{ar:"الدرس الثالث – تدريبات الدرس (ص٢٨–٢٩) – إجابات المعلم", en:"Lesson 3 – End-of-lesson exercises (pp. 28–29) – teacher's answers"}, qs:[
  {q:{ar:"قارن بين الأقاليم المناخية (مناطق الانتشار – الخصائص المناخية – النبات والحيوان).", en:"Compare the three climate regions (where – climate – plants and animals)."}, a:"المتوسط: شمال الوطن العربي – حار جاف صيفًا دافئ ممطر شتاءً – حشائش الإستبس وأشجار الزيتون والأرز.\nالصحراوي الحار: الوسط – شديد الحرارة صيفًا شديد البرودة شتاءً نادر المطر – نباتات شوكية وأعشاب قصيرة.\nالمداري: جنوب الوطن العربي – حار ممطر صيفًا معتدل جاف شتاءً – حشائش السافانا وأشجار السنط.", ae:"Mediterranean: north; hot dry summer, warm rainy winter; steppe, olive, cedar. Desert: middle; very hot summer, very cold winter, rare rain; thorny plants, short grass. Tropical: south; hot rainy summer, mild dry winter; savanna, acacia."},
  {q:{ar:"صواب أم خطأ: تعيش الأسود في الغابات الاستوائية.", en:"True or false: lions live in equatorial forests."}, a:"خطأ – تعيش في حشائش السافانا", ae:"False – in the savanna"},
  {q:{ar:"صواب أم خطأ: يسود المناخ الصحراوي في معظم أراضي الوطن العربي.", en:"True or false: desert climate covers most of the Arab world."}, a:"صواب", ae:"True"},
  {q:{ar:"صواب أم خطأ: تنمو أشجار السنط (الصمغ العربي) في الغابات المدارية.", en:"True or false: acacia (gum arabic) trees grow in tropical forests."}, a:"صواب", ae:"True"},
  {q:{ar:"صواب أم خطأ: تعيش الإبل في المناطق الصحراوية.", en:"True or false: camels live in deserts."}, a:"صواب", ae:"True"},
  {q:{ar:"صواب أم خطأ: تقع مدينة الإسكندرية في الإقليم المداري.", en:"True or false: Alexandria is in the tropical region."}, a:"خطأ – في إقليم البحر المتوسط", ae:"False – Mediterranean region"},
  {q:{ar:"(خريطة) رقم (١) دولة تقع أطرافها الشمالية في إقليم البحر المتوسط ....", en:"(Map) Number 1 is a country whose north is Mediterranean: ...."}, a:"الجزائر", ae:"Algeria"},
  {q:{ar:"رقم (٢) إقليم مناخي يسود الوطن العربي ....", en:"Number 2 is the climate covering most of the Arab world: ...."}, a:"الإقليم الصحراوي", ae:"Desert region"},
  {q:{ar:"رقم (٣) إقليم يمتد في الأطراف الشمالية ....", en:"Number 3 is the region along the north edge: ...."}, a:"إقليم البحر المتوسط", ae:"Mediterranean region"},
  {q:{ar:"رقم (٤) إقليم يمتد في جنوب الوطن العربي ....", en:"Number 4 is the region in the south: ...."}, a:"الإقليم المداري", ae:"Tropical region"},
  {q:{ar:"بم تفسر: نمو النباتات الشوكية في المناطق الصحراوية؟", en:"Why do thorny plants grow in deserts?"}, a:"بسبب ندرة الأمطار في المناطق الصحراوية", ae:"Because rain is rare"},
  {q:{ar:"بم تفسر: تغطية الثلوج للجبال في بعض الدول العربية؟", en:"Why is there snow on some Arab mountains?"}, a:"كلما ارتفعنا ١٥٠ مترًا عن سطح البحر انخفضت درجة الحرارة درجة واحدة", ae:"Every 150 m up, it gets 1°C colder"},
  {q:{ar:"بم تفسر: الأهمية الاقتصادية لمناخ الوطن العربي؟", en:"Explain the economic importance of the climate."}, a:"تنوع المحاصيل الزراعية والنباتات الطبيعية وتنشيط السياحة البيئية وتحقيق التكامل بين الدول العربية من خلال تبادل المحاصيل والمنتجات", ae:"Varied crops, eco-tourism, trade between Arab countries"},
  {q:{ar:"ما النتائج المترتبة على انتشار المناخ الصحراوي في معظم أنحاء الوطن العربي؟", en:"What results from desert climate covering most of the Arab world?"}, a:"أدى إلى اقتصار النباتات الطبيعية على النباتات الشوكية والصبار والأعشاب الفقيرة وندرة الأمطار وانتشار الكثبان الرملية", ae:"Only thorny plants, cactus and poor grass; rare rain; sand dunes"},
  {q:{ar:"ما النتائج المترتبة على تنوع الأقاليم المناخية في الوطن العربي؟", en:"What results from having several climate regions?"}, a:"أدى ذلك إلى تنوع النباتات الطبيعية والحيوانات البرية والمحاصيل الزراعية", ae:"Varied plants, wild animals and crops"},
  {q:{ar:"يُعد الإقليم المداري حديقة حيوان طبيعية. فسّر.", en:"Why is the tropical region called a natural zoo?"}, a:"لأنه تعيش به حيوانات كثيرة مثل الزراف والأسود والنمور والأفيال في حشائش السافانا", ae:"Giraffes, lions, tigers and elephants live in its savanna", note:{ar:"لم يكتب المعلم إجابة لهذا الجزء؛ الإجابة من نص الكتاب.", en:"Teacher left this blank; answer from the book."}}
 ]},
 {lesson:"l3", src:"book", title:{ar:"الدرس الثالث – تقييم بثلاثة نماذج (من الكتاب)", en:"Lesson 3 – 3-model test (from the book)"}, qs:[
  {m:"أ / A", q:{ar:"أكمل: كلما ارتفعنا .... مترًا عن سطح البحر تنخفض الحرارة درجة واحدة.", en:"Complete: every .... m up, it gets 1°C colder."}, a:"١٥٠", ae:"150"},
  {m:"أ / A", q:{ar:"ما المقصود بالإقليم المناخي؟", en:"What is a climate region?"}, a:"مساحة من الأرض لها نفس الخصائص المناخية من حيث الحرارة والمطر", ae:"Area with the same heat and rain"},
  {m:"أ / A", q:{ar:"وضح سبب اختلاف درجة الحرارة بين مدينة الإسكندرية ومدينة الرياض.", en:"Why are Alexandria and Riyadh different in temperature?"}, a:"الإسكندرية قريبة من البحر فمناخها معتدل، والرياض بعيدة عن المسطحات المائية (داخلية) فهي شديدة الحرارة صيفًا وشديدة البرودة شتاءً", ae:"Alexandria is by the sea (mild); Riyadh is inland (very hot summer, very cold winter)"},
  {m:"أ / A", q:{ar:"ماذا يحدث لو كان الوطن العربي كله قريبًا من دائرة الاستواء؟", en:"What if the whole Arab world were near the Equator?"}, a:"يصبح مناخه كله حارًا ولا يوجد المناخ المعتدل في الأجزاء الشمالية", ae:"It would all be hot – no mild north"},
  {m:"ب / B", q:{ar:"اذكر العوامل المؤثرة في مناخ الوطن العربي.", en:"Name the factors controlling the climate."}, a:"الموقع الفلكي – الموقع بالنسبة للمسطحات المائية – مظاهر السطح", ae:"Astronomical location, distance from water, landforms"},
  {m:"ب / B", q:{ar:"وضح العلاقة بين اتجاه الجبال وكمية المطر.", en:"How does mountain direction affect rain?"}, a:"السفوح المواجهة للرياح المحملة ببخار الماء أغزر مطرًا من السفوح الداخلية مثل جبال أطلس", ae:"Slopes facing wet winds get more rain (Atlas)"},
  {m:"ب / B", q:{ar:"دلل: يختلف النبات الطبيعي باختلاف كمية المطر.", en:"Prove: plants change with the amount of rain."}, a:"في الإقليم الصحراوي تنمو الأعشاب القصيرة في المناطق قليلة المطر والنباتات الشوكية في المناطق نادرة المطر، وتتدرج حشائش السافانا في الطول حسب كمية المطر", ae:"Short grass where rain is little, thorny plants where rare; savanna grass taller with more rain"},
  {m:"ب / B", q:{ar:"سجّل أسماء بعض المدن العربية التي تنتمي لإقليم البحر المتوسط.", en:"Name some Arab cities in the Mediterranean region."}, a:"الإسكندرية – بيروت – تونس – الجزائر (العاصمة)", ae:"Alexandria, Beirut, Tunis, Algiers"},
  {m:"ج / C", q:{ar:"أكمل: تُربى الأغنام والماعز على حشائش ....", en:"Complete: sheep and goats graze on .... grass."}, a:"الإستبس", ae:"Steppe"},
  {m:"ج / C", q:{ar:"بم تفسر: تغطية الجليد لبعض قمم الجبال المرتفعة؟", en:"Why is there ice on some high peaks?"}, a:"لأنه كلما ارتفعنا ١٥٠ مترًا عن سطح البحر تنخفض درجة الحرارة درجة واحدة", ae:"1°C colder every 150 m"},
  {m:"ج / C", q:{ar:"ما أشجار الغابات المعتدلة في إقليم البحر المتوسط؟", en:"Which trees grow in Mediterranean forests?"}, a:"الزيتون والأرز", ae:"Olive and cedar"},
  {m:"ج / C", q:{ar:"وضح تأثير المناخ على تنوع الأنشطة الاقتصادية.", en:"How does climate affect the economy?"}, a:"تنوع المحاصيل الزراعية، تنشيط السياحة البيئية، التكامل بين الدول العربية بتبادل المحاصيل والمنتجات", ae:"Varied crops, eco-tourism, Arab trade"}
 ]},
 // ---------------- Lesson 4 ----------------
 {lesson:"l4", src:"authored", title:{ar:"الدرس الرابع – تدريبات الدرس (ص٣٥–٣٦)", en:"Lesson 4 – End-of-lesson exercises (pp. 35–36)"}, qs:[
  {q:{ar:"ما النتائج المترتبة على التصحر؟", en:"What does desertification cause?"}, a:"اختفاء النباتات وتدهور الأراضي الزراعية (تناقص قدرتها على الإنتاج)", ae:"Plants disappear and farmland gets worse"},
  {q:{ar:"فسّر: الرعي الجائر يسبب التصحر.", en:"Why does overgrazing cause desertification?"}, a:"لأن الحيوانات تأكل النباتات بكثرة فتختفي وتتدهور الأرض وتقل قدرتها على الإنتاج", ae:"Animals eat too many plants, so the land is stripped and gets poorer"},
  {q:{ar:"ما النتائج المترتبة على السيول في الوطن العربي؟", en:"What do flash floods cause?"}, a:"تجرف التربة وتدمر المباني والبنية التحتية وتتلف المحاصيل وتسبب خسائر في الأرواح والممتلكات وانتشار الأمراض", ae:"Wash away soil, destroy buildings and crops, kill people, spread disease"},
  {q:{ar:"بم تفسر: بناء السدود وسيلة لمواجهة السيول؟", en:"Why are dams a way to deal with floods?"}, a:"لأنها تحجز مياه السيول وتقلل خطورتها ويُستفاد منها في الزراعة", ae:"They hold flood water back and the water is used for farming"},
  {q:{ar:"فسّر: تلوث الهواء يؤثر على صحة الإنسان.", en:"Why does air pollution affect health?"}, a:"لأنه يسبب أمراضًا تنفسية", ae:"It causes breathing illnesses"},
  {q:{ar:"ما النتائج المترتبة على استمرار تلوث الهواء في المدن؟", en:"What if city air stays polluted?"}, a:"انتشار الأمراض التنفسية وإيذاء النباتات والحيوانات وتغيرات في المناخ على المدى الطويل", ae:"Breathing illness, harm to plants and animals, climate change"},
  {q:{ar:"اقترح ثلاث طرق لمواجهة تلوث الهواء.", en:"Suggest three ways to fight air pollution."}, a:"الاعتماد على الطاقة المتجددة – زيادة المساحات الخضراء – النقل المستدام – إعادة تدوير النفايات", ae:"Renewable energy, more green spaces, clean transport, recycling"},
  {q:{ar:"أكمل: يؤدي تلوث الهواء إلى الإضرار بـ ....", en:"Complete: air pollution harms ...."}, a:"صحة الإنسان (والنباتات والحيوانات)", ae:"Human health (and plants and animals)"},
  {q:{ar:"أكمل: يمكن مواجهة ندرة المياه من خلال تحسين شبكات .... و....", en:"Complete: fight water shortage by improving .... and .... networks."}, a:"المياه والصرف الصحي", ae:"Water and sewage"},
  {q:{ar:"أكمل: تحدث ندرة المياه العذبة بسبب .... و....", en:"Complete: fresh-water shortage is caused by .... and ...."}, a:"قلة سقوط الأمطار وزيادة عدد السكان (وسوء إدارة الموارد المائية)", ae:"Little rain and more people (and bad water management)"},
  {q:{ar:"أكمل: أحد أسباب السيول في الوطن العربي ....", en:"Complete: one cause of flash floods is ...."}, a:"سقوط أمطار غزيرة وفجائية", ae:"Heavy, sudden rain"},
  {q:{ar:"أكمل: أحد أسباب تلوث الهواء في الوطن العربي ....", en:"Complete: one cause of air pollution is ...."}, a:"حرق النفايات (أو العواصف الرملية – النشاط الصناعي)", ae:"Burning rubbish (or sandstorms, factories)"},
  {q:{ar:"صواب أم خطأ: السيول وتلوث الهواء من آثار التغير المناخي.", en:"True or false: floods and air pollution are effects of climate change."}, a:"صواب", ae:"True"},
  {q:{ar:"صواب أم خطأ: اعتمدت كل دول الوطن العربي على طرق ري حديثة.", en:"True or false: ALL Arab countries use modern irrigation."}, a:"خطأ – بعضها ما زال يستخدم طرق الري التقليدية", ae:"False – some still use old irrigation"},
  {q:{ar:"صواب أم خطأ: تؤثر السيول على حياة السكان.", en:"True or false: floods affect people's lives."}, a:"صواب", ae:"True"},
  {q:{ar:"صواب أم خطأ: العواصف الرملية تُعتبر من أسباب تلوث الهواء.", en:"True or false: sandstorms are a cause of air pollution."}, a:"صواب", ae:"True"},
  {q:{ar:"بم تفسر: يعاني الوطن العربي من قلة المياه العذبة؟", en:"Why is fresh water scarce in the Arab world?"}, a:"قلة سقوط الأمطار وسوء إدارة الموارد المائية باستخدام طرق الري التقليدية وزيادة عدد السكان", ae:"Little rain, old irrigation, more people"},
  {q:{ar:"بم تفسر: استخدام طرق الري الحديثة؟", en:"Why use modern irrigation?"}, a:"لترشيد استهلاك المياه ومواجهة ندرة المياه", ae:"To save water"},
  {q:{ar:"بم تفسر: استخدام النقل المستدام؟", en:"Why use sustainable transport?"}, a:"لمواجهة تلوث الهواء", ae:"To cut air pollution"},
  {q:{ar:"ما النتائج المترتبة على زيادة النشاط الصناعي؟", en:"What does more industry cause?"}, a:"زيادة تلوث الهواء", ae:"More air pollution"},
  {q:{ar:"ما النتائج المترتبة على استخدام التكنولوجيا في التنبؤ بحدوث السيول؟", en:"What happens when technology predicts floods?"}, a:"الاستعداد للسيول وتقليل أضرارها والخسائر في الأرواح والممتلكات", ae:"People get ready, so less damage and fewer deaths"},
  {q:{ar:"دلل: قطع الأشجار يؤدي إلى زيادة التصحر.", en:"Prove: cutting trees increases desertification."}, a:"لأن قطع الأشجار من أسباب التصحر فيقل الغطاء النباتي وتتدهور الأراضي الزراعية", ae:"Fewer trees → poorer land"},
  {q:{ar:"دلل: السيول تسبب خسائر بشرية ومادية.", en:"Prove: floods cause human and material losses."}, a:"تسبب خسائر في الأرواح والممتلكات وتدمر البنية التحتية وتتلف المحاصيل", ae:"Deaths, lost property, broken roads, ruined crops"},

  if(buf.trim())out.push([lang||(AR.test(buf)?"ar":"en"),buf]);return out}
 let queue=[],audio=null,gen=0;
 function chunks(t,n){const out=[];let c="";for(const w of t.split(" ")){if((c+" "+w).length>n&&c){out.push(c);c=w}else c=c?c+" "+w:w}if(c)out.push(c);return out}
 function done(){if(cur)cur.classList.remove("ra-reading");document.getElementById("ra-stop").style.display="none"}
 function next(g){if(g!==gen)return;const it=queue.shift();if(!it)return done();
  const v=pick(it.l);
  if(it.l==="ar"&&!v){ // no Arabic voice on this device (e.g. Chrome on Linux): use Google Translate speech
   audio=new Audio("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ar&ttsspeed="+(rate<0.8?0.5:1)+"&q="+encodeURIComponent(it.t));
   audio.playbackRate=rate>1?1.1:1;audio.onended=audio.onerror=()=>next(g);audio.play().catch(()=>next(g));return}
  const u=new SpeechSynthesisUtterance(it.t);u.lang=it.l==="ar"?"ar-EG":"en-GB";if(v)u.voice=v;u.rate=rate;u.onend=u.onerror=()=>next(g);speechSynthesis.speak(u)}
 function stop(){gen++;queue=[];speechSynthesis.cancel();if(audio){audio.pause();audio=null}done()}
 function speak(text,el){stop();cur=el||null;if(cur)cur.classList.add("ra-reading");
  const parts=runs(String(text).replace(/[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}️‍]/gu,""));if(!parts.length)return;
  document.getElementById("ra-stop").style.display="inline-block";
  parts.forEach(([l,t])=>chunks(t.trim(),l==="ar"&&!pick("ar")?180:600).forEach(c=>queue.push({l,t:c})));next(gen)}
 window.RA={speak};
 const SEL="h1,h2,h3,h4,p,li,td,th,summary,label,.q,.opt,.tile,.info,.ans,.exam,.en,.fact>div,.note,.fa,.fb,.result,.say-text,button,div";
 document.addEventListener("click",e=>{if(!on)return;const bar=e.target.closest("#ra-bar");if(bar)return;
  let el=e.target.closest(SEL);while(el&&el.tagName==="DIV"&&el.children.length>6)el=null;
  if(!el)el=e.target;const txt=(el.innerText||el.textContent||"").trim();if(!txt)return;
  e.preventDefault();e.stopPropagation();speak(txt.slice(0,1200),el)},true);
 document.getElementById("ra-toggle").onclick=()=>{on=!on;document.body.classList.toggle("ra-on",on);if(!on){stop()}else speak(document.documentElement.lang==="en"?"Tap any words to hear them. Tap the green button again to stop.":"اضغط على أي كلام لتسمعه")};
 document.getElementById("ra-stop").onclick=stop;
 document.getElementById("ra-speed").onclick=e=>{rate=speeds[(speeds.indexOf(rate)+1)%speeds.length];e.target.textContent=(rate===0.75?"🐢 ":rate===1.1?"🐇 ":"")+rate+"×"};
 speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{};
})();
</script>
