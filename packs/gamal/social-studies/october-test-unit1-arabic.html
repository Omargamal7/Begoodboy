<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مراجعة الدراسات – الوحدة الأولى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#f1e3c8;--accent:#f59e0b;--good:#16a34a;--bad:#dc2626;--blue:#2563eb;--sea:#bfe3ff;--sand:#f5d79a;--soft:#fef3c7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,Cairo,system-ui,sans-serif;font-size:17px;line-height:1.6}
html[lang=ar] body{font-family:Cairo,system-ui,sans-serif}
.ar{font-family:Cairo,system-ui,sans-serif;direction:rtl;unicode-bidi:isolate}
header{background:linear-gradient(135deg,#f59e0b,#ef4444 55%,#8b5cf6);color:#fff;padding:14px 16px 10px;position:sticky;top:0;z-index:20;box-shadow:0 4px 14px #0002}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1000px;margin:auto}
h1{font-size:1.25rem;margin:0;flex:1;min-width:200px;line-height:1.3}
.pill{background:#fff3;border-radius:999px;padding:4px 12px;font-weight:800;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:10px;padding:6px 10px;font-size:1rem;cursor:pointer}
.ibtn.off{opacity:.45}
nav{display:flex;gap:6px;overflow-x:auto;max-width:1000px;margin:10px auto 0;padding-bottom:2px;scrollbar-width:none}
nav button{border:0;background:#fff3;color:#fff;font:inherit;font-weight:800;padding:8px 12px;border-radius:12px 12px 0 0;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--bg);color:#b45309}
main{max-width:1000px;margin:auto;padding:16px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 0 var(--line),0 6px 18px #0000000d;border:2px solid var(--line)}
h2{margin:.2em 0 .4em;font-size:1.35rem}
h3{margin:.2em 0;font-size:1.1rem}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.mission{cursor:pointer;text-align:center;transition:transform .15s}
.mission:hover{transform:translateY(-3px) rotate(-1deg)}
.mission .big{font-size:2.6rem}
.bar{height:10px;background:#eee;border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#84cc16);width:0;transition:width .4s}
.btn{border:0;font:inherit;font-weight:800;border-radius:12px;padding:9px 16px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 3px 0 #b45309;margin:4px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b45309}
.btn.ghost{background:#fff;color:#92400e;border:2px solid #fcd34d;box-shadow:none}
.btn.blue{background:var(--blue);box-shadow:0 3px 0 #1e40af}
.btn.green{background:var(--good);box-shadow:0 3px 0 #166534}
.btn.red{background:var(--bad);box-shadow:0 3px 0 #991b1b}
.tabs2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tabs2 .btn{background:#fff;color:#374151;border:2px solid var(--line);box-shadow:none}
.tabs2 .btn.on{background:#fde68a;border-color:#f59e0b}
.fact{border-inline-start:6px solid var(--c,#f59e0b);background:#fffdf7}
.fact h3{display:flex;gap:8px;align-items:center;justify-content:space-between}
.say{border:0;background:#fef3c7;border-radius:50%;width:34px;height:34px;cursor:pointer;flex:none}
.exam{background:#ecfdf5;border:2px dashed #34d399;border-radius:12px;padding:8px 12px;margin-top:8px;font-size:.98rem}
.exam b{color:#047857}
.bookonly{display:inline-block;background:#ede9fe;color:#6d28d9;border-radius:8px;padding:0 8px;font-size:.8rem;font-weight:800}
.widget{background:#f0f9ff;border:2px solid #bae6fd}
svg{max-width:100%;height:auto;display:block;margin:auto;direction:ltr}
.info{min-height:70px;background:#fff;border-radius:12px;padding:10px 14px;border:2px solid #e5e7eb;margin-top:10px}
.q{font-weight:800;font-size:1.08rem}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:start;border:2px solid #e5e7eb;background:#fff;border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer}
.opt:hover{border-color:#f59e0b}
.opt.ok{background:#dcfce7;border-color:#16a34a}
.opt.no{background:#fee2e2;border-color:#dc2626}
.ans{display:none;background:#ecfdf5;border-radius:12px;padding:10px 14px;margin-top:8px;white-space:pre-line}
.ans.show{display:block;animation:pop .25s}
.note{background:#fff7ed;border:2px solid #fdba74;border-radius:10px;padding:6px 10px;font-size:.9rem;margin-top:6px}
.sq{border-bottom:2px dashed var(--line);padding:12px 0}
.sq:last-child{border:0}
.tag{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:8px;padding:0 8px;font-size:.8rem;font-weight:800;margin-inline-end:6px}
.done-ok{color:var(--good);font-weight:900}
.done-no{color:var(--bad);font-weight:900}
details.sheet{margin:10px 0}
details.sheet summary{cursor:pointer;font-weight:800;font-size:1.05rem;padding:6px 0}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:2px solid #e5e7eb;border-radius:12px;padding:10px;background:#fff;cursor:pointer;font:inherit;min-height:56px}
.tile.sel{border-color:#2563eb;background:#dbeafe}
.tile.gone{visibility:hidden}
.tile.wrong{animation:shake .3s;border-color:#dc2626}
.flip{perspective:900px;cursor:pointer;height:170px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-weight:800}
.flip .fa{background:linear-gradient(135deg,#fde68a,#fca5a5)}
.flip .fb{background:#ecfdf5;transform:rotateY(180deg);font-weight:600;font-size:.95rem}
.big-emoji{font-size:3rem;text-align:center}
.result{text-align:center;font-size:1.3rem;font-weight:900}
.stars{font-size:2.2rem;letter-spacing:4px}
table{border-collapse:collapse;width:100%}
td,th{border:1px solid #e5e7eb;padding:8px;text-align:start;vertical-align:top}
th{background:#fef3c7}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) scale(.8);background:#111827;color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;opacity:0;transition:.25s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.clocks{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;text-align:center}
input[type=range]{width:100%}
.timer{height:8px;background:#e5e7eb;border-radius:9px;overflow:hidden}
.timer i{display:block;height:100%;background:#f97316}
.mapwrap{position:relative}
.place{cursor:pointer}
.place:hover circle{r:9}
.region{cursor:pointer;transition:filter .15s}
.region:hover{filter:brightness(1.08) saturate(1.2)}
.flash{animation:flash .8s 2}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes flash{50%{opacity:.25}}
.hide{display:none}
.en{direction:ltr;text-align:left;background:#eaf3ff;border-inline-start:4px solid #3b82f6;border-radius:10px;padding:6px 10px;margin-top:6px;font-family:Nunito,system-ui,sans-serif;font-size:.95rem;color:#1e3a8a;line-height:1.5}
.en .say2{border:0;background:#dbeafe;border-radius:50%;width:28px;height:28px;cursor:pointer;margin-right:4px}
.eno{font-family:Nunito,system-ui,sans-serif;color:#1d4ed8;font-weight:600}
.phase{background:linear-gradient(90deg,#fde68a,#fff);border-radius:14px;padding:10px 16px;margin:22px 0 6px;font-size:1.25rem;font-weight:900}
.model{border:3px solid #c7d2fe}
.model>h3{background:#e0e7ff;margin:-16px -16px 10px;padding:10px 16px;border-radius:15px 15px 0 0}
.srcbook{background:#ede9fe;color:#5b21b6;border-radius:8px;padding:2px 8px;font-size:.8rem;font-weight:800}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.kid{font-size:1.4rem}
@media (max-width:600px){body{font-size:16px}.pairs{gap:6px}.tile{padding:8px;font-size:.9rem}h1{font-size:1.05rem}}
@media print{header,nav,.btn,.say{display:none!important}.ans{display:block!important}.card{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<header>
 <div class="hrow">
  <h1>🇪🇬 مراجعة الدراسات الاجتماعية – الوحدة الأولى: مصر موقع متميز وطبيعة متنوعة</h1>
  <span class="pill" id="starPill">⭐ 0</span>
  <button class="ibtn" id="sndBtn" title="sound">🔊</button>
 </div>
 <nav id="nav"></nav>
</header>
<main id="main"></main>
<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>
<script>
const LANG="ar",HY=false,MODE="test",ONE=-1;

// Bilingual content: {ar, en}. "ex" = the Arabic words to write in the exam.
const DATA = {
lessons: [
 {id:"l1", icon:"🌍", color:"#2563eb",
  title:{ar:"الدرس الأول: موقع مصر الفلكي", en:"Lesson 1: Egypt's Astronomical Location"},
  pages:{ar:"الكتاب ص ٨–١٣", en:"Book pages 8–13"},
  facts:[
   {h:{ar:"شبكة الإحداثيات", en:"The coordinate grid"},
    t:{ar:"شبكة الإحداثيات هي خطوط الطول ودوائر العرض.", en:"The coordinate grid = lines of longitude + circles of latitude."},
    ex:"شبكة الإحداثيات: خطوط الطول ودوائر العرض"},
   {h:{ar:"خطوط الطول", en:"Lines of longitude"},
    t:{ar:"أنصاف دوائر رأسية تصل بين القطبين الشمالي والجنوبي. عددها ٣٦٠ خطًّا. الخط الرئيسي: خط جرينتش (صفر). أهميتها: تحديد المواقع شرقًا وغربًا ومعرفة فرق التوقيت.", en:"Vertical HALF-circles joining the North and South Poles. There are 360 of them. The main one is Greenwich (0°). Use: finding places east/west and working out the time difference."},
    ex:"أنصاف دوائر رأسية تصل بين القطب الشمالي والقطب الجنوبي – ٣٦٠ خط – خط جرينتش – تفيد في تحديد المواقع وفرق التوقيت"},
   {h:{ar:"دوائر العرض", en:"Circles of latitude"},
    t:{ar:"دوائر أفقية غير متساوية الطول تُرسم حول الكرة الأرضية. عددها ١٨٠ دائرة. الدائرة الرئيسية: دائرة الاستواء (صفر). أهميتها: تحديد المواقع شمالًا وجنوبًا ودراسة المناخ.", en:"Horizontal circles of DIFFERENT lengths drawn around the globe. There are 180 of them. The main one is the Equator (0°). Use: finding places north/south and studying climate."},
    ex:"دوائر أفقية غير متساوية الطول تُرسم حول الكرة الأرضية – ١٨٠ دائرة – دائرة الاستواء – تفيد في تحديد المواقع ومعرفة المناخ"},
   {h:{ar:"وجه الشبه", en:"How they are alike"},
    t:{ar:"كلاهما خطوط وهمية رسمها العلماء على الخرائط والمجسمات لتحديد موقع الأماكن بدقة.", en:"Both are IMAGINARY lines that scientists drew on maps and globes to find places exactly."},
    ex:"كلاهما خطوط وهمية تساعد في تحديد المواقع"},
   {h:{ar:"دوران الأرض", en:"Earth spinning"},
    t:{ar:"تدور الأرض حول نفسها مرة كل ٢٤ ساعة من الغرب إلى الشرق، فتشرق الشمس على المناطق الشرقية قبل الغربية. لو توقفت لن يحدث تعاقب الليل والنهار.", en:"Earth spins on itself once every 24 hours from WEST to EAST, so the Sun rises first on eastern places. If it stopped, day and night would not take turns."},
    ex:"تدور الأرض حول نفسها مرة كل ٢٤ ساعة من الغرب إلى الشرق"},
   {h:{ar:"فرق التوقيت", en:"Time difference"},
    t:{ar:"الفرق بين كل خط طول والذي يليه ٤ دقائق، وكل ١٥° = ساعة واحدة. المدن شرق جرينتش تسبقها في التوقيت. القاهرة على خط ٣٠° شرقًا، فهي تسبق لندن بساعتين.", en:"Each line of longitude is 4 minutes from the next, so 15° = 1 hour. Cities EAST of Greenwich are AHEAD in time. Cairo is on 30°E, so Cairo is 2 hours ahead of London."},
    ex:"الفرق الزمني بين كل خط طول والذي يليه ٤ دقائق – كل ١٥° = ساعة",
    book:true},
   {h:{ar:"دوائر العرض الرئيسية", en:"The main circles of latitude"},
    t:{ar:"دائرة الاستواء (صفر) تقسم الأرض لنصفين شمالي وجنوبي متساويين – مدار السرطان ٢٣٫٥° شمالًا – مدار الجدي ٢٣٫٥° جنوبًا – الدائرة القطبية الشمالية ٦٦٫٥° شمالًا – الدائرة القطبية الجنوبية ٦٦٫٥° جنوبًا. أكبرها دائرة الاستواء.", en:"Equator 0° (cuts Earth into equal north and south halves, and it is the BIGGEST) – Tropic of Cancer 23.5°N – Tropic of Capricorn 23.5°S – Arctic Circle 66.5°N – Antarctic Circle 66.5°S."},
    ex:"دائرة الاستواء – مدار السرطان – مدار الجدي – الدائرة القطبية الشمالية – الدائرة القطبية الجنوبية"},
   {h:{ar:"موقع مصر الفلكي", en:"Egypt's astronomical location"},
    t:{ar:"الموقع الفلكي: الموقع بالنسبة لخطوط الطول ودوائر العرض. تقع مصر بين دائرتي عرض ٢٢° و٣١° ٣٦َ شمالًا، وبين خطي طول ٢٥° و٣٧° شرق جرينتش. يمر مدار السرطان بجنوب مصر. مصر في النصف الشمالي والشرقي للكرة الأرضية.", en:"Astronomical location = location using longitude and latitude. Egypt lies between latitudes 22° and 31°36′ NORTH, and longitudes 25° and 37° EAST of Greenwich. The Tropic of Cancer passes through SOUTH Egypt. Egypt is in the northern and eastern halves of the Earth."},
    ex:"الموقع الفلكي: الموقع بالنسبة لخطوط الطول ودوائر العرض"},
   {h:{ar:"المصريون القدماء والفلك", en:"Ancient Egyptians and astronomy"},
    t:{ar:"اهتم المصريون القدماء بعلم الفلك واستخدموه في تحديد المواقع وتوقيت الزراعة وتنظيم الأعياد الدينية وبناء الأهرامات.", en:"Ancient Egyptians cared about astronomy. They used it to find places, time farming, organise religious festivals and build the pyramids."},
    ex:"استخدموا علم الفلك في تحديد المواقع ومواقيت الزراعة وتنظيم الأعياد الدينية وبناء الأهرامات"}
  ]},
 {id:"l2", icon:"🏜️", color:"#d97706",
  title:{ar:"الدرس الثاني: مظاهر سطح مصر", en:"Lesson 2: Egypt's Landforms"},
  pages:{ar:"الكتاب ص ١٤–٢١", en:"Book pages 14–21"},
  facts:[
   {h:{ar:"أربع وحدات تضاريسية", en:"Four landform regions"},
    t:{ar:"ينقسم سطح مصر إلى: ١) وادي النيل والدلتا ومنخفض الفيوم ٢) الصحراء الغربية ٣) الصحراء الشرقية ٤) شبه جزيرة سيناء.", en:"Egypt's surface has 4 parts: 1) the Nile Valley, Delta and Fayoum Depression 2) the Western Desert 3) the Eastern Desert 4) the Sinai Peninsula."},
    ex:"وادي النيل والدلتا ومنخفض الفيوم – الصحراء الغربية – الصحراء الشرقية – شبه جزيرة سيناء"},
   {h:{ar:"وادي النيل والدلتا ومنخفض الفيوم", en:"Nile Valley, Delta and Fayoum"},
    t:{ar:"أصغر أقسام سطح مصر مساحة. الدلتا: أرض خصبة كوّنها النيل من ترسيب الطمي عند المصب، شكلها مثلث، وبها حوالي نصف الأراضي الزراعية. وادي النيل: يمتد من الحدود الجنوبية حتى القاهرة. منخفض الفيوم: تصله مياه النيل والطمي عن طريق ترعة بحر يوسف، لذلك هو بيئة زراعية رغم وقوعه في الصحراء الغربية.", en:"The SMALLEST region. The Delta: fertile land made by the Nile dropping silt (طمي) at its mouth. It is a triangle and has about HALF of Egypt's farmland. The Nile Valley runs from the southern border up to CAIRO. The Fayoum Depression gets Nile water through the Bahr Youssef canal, so it is farmland even though it is in the Western Desert."},
    ex:"منخفض الفيوم يتصل بنهر النيل عن طريق ترعة بحر يوسف"},
   {h:{ar:"الصحراء الغربية", en:"The Western Desert"},
    t:{ar:"أكبر الوحدات التضاريسية مساحة، ويغلب عليها المظهر الهضبي. الهضاب: الجلف الكبير (جنوبًا) ومارمريكا (شمال غرب). الجبال: جبل العوينات (جنوب غرب). الكثبان الرملية: بحر الرمال العظيم. المنخفضات: أكبرها منخفض القطارة وهو نادر السكان، ومنخفضات مأهولة لوجود المياه الجوفية: سيوة – الداخلة – الخارجة – البحرية – الفرافرة.", en:"The BIGGEST region, mostly PLATEAUS (flat high land). Plateaus: Gilf Kebir (south) and Marmarica (north-west). Mountain: Gebel Uweinat (south-west). Sand dunes: the Great Sand Sea. Depressions: the biggest is QATTARA and almost nobody lives there (no water). People live in Siwa, Dakhla, Kharga, Bahariya and Farafra because of GROUNDWATER (المياه الجوفية)."},
    ex:"أكبر الوحدات مساحة – يغلب عليها المظهر الهضبي – منخفض القطارة أكبر منخفض ونادر السكان لندرة المياه"},
   {h:{ar:"الصحراء الشرقية", en:"The Eastern Desert"},
    t:{ar:"صحراء جبلية هضبية. الهضاب: هضبة المعازة (شمالًا) والعبابدة (جنوبًا). الجبال: سلسلة جبال البحر الأحمر وأعلى قممها جبل شايب البنات. الأودية الجافة: كانت تملؤها المياه قديمًا ثم جفت مثل وادي قنا، وتُستخدم لتخزين مياه السيول. غنية بالمعادن كالذهب وبها البترول والغاز الطبيعي.", en:"Mountains + plateaus. Plateaus: Ma'aza (north) and Ababda (south). Mountains: the Red Sea Mountains, and the highest peak is Gebel Shayeb El Banat. Dry valleys: valleys that had water long ago and then dried up, like Wadi Qena. They are used to STORE flash-flood water. Rich in minerals like GOLD, and has OIL and natural GAS."},
    ex:"غنية بالمعادن كالذهب ومصادر الطاقة كالبترول والغاز الطبيعي – الأودية الجافة تستخدم في تخزين مياه السيول"},
   {h:{ar:"شبه جزيرة سيناء", en:"The Sinai Peninsula"},
    t:{ar:"الجنوب: جبال وعرة مثل جبل سانت كاترين وجبل موسى. الوسط: هضاب مثل هضبة التيه تقطعها أودية جافة مثل وادي العريش. الشمال: سهول ساحلية وبعض الجبال مثل جبل الحلال.", en:"SOUTH: rugged mountains like St Catherine and Mount Musa (Moses). MIDDLE: plateaus like the Tih Plateau, cut by dry valleys like Wadi El Arish. NORTH: coastal plains and some mountains like Gebel El Halal."},
    ex:"الجنوب: جبل سانت كاترين وجبل موسى – الوسط: هضبة التيه – الشمال: السهول الساحلية وجبل الحلال"},
   {h:{ar:"عوامل تشكيل سطح مصر", en:"What shaped Egypt's surface"},
    t:{ar:"العوامل الباطنية: تحدث في باطن الأرض مثل الالتواءات والانكسارات، والانكسارات كونت جبال البحر الأحمر. العوامل الخارجية: تحدث على سطح الأرض مثل التعرية بفعل الرياح (كونت الكثبان الرملية) والتعرية المائية (كونت وادي النيل والأودية الجافة).", en:"INSIDE forces (العوامل الباطنية) happen under the ground: folds and FAULTS (الانكسارات). Faults made the Red Sea Mountains. OUTSIDE forces (العوامل الخارجية) happen on the surface: WIND erosion made the sand dunes, and WATER erosion (التعرية المائية) made the Nile Valley and the dry valleys."},
    ex:"العوامل الباطنية: الالتواءات والانكسارات – العوامل الخارجية: التعرية بفعل الرياح والتعرية المائية"},
   {h:{ar:"نتائج تنوع السطح", en:"Why the variety matters"},
    t:{ar:"أدى تنوع مظاهر السطح إلى تنوع الثروات الطبيعية وتعدد الأنشطة الاقتصادية، والمناظر الخلابة تجذب السياح. ساهمت الزراعة في استقرار المصري القديم حول النيل وقيام الحضارة. استثمر المصريون القدماء الصحاري فأخذوا منها الذهب والنحاس والحديد.", en:"Different landforms gave Egypt many natural resources and many kinds of jobs, and beautiful views bring tourists. Farming made ancient Egyptians settle around the Nile and build their civilisation. They also took gold, copper and iron from the deserts."},
    ex:"أدى ذلك إلى تنوع الثروات الطبيعية وتعدد الأنشطة الاقتصادية"},
   {h:{ar:"الصحراء البيضاء والسوداء", en:"The White and Black Deserts"},
    t:{ar:"الصحراء البيضاء في واحة الفرافرة بالوادي الجديد: تكوينات صخرية جيرية شكلتها الرياح. الصحراء السوداء في الوادي الجديد: يغطيها اللون الأسود من بقايا انفجارات بركانية قديمة.", en:"The White Desert (Farafra, New Valley) has white limestone rocks shaped by the wind. The Black Desert (New Valley) is covered in black rocks left by old volcanoes."},
    book:true}
  ]},
 {id:"l3", icon:"⛅", color:"#059669",
  title:{ar:"الدرس الثالث: مناخ مصر", en:"Lesson 3: Egypt's Climate"},
  pages:{ar:"الكتاب ص ٢٢–٢٩", en:"Book pages 22–29"},
  facts:[
   {h:{ar:"الطقس والمناخ", en:"Weather vs climate"},
    t:{ar:"الطقس: وصف حالة الجو (الحرارة والرياح والأمطار) خلال فترة زمنية قصيرة قد تكون يومًا أو أسبوعًا أو شهرًا. المناخ: وصف حالة الجو خلال فترة زمنية طويلة قد تكون فصلًا أو سنة.", en:"WEATHER: what the air is like (heat, wind, rain) over a SHORT time: a day, a week or a month. CLIMATE: the same thing over a LONG time: a season or a year."},
    ex:"الطقس: حالة الجو من حيث الحرارة والرياح والأمطار في فترة زمنية قصيرة – المناخ: ... في فترة زمنية طويلة"},
   {h:{ar:"العوامل المؤثرة في مناخ مصر", en:"What controls Egypt's climate"},
    t:{ar:"١) الموقع الفلكي: سبب وقوع معظم مصر في الإقليم الصحراوي الحار. ٢) القرب أو البعد عن المسطحات المائية: المناطق القريبة من البحر معتدلة الحرارة عن الداخلية. ٣) مظاهر السطح: الحرارة ترتفع في المنخفضات مثل الوديان وتنخفض فوق المرتفعات مثل جبل سانت كاترين.", en:"1) ASTRONOMICAL LOCATION: the reason most of Egypt is in the hot desert climate. 2) DISTANCE FROM WATER: places near the sea are milder than places inland. 3) LANDFORMS: it is hotter in low places like valleys and colder on high places like Mount St Catherine."},
    ex:"الموقع الفلكي – القرب أو البعد عن المسطحات المائية – مظاهر السطح"},
   {h:{ar:"الدورة السنوية", en:"The yearly trip"},
    t:{ar:"تتعاقب فصول السنة الأربعة بانتظام بسبب دوران الأرض حول الشمس مرة كل ٣٦٥ يومًا وربع، وهي الدورة السنوية.", en:"The four seasons come in order because Earth goes around the Sun once every 365¼ days. This is the yearly cycle (الدورة السنوية)."},
    ex:"بسبب دوران الأرض حول الشمس مرة كل ٣٦٥ يومًا وربع (الدورة السنوية)"},
   {h:{ar:"❄️ الشتاء – ٢١ ديسمبر", en:"❄️ Winter – 21 December"},
    t:{ar:"تتعامد الشمس على مدار الجدي. مناخ بارد خاصة في المناطق الجبلية المرتفعة والداخلية، وتسقط الأمطار على معظم أنحاء مصر، وفي بعض المناطق ثلوج مثل جبل سانت كاترين.", en:"The Sun is straight over the Tropic of CAPRICORN. Cold, especially on high mountains and inland. Rain falls on most of Egypt, and there is snow in some places like Mount St Catherine."},
    ex:"تتعامد الشمس على مدار الجدي"},
   {h:{ar:"🌸 الربيع – ٢١ مارس", en:"🌸 Spring – 21 March"},
    t:{ar:"تتعامد الشمس على دائرة الاستواء. مناخ معتدل مع نشاط الرياح خاصة رياح الخماسين المحملة بالرمال والأتربة التي تسبب أمراض الجهاز التنفسي وتضر المحاصيل. لذلك لا يُعد الربيع أفضل الفصول في مصر.", en:"The Sun is straight over the EQUATOR. Mild, but windy: the KHAMASEEN winds carry sand and dust. They cause breathing illnesses and harm crops, so spring is NOT the best season in Egypt."},
    ex:"تتعامد الشمس على دائرة الاستواء – رياح الخماسين المحملة بالرمال والأتربة"},
   {h:{ar:"☀️ الصيف – ٢١ يونيو", en:"☀️ Summer – 21 June"},
    t:{ar:"تتعامد الشمس على مدار السرطان. ارتفاع الحرارة خاصة في المناطق الداخلية والجنوبية، مع اعتدالها فوق الجبال والسواحل الشمالية.", en:"The Sun is straight over the Tropic of CANCER. Hot, especially inland and in the south, but milder on mountains and on the north coast."},
    ex:"تتعامد الشمس على مدار السرطان"},
   {h:{ar:"🍂 الخريف – ٢٣ سبتمبر", en:"🍂 Autumn – 23 September"},
    t:{ar:"تتعامد الشمس على دائرة الاستواء. مناخ معتدل، وقد تسقط أمطار في بعض المناطق خاصة الشرقية عند جبال البحر الأحمر وسيناء.", en:"The Sun is straight over the EQUATOR again. Mild. Some rain may fall, especially in the east on the Red Sea Mountains and Sinai."},
    ex:"تتعامد الشمس على دائرة الاستواء"},
   {h:{ar:"الإقليم المناخي", en:"Climate region"},
    t:{ar:"الإقليم المناخي: مساحة من الأرض لها نفس الخصائص المناخية من حيث الحرارة والرياح والمطر.", en:"A climate region (إقليم مناخي) is an area of land with the SAME climate: the same heat, wind and rain."},
    ex:"مساحة من الأرض لها نفس الخصائص المناخية من حيث الحرارة والرياح والأمطار"},
   {h:{ar:"إقليمان في مصر", en:"Egypt's two climate regions"},
    t:{ar:"إقليم البحر المتوسط: في شمال مصر، حار جاف صيفًا دافئ ممطر شتاءً، والزراعة فيه على مياه الأمطار الشتوية. الإقليم الصحراوي الحار: يمتد في معظم مصر، شديد الحرارة صيفًا بارد شتاءً، والأمطار نادرة وقد تسقط فجأة على شكل سيول.", en:"MEDITERRANEAN region: the NORTH of Egypt. Hot and dry in summer, warm and rainy in winter, and farms use the winter rain. HOT DESERT region: covers MOST of Egypt. Very hot in summer, cold in winter, and rain is rare but can suddenly come as flash floods (سيول)."},
    ex:"إقليم البحر المتوسط: شمال مصر، حار جاف صيفًا دافئ ممطر شتاءً – الإقليم الصحراوي الحار: معظم مصر، شديد الحرارة صيفًا بارد شتاءً والأمطار نادرة"},
   {h:{ar:"حقائق تاريخية", en:"History facts"},
    t:{ar:"عرف المصريون القدماء التقويم الشمسي وقسموا العام إلى ٣٦٥ يومًا، وقسموا السنة الزراعية إلى ثلاثة فصول: الفيضان والزراعة والحصاد. ساعد مناخ مصر الجاف على بقاء الآثار صامدة آلاف السنين.", en:"Ancient Egyptians made a SUN calendar of 365 days, and split the farming year into 3 seasons: flood, planting and harvest. Egypt's DRY climate kept the monuments safe for thousands of years."},
    book:true}
  ]}
],

 {lesson:"l1", title:{ar:"الدرس الأول – الواجب (ص٥)", en:"Lesson 1 – Homework (p.5)"}, qs:[

  {q:{ar:"قارن بين خطوط الطول ودوائر العرض من حيث: التعريف – الأهمية – العدد – الخط الرئيسي.", en:"Compare longitude and latitude: definition, use, number, main line."}, a:"خطوط الطول: أنصاف دوائر رأسية تصل بين القطب الشمالي والقطب الجنوبي – تفيد في تحديد المواقع وفرق التوقيت – ٣٦٠ خط – خط جرينتش.\nدوائر العرض: دوائر أفقية غير متساوية تُرسم حول الكرة الأرضية – تفيد في تحديد المواقع ومعرفة المناخ – ١٨٠ دائرة – دائرة الاستواء.", ae:"Longitude: vertical half-circles pole to pole, places + time, 360, Greenwich. Latitude: horizontal unequal circles, places + climate, 180, Equator."}
 ]},

  {q:{ar:"ما دائرة العرض رقم (٢) جنوب الاستواء؟ وما درجتها؟", en:"Which circle is number (2), south of the Equator? What is its degree?"}, a:"مدار الجدي – ٢٣٫٥° جنوبًا", ae:"Tropic of Capricorn – 23.5° south"},
  {q:{ar:"لدوائر العرض الرئيسية في النصف الشمالي نظير في النصف الجنوبي. دلل.", en:"Each main circle in the north has a twin in the south. Prove it."}, a:"مدار السرطان ومدار الجدي – الدائرة القطبية الشمالية والدائرة القطبية الجنوبية – القطب الشمالي والقطب الجنوبي", ae:"Cancer ↔ Capricorn, Arctic ↔ Antarctic Circle, North Pole ↔ South Pole"},
  {q:{ar:"أي دوائر العرض الرئيسية تمر في مصر؟", en:"Which main circle of latitude passes through Egypt?"}, a:"مدار السرطان (في جنوب مصر)", ae:"The Tropic of Cancer (in south Egypt)"},
  {q:{ar:"ما المقصود بمصطلح الموقع الفلكي؟", en:"What is 'astronomical location'?"}, a:"الموقع بالنسبة لخطوط الطول ودوائر العرض", ae:"Location using longitude and latitude"},
  {q:{ar:"كان لعلم الفلك دور مهم في حياة المصريين القدماء. دلل.", en:"Astronomy mattered to ancient Egyptians. Prove it."}, a:"حيث استخدموا علم الفلك في تحديد المواقع ومواقيت الزراعة وتنظيم الأعياد الدينية وبناء الأهرامات", ae:"They used it to find places, time farming, organise festivals and build the pyramids"},
  {q:{ar:"تتشابه خطوط الطول ودوائر العرض. برهن.", en:"Longitude and latitude are alike. Show how."}, a:"كلاهما خطوط وهمية تساعد في تحديد المواقع", ae:"Both are imaginary lines that help find places"}
 ]},
 {lesson:"l1", src:"book", title:{ar:"الدرس الأول – تقييم بثلاثة نماذج (من تدريبات الكتاب ص١٢–١٣)", en:"Lesson 1 – 3-model test (from the book's exercises p.12–13)"}, qs:[
  {m:"أ / A", q:{ar:"أكمل: يمر مدار السرطان في مصر جهة ....", en:"Complete: the Tropic of Cancer crosses Egypt in the ...."}, a:"الجنوب", ae:"South"},
  {m:"أ / A", q:{ar:"اختر: يبلغ الفرق الزمني بين كل خط طول والذي يليه (دقيقة واحدة – أربع دقائق – سبع دقائق – عشر دقائق)", en:"Choose: the time gap between one longitude line and the next is (1 / 4 / 7 / 10 minutes)"}, a:"أربع دقائق", ae:"4 minutes"},
  {m:"أ / A", q:{ar:"صواب أم خطأ مع التصحيح: تقع مصر جنوب دائرة الاستواء.", en:"True or false (and fix it): Egypt is south of the Equator."}, a:"خطأ – تقع مصر شمال دائرة الاستواء", ae:"False – Egypt is NORTH of the Equator"},
  {m:"أ / A", q:{ar:"ما المقصود بالموقع الفلكي؟", en:"What is astronomical location?"}, a:"الموقع بالنسبة لخطوط الطول ودوائر العرض", ae:"Location using longitude and latitude"},
  {m:"أ / A", q:{ar:"ماذا يحدث إذا توقف دوران الأرض حول نفسها؟", en:"What if Earth stopped spinning on itself?"}, a:"لا يحدث تعاقب الليل والنهار", ae:"Day and night would stop taking turns"},
  {m:"ب / B", q:{ar:"أكمل: دائرة العرض الرئيسية التي تقسم الكرة الأرضية لنصفين متساويين هي ....", en:"Complete: the main circle that cuts Earth into two equal halves is ...."}, a:"دائرة الاستواء", ae:"The Equator"},
  {m:"ب / B", q:{ar:"اختر: يُعرف خط الطول الرئيسي باسم (مدار السرطان – مدار الجدي – خط الاستواء – خط جرينتش)", en:"Choose: the main longitude line is called (Cancer / Capricorn / Equator / Greenwich)"}, a:"خط جرينتش", ae:"Greenwich"},
  {m:"ب / B", q:{ar:"صواب أم خطأ مع التصحيح: عدد خطوط الطول أقل من عدد دوائر العرض.", en:"True or false (and fix it): there are fewer longitude lines than latitude circles."}, a:"خطأ – عدد خطوط الطول ٣٦٠ وعدد دوائر العرض ١٨٠", ae:"False – longitude 360, latitude 180"},
  {m:"ب / B", q:{ar:"بم تفسر: أهمية خطوط الطول؟", en:"Explain: why are lines of longitude important?"}, a:"تحديد المواقع شرقًا وغربًا ومعرفة فروق التوقيت بين الدول", ae:"To find places east/west and know time differences"},
  {m:"ب / B", q:{ar:"مباراة تبدأ الساعة ٦ مساءً بتوقيت لندن (خط صفر). كم الساعة في القاهرة (خط ٣٠° شرقًا)؟ علمًا بأن كل ١٥° = ساعة.", en:"A match starts 6 pm London time (0°). What time in Cairo (30° east)? 15° = 1 hour."}, a:"الساعة ٨ مساءً (٣٠ ÷ ١٥ = ساعتان، والقاهرة شرق جرينتش فتسبق)", ae:"8 pm (30 ÷ 15 = 2 hours, Cairo is east so it is ahead)"},
  {m:"ج / C", q:{ar:"أكمل: تقع مصر بين خطي طول .... و.... شرق جرينتش.", en:"Complete: Egypt lies between longitudes .... and .... east of Greenwich."}, a:"٢٥° و٣٧°", ae:"25° and 37°"},
  {m:"ج / C", q:{ar:"اختر: درجة مدار الجدي (٢٣٫٥° جنوبًا – ٦٦٫٥° جنوبًا – صفر)", en:"Choose: the Tropic of Capricorn is at (23.5°S / 66.5°S / 0°)"}, a:"٢٣٫٥° جنوبًا", ae:"23.5° south"},
  {m:"ج / C", q:{ar:"صواب أم خطأ: تتشابه الدائرة القطبية الشمالية والدائرة القطبية الجنوبية في نفس الدرجة.", en:"True or false: the Arctic and Antarctic Circles have the same degree."}, a:"صواب – كلاهما ٦٦٫٥°", ae:"True – both 66.5°"},
  {m:"ج / C", q:{ar:"حدد أوجه الشبه والاختلاف بين خط جرينتش ودائرة الاستواء.", en:"How are Greenwich and the Equator alike and different?"}, a:"الشبه: كلاهما خط رئيسي وهمي درجته صفر ويساعد في تحديد المواقع.\nالاختلاف: خط جرينتش خط طول رأسي يمتد من القطب الشمالي إلى الجنوبي، ودائرة الاستواء دائرة عرض أفقية تمتد من الشرق إلى الغرب وتقسم الأرض لنصفين شمالي وجنوبي.", ae:"Alike: both are imaginary main lines at 0°. Different: Greenwich is a vertical longitude line pole to pole; the Equator is a horizontal latitude circle east–west splitting north and south."},
  {m:"ج / C", q:{ar:"اشرح لماذا تسبق المدن الواقعة شرق خط جرينتش في التوقيت المدن الواقعة غربه.", en:"Why are cities east of Greenwich ahead in time?"}, a:"لأن الأرض تدور حول نفسها من الغرب إلى الشرق فتشرق الشمس على المناطق الشرقية أولًا", ae:"Earth spins west to east, so the Sun rises first in the east"}
 ]},

  {q:{ar:"منطقة تعد بيئة زراعية رغم وقوعها في الصحراء الغربية.", en:"A farming area even though it is in the Western Desert."}, a:"منخفض الفيوم", ae:"The Fayoum Depression"},
  {q:{ar:"ما سبب تركز السكان في المنطقة رقم (٢) (منخفض في الصحراء الغربية)؟", en:"Why do people live in area (2), a depression in the Western Desert?"}, a:"المياه الجوفية", ae:"Groundwater"},
  {q:{ar:"اكتب أحد أسباب تكون المنطقة رقم (٣) (وادي النيل).", en:"Give one reason area (3), the Nile Valley, formed."}, a:"التعرية المائية", ae:"Water erosion"},
  {q:{ar:"ما العلاقة بين الزراعة والحضارة المصرية القديمة؟", en:"How is farming linked to ancient Egyptian civilisation?"}, a:"ساهمت الزراعة في استقرار المصريين القدماء حول نهر النيل وقيام الحضارة المصرية القديمة", ae:"Farming made them settle around the Nile and build the civilisation"},
  {q:{ar:"قدم توقعًا في حال كانت المنطقة رقم (٤) خالية من المياه وتربتها رملية.", en:"Predict: what if area (4) had no water and sandy soil?"}, a:"عدم قيام الزراعة وعدم تركز السكان", ae:"No farming and few people would live there"},
  {q:{ar:"ماذا يحدث إذا لم تصل ترعة بحر يوسف بين نهر النيل ومنخفض الفيوم؟", en:"What if Bahr Youssef did not join the Nile to Fayoum?"}, a:"لن يصبح بيئة زراعية وسيكون بيئة صحراوية", ae:"It would be desert, not farmland"},
  {q:{ar:"تتمتع مصر بتنوع مظاهر سطحها وطبيعتها الخلابة. دلل.", en:"Egypt has many different, beautiful landforms. Prove it."}, a:"حيث يجري بها نهر النيل وعلى جانبيه السهول الفيضية والسهول الساحلية والصحاري الشاسعة والجبال الشاهقة", ae:"The Nile with flood plains on both sides, coastal plains, huge deserts and high mountains"}
 ]},
 {lesson:"l2", title:{ar:"الدرس الثاني – الفترة الثانية: الصحراء الغربية (ص٦–٧)", en:"Lesson 2 – Period 2: Western Desert (p.6–7)"}, qs:[
  {q:{ar:"ضع رقم (١) على أكبر الوحدات التضاريسية في مصر مساحة.", en:"Put (1) on Egypt's biggest landform region."}, a:"الصحراء الغربية", ae:"The Western Desert"},
  {q:{ar:"عن أي مظاهر السطح يعبر رقم (٢)؟ (منخفض الفيوم – منخفض القطارة – هضبة الجلف – هضبة مارمريكا)", en:"Which landform is number (2)? (Fayoum / Qattara / Gilf / Marmarica)"}, a:"منخفض الفيوم", ae:"The Fayoum Depression"},
  {q:{ar:"ما أكبر منخفض بمصر وأين يوجد؟", en:"What is Egypt's biggest depression and where is it?"}, a:"منخفض القطارة بالصحراء الغربية", ae:"Qattara Depression, in the Western Desert"},
  {q:{ar:"صحح: معظم أراضي الصحراء الغربية ذات طبيعة جبلية.", en:"Fix: \"Most of the Western Desert is mountains.\""}, a:"معظم أراضي الصحراء الغربية ذات طبيعة هضبية", ae:"Most of it is PLATEAU (هضبية)"},
  {q:{ar:"تتنوع مظاهر السطح بالصحراء الغربية. دلل.", en:"The Western Desert has many landforms. Prove it."}, a:"حيث يوجد بها الهضاب والجبال والمنخفضات والكثبان الرملية", ae:"It has plateaus, mountains, depressions and sand dunes"},
  {q:{ar:"يتركز السكان في منخفض البحرية. اذكر السبب.", en:"People live in the Bahariya Depression. Why?"}, a:"لوجود المياه الجوفية", ae:"Because there is groundwater"}
 ]},
 {lesson:"l2", title:{ar:"الدرس الثاني – التقييم الأسبوعي: الوادي والصحراء الغربية (ص٧–٨)", en:"Lesson 2 – Weekly test: Valley & Western Desert (p.7–8)"}, qs:[
  {m:"أ / A", q:{ar:"أكمل: من أمثلة الكثبان الرملية بالصحراء الغربية ....", en:"Complete: an example of sand dunes in the Western Desert is ...."}, a:"بحر الرمال العظيم", ae:"The Great Sand Sea"},
  {m:"أ / A", q:{ar:"أين توجد هضبة مارمريكا؟", en:"Where is the Marmarica Plateau?"}, a:"شمال غرب الصحراء الغربية", ae:"North-west of the Western Desert"},
  {m:"أ / A", q:{ar:"تعد التربة في منطقة وادي النيل والدلتا تربة رملية. دلل على خطأ العبارة.", en:"\"The soil in the Nile Valley and Delta is sandy.\" Show it is wrong."}, a:"خطأ، حيث أنها تربة خصبة تكونت من رواسب طمي النيل", ae:"Wrong: it is FERTILE soil made from Nile silt"},
  {m:"أ / A", q:{ar:"يندر السكان في منخفض القطارة. اذكر السبب.", en:"Few people live in Qattara. Why?"}, a:"لندرة المياه", ae:"Because water is scarce"},
  {m:"أ / A", q:{ar:"ماذا يحدث إذا كانت مساحة الأراضي الزراعية في الدلتا أكبر مما هي عليه الآن؟", en:"What if the Delta had more farmland than now?"}, a:"سوف يزيد الإنتاج الزراعي وعدد السكان", ae:"More crops and more people"},
  {m:"ب / B", q:{ar:"أكمل: يمتد وادي النيل في مصر حتى مدينة .... شمالًا.", en:"Complete: the Nile Valley stretches north up to the city of ...."}, a:"القاهرة", ae:"Cairo"},
  {m:"ب / B", q:{ar:"أين يوجد جبل العوينات؟", en:"Where is Gebel Uweinat?"}, a:"جنوب غرب الصحراء الغربية", ae:"South-west of the Western Desert"},
  {m:"ب / B", q:{ar:"يتركز السكان في منخفض القطارة. دلل على خطأ العبارة.", en:"\"Many people live in Qattara.\" Show it is wrong."}, a:"منخفض القطارة غير مأهول بالسكان لندرة المياه", ae:"Qattara is almost empty because there is little water"},
  {m:"ب / B", q:{ar:"يعد منخفض الفيوم أحد مناطق البيئة الزراعية رغم وقوعه في الصحراء الغربية. اذكر السبب.", en:"Fayoum is farmland even though it is in the Western Desert. Why?"}, a:"لأنه يتصل بنهر النيل عن طريق ترعة بحر يوسف", ae:"It is joined to the Nile by the Bahr Youssef canal"},
  {m:"ب / B", q:{ar:"ماذا يحدث إذا كانت معظم أراضي مصر ذات طبيعة جبلية؟", en:"What if most of Egypt were mountains?"}, a:"عدم وجود بيئة زراعية ووعورة السطح", ae:"No farmland and very rough land"},
  {m:"ج / C", q:{ar:"أكمل: تتركز نصف مساحة الأراضي الزراعية في منطقة ....", en:"Complete: half of Egypt's farmland is in the ...."}, a:"الدلتا", ae:"Delta"},
  {m:"ج / C", q:{ar:"أين يوجد منخفض سيوة؟", en:"Where is the Siwa Depression?"}, a:"بالصحراء الغربية", ae:"In the Western Desert"},
  {m:"ج / C", q:{ar:"يغلب على صحراء مصر الغربية المظهر الجبلي. دلل على خطأ العبارة.", en:"\"The Western Desert is mostly mountains.\" Show it is wrong."}, a:"يغلب عليها المظهر الهضبي لكثرة الهضاب بها مثل مارمريكا والجلف الكبير", ae:"It is mostly plateaus, like Marmarica and Gilf Kebir"},
  {m:"ج / C", q:{ar:"يتركز السكان في منخفض سيوة. اذكر السبب.", en:"People live in Siwa. Why?"}, a:"لوجود المياه الجوفية", ae:"Because of groundwater"},
  {m:"ج / C", q:{ar:"ماذا يحدث إذا كانت طبيعة منخفض الداخلة مثل طبيعة منخفض القطارة؟", en:"What if Dakhla were like Qattara?"}, a:"يصبح غير مأهول بالسكان", ae:"Nobody would live there"}
 ]},
 {lesson:"l2", title:{ar:"تابع الدرس الثاني – الصحراء الشرقية (ص٨)", en:"Lesson 2 cont. – Eastern Desert (p.8)"}, qs:[
  {q:{ar:"يشير رقم (١) إلى وادٍ جاف في الصحراء الشرقية وهو ....", en:"Number (1) is a dry valley in the Eastern Desert. It is ...."}, a:"وادي قنا", ae:"Wadi Qena"},
  {q:{ar:"ما الظاهرة التي تكونت بفعل الانكسارات في الصحراء الشرقية؟", en:"Which landform in the Eastern Desert was made by faults?"}, a:"جبال البحر الأحمر – تكونت بفعل الانكسارات", ae:"The Red Sea Mountains – made by faults (الانكسارات)", note:{ar:"ورقة الإجابة فيها خطأ نسخ في هذا السؤال؛ الإجابة هنا من الكتاب ص١٩.", en:"The answer sheet has a copy slip on this item; this answer is from the book, p.19."}},
  {q:{ar:"صحح: من المظاهر المميزة للصحراء الشرقية كثرة المنخفضات والجبال.", en:"Fix: \"The Eastern Desert has many depressions and mountains.\""}, a:"من المظاهر المميزة للصحراء الشرقية كثرة الهضاب والجبال", ae:"Many PLATEAUS and mountains (not depressions)"},
  {q:{ar:"بم تفسر: أهمية الأودية الجافة؟", en:"Explain: why are dry valleys important?"}, a:"تستخدم في تخزين مياه السيول", ae:"They store flash-flood water"},
  {q:{ar:"للصحراء الشرقية أهمية اقتصادية كبيرة. دلل.", en:"The Eastern Desert is valuable for the economy. Prove it."}, a:"غنية بالمعادن كالذهب ومصادر الطاقة كالبترول والغاز الطبيعي", ae:"Rich in minerals like gold, and energy like oil and natural gas"}
 ]},
 {lesson:"l2", title:{ar:"الدرس الثاني – سيناء وعوامل تشكيل السطح (ص٩)", en:"Lesson 2 – Sinai & what shaped the land (p.9)"}, qs:[
  {q:{ar:"اكتب نتيجة واحدة مترتبة على تنوع مظاهر سطح مصر.", en:"Give one result of Egypt having many landforms."}, a:"أدى ذلك إلى تنوع الثروات الطبيعية وتعدد الأنشطة الاقتصادية", ae:"Many natural resources and many kinds of work"},
  {q:{ar:"يغلب على شبه جزيرة سيناء المظهر الهضبي. دلل.", en:"Sinai has plateaus. Prove it."}, a:"لوجود الهضاب في الوسط مثل هضبة التيه", ae:"Plateaus in the middle, like the Tih Plateau"},
  {q:{ar:"قارن بين العوامل الباطنية والخارجية لتشكيل سطح الأرض (التعريف – مثال).", en:"Compare inside and outside forces (definition + example)."}, a:"الباطنية: تحدث في باطن الأرض مثل الالتواءات والانكسارات – مثال: الانكسارات التي شكلت جبال البحر الأحمر.\nالخارجية: تحدث على سطح الأرض مثل تعرية الرياح والتعرية المائية – مثال: الكثبان الرملية بفعل الرياح، ووادي النيل والأودية الجافة بفعل التعرية المائية.", ae:"Inside: under the ground (folds, faults) → Red Sea Mountains. Outside: on the surface (wind, water erosion) → dunes; Nile Valley and dry valleys."},
  {q:{ar:"تتنوع مظاهر سطح شبه جزيرة سيناء. دلل.", en:"Sinai has many landforms. Prove it."}, a:"حيث توجد الجبال في الجنوب مثل جبل سانت كاترين وجبل موسى، وفي الوسط الهضاب مثل هضبة التيه، وفي الشمال السهول الساحلية وبعض الجبال مثل جبل الحلال", ae:"South: St Catherine and Musa mountains. Middle: Tih Plateau. North: coastal plains and Gebel El Halal."}
 ]},
 {lesson:"l2", title:{ar:"الدرس الثاني – التقييم الأسبوعي: الصحراء الشرقية وسيناء (ص١٠)", en:"Lesson 2 – Weekly test: Eastern Desert & Sinai (p.10)"}, qs:[
  {m:"أ / A", q:{ar:"أكمل: من أشهر الهضاب شمال الصحراء الشرقية ....", en:"Complete: a famous plateau in the north of the Eastern Desert is ...."}, a:"هضبة المعازة", ae:"The Ma'aza Plateau"},
  {m:"أ / A", q:{ar:"اكتب مثالًا للأودية الجافة في شبه جزيرة سيناء.", en:"Give an example of a dry valley in Sinai."}, a:"وادي العريش", ae:"Wadi El Arish"},
  {m:"أ / A", q:{ar:"بم تفسر: الأهمية الاقتصادية للصحراء الشرقية؟", en:"Explain the Eastern Desert's economic importance."}, a:"غنية بالمعادن مثل الذهب ومصادر الطاقة مثل البترول والغاز الطبيعي", ae:"Gold, oil and natural gas"},
  {m:"أ / A", q:{ar:"اكتب ثلاثة من مظاهر السطح بشبه جزيرة سيناء.", en:"Write three landforms in Sinai."}, a:"الجبال – الهضاب – السهول الساحلية – الأودية الجافة", ae:"Mountains, plateaus, coastal plains, dry valleys"},
  {m:"ب / B", q:{ar:"أكمل: أعلى قمم جبال البحر الأحمر جبل ....", en:"Complete: the highest Red Sea mountain is Gebel ...."}, a:"شايب البنات", ae:"Shayeb El Banat"},
  {m:"ب / B", q:{ar:"وضح الأهمية الاقتصادية لوادي قنا.", en:"What is Wadi Qena useful for?"}, a:"يخزن مياه السيول", ae:"Storing flash-flood water"},
  {m:"ب / B", q:{ar:"بم تفسر: تكون وادي النيل؟", en:"Explain how the Nile Valley formed."}, a:"بسبب التعرية المائية", ae:"By water erosion"},
  {m:"ب / B", q:{ar:"تعد الصحراء الشرقية صحراء جبلية هضبية. دلل.", en:"The Eastern Desert is mountains + plateaus. Prove it."}, a:"لوجود جبال البحر الأحمر والهضاب مثل هضبة المعازة والعبابدة", ae:"Red Sea Mountains and the Ma'aza and Ababda plateaus"},
  {m:"ب / B", q:{ar:"اكتب اسم العامل الذي ساعد في تشكيل وادي العريش.", en:"What shaped Wadi El Arish?"}, a:"التعرية المائية", ae:"Water erosion"},
  {m:"ج / C", q:{ar:"أكمل: من أشهر الجبال التي تتواجد شمال سيناء جبل ....", en:"Complete: a famous mountain in north Sinai is Gebel ...."}, a:"الحلال", ae:"El Halal"},
  {m:"ج / C", q:{ar:"وضح أثر التعرية المائية على سطح مصر.", en:"What did water erosion do to Egypt's land?"}, a:"ساهمت في تشكيل وادي النيل والأودية الجافة", ae:"It made the Nile Valley and the dry valleys"},
  {m:"ج / C", q:{ar:"بم تفسر: تكون جبال البحر الأحمر في الصحراء الشرقية؟", en:"Explain how the Red Sea Mountains formed."}, a:"بسبب الانكسارات (عوامل باطنية)", ae:"By faults (inside forces)"},
  {m:"ج / C", q:{ar:"يغلب المظهر الجبلي على شبه جزيرة سيناء. دلل.", en:"Sinai has many mountains. Prove it."}, a:"لكثرة الجبال مثل جبل سانت كاترين وجبل موسى جنوبًا وجبل الحلال شمالًا", ae:"St Catherine and Musa in the south, El Halal in the north"},
  {m:"ج / C", q:{ar:"اكتب اسم العامل الذي ساعد في تشكيل جبال البحر الأحمر.", en:"What made the Red Sea Mountains?"}, a:"العوامل الباطنية مثل الانكسارات", ae:"Inside forces, like faults"}
 ]},
 {lesson:"l3", title:{ar:"الدرس الثالث – الفترة الأولى: الشتاء والربيع (ص١١)", en:"Lesson 3 – Period 1: Winter & spring (p.11)"}, qs:[
  {q:{ar:"(قطعة: برودة الجو والمطر والملابس الثقيلة) عن أي فصول السنة تتحدث الفقرة؟", en:"(Text: cold air, rain, heavy clothes.) Which season is it?"}, a:"فصل الشتاء", ae:"Winter"},
  {q:{ar:"ما مظاهر الفصل المناخي الذي تعرضه الفقرة؟", en:"Describe that season's weather."}, a:"مناخ بارد خاصة في المناطق الداخلية والجبلية مع سقوط الأمطار وبعض الثلوج فوق الجبال", ae:"Cold, especially inland and on mountains, with rain and some snow on mountains"},
  {q:{ar:"صوّب: تتعامد الشمس على مدار السرطان في الفصل المناخي بالفقرة.", en:"Fix: \"In this season the Sun is straight over the Tropic of Cancer.\""}, a:"مدار الجدي", ae:"Tropic of CAPRICORN"},
  {q:{ar:"ما المقصود بمصطلح المناخ؟", en:"What is climate?"}, a:"وصف حالة الجو من حيث الحرارة والرياح والأمطار في فترة زمنية طويلة", ae:"What the air is like (heat, wind, rain) over a LONG time"},
  {q:{ar:"(صورة: يوسف على قمة جبل وعمر أسفله) تختلف ملابس عمر ويوسف. اذكر السبب.", en:"(Picture: Youssef on a mountain top, Omar at the bottom.) Why are their clothes different?"}, a:"لأن يوسف في منطقة مرتفعة حيث تقل الحرارة وعمر في منطقة منخفضة حيث ترتفع الحرارة", ae:"Youssef is high up where it is colder; Omar is low down where it is hotter"},
  {q:{ar:"للموقع الفلكي تأثير على مناخ مصر. دلل.", en:"Astronomical location affects Egypt's climate. Prove it."}, a:"الموقع الفلكي سبب في وقوع معظم مساحة مصر في الإقليم الصحراوي الحار", ae:"It is why most of Egypt is in the hot desert region"},
  {q:{ar:"لا يعد فصل الربيع أفضل فصول السنة في مصر. برهن.", en:"Spring is not Egypt's best season. Prove it."}, a:"بسبب رياح الخماسين المحملة بالرمال والأتربة", ae:"Because of the Khamaseen winds full of sand and dust"}
 ]},
 {lesson:"l3", title:{ar:"الدرس الثالث – الواجب والفترة الثانية (ص١٢–١٣)", en:"Lesson 3 – Homework & Period 2 (p.12–13)"}, qs:[
  {q:{ar:"قارن بين الشتاء والربيع من حيث تعامد الشمس والمظاهر المميزة.", en:"Compare winter and spring: where the Sun is straight overhead, and what each is like."}, a:"الشتاء: مدار الجدي – مناخ بارد خاصة في المناطق الداخلية والجبلية مع سقوط الأمطار وبعض الثلوج فوق الجبال.\nالربيع: دائرة الاستواء – نشاط حركة الرياح خاصة رياح الخماسين المحملة بالرمال والأتربة.", ae:"Winter: Capricorn, cold + rain + snow on mountains. Spring: Equator, windy with Khamaseen."},
  {q:{ar:"تتعاقب فصول السنة الأربعة على مصر بانتظام. اذكر السبب.", en:"The four seasons come in order. Why?"}, a:"بسبب الدورة السنوية: دوران الأرض حول الشمس مرة كل ٣٦٥ يومًا وربع", ae:"The yearly cycle: Earth goes around the Sun every 365¼ days"},
  {q:{ar:"يتشابه مناخ المناطق الداخلية مع المناطق الساحلية. أثبت خطأ العبارة.", en:"\"Inland climate is the same as the coast.\" Show it is wrong."}, a:"المناطق الساحلية تتميز باعتدال درجة الحرارة عن المناطق الداخلية", ae:"The coast is milder than inland"},
  {q:{ar:"(صورة أ: شاطئ ومظلة) أي فصول السنة تعبر عنه الصورة؟", en:"(Picture A: beach umbrella.) Which season?"}, a:"فصل الصيف", ae:"Summer"},
  {q:{ar:"(صورة ب: أشجار معتدلة) يتميز المناخ بالصورة بالاعتدال. اذكر السبب.", en:"(Picture B: mild trees.) Why is it mild?"}, a:"لتعامد الشمس على دائرة الاستواء", ae:"The Sun is straight over the Equator"},
  {q:{ar:"ما المقصود بمصطلح إقليم مناخي؟", en:"What is a climate region?"}, a:"مساحة من الأرض لها نفس الخصائص المناخية من حيث الحرارة والرياح والأمطار", ae:"An area with the same heat, wind and rain"},
  {q:{ar:"تمتد جميع الأراضي المصرية في الإقليم الصحراوي الحار. أثبت خطأ العبارة.", en:"\"ALL of Egypt is in the hot desert region.\" Show it is wrong."}, a:"تمتد معظم الأراضي المصرية في الإقليم الصحراوي", ae:"MOST of Egypt (the north is Mediterranean)"},
  {q:{ar:"قارن بين الصيف والخريف (تعامد الشمس – المظاهر).", en:"Compare summer and autumn."}, a:"الصيف: مدار السرطان – ارتفاع الحرارة خاصة في المناطق الداخلية والجنوبية واعتدالها فوق المرتفعات والمناطق الساحلية.\nالخريف: دائرة الاستواء – اعتدال الحرارة وسقوط الأمطار في بعض أنحاء مصر خاصة المناطق الشرقية على جبال البحر الأحمر وسيناء.", ae:"Summer: Cancer, hot inland and south, milder on high land and coasts. Autumn: Equator, mild, some rain in the east."},
  {q:{ar:"قارن بين إقليم مناخ البحر المتوسط والإقليم الصحراوي الحار (الموقع – الخصائص).", en:"Compare the Mediterranean and hot desert regions."}, a:"البحر المتوسط: شمال مصر – حار جاف صيفًا دافئ ممطر شتاءً.\nالصحراوي الحار: يمتد في معظم مساحة مصر – شديد الحرارة صيفًا بارد شتاءً والأمطار نادرة وقد تسقط فجأة على شكل سيول.", ae:"Mediterranean: the north; hot dry summer, warm rainy winter. Hot desert: most of Egypt; very hot summer, cold winter, rare rain and sudden floods."}
 ]},
 {lesson:"l3", title:{ar:"الدرس الثالث – التقييم الأسبوعي (ص١٤)", en:"Lesson 3 – Weekly test (p.14)"}, qs:[

// ---------- time machine ----------
function clockSVG(h,m,label){const a=(h%12+m/60)*30,b=m*6;return `<div><svg viewBox="0 0 100 100" width="96"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#334155" stroke-width="4"/>${Array.from({length:12},(_,i)=>`<line x1="50" y1="8" x2="50" y2="14" stroke="#334155" stroke-width="3" transform="rotate(${i*30} 50 50)"/>`).join("")}<line x1="50" y1="50" x2="50" y2="26" stroke="#111" stroke-width="5" stroke-linecap="round" transform="rotate(${a} 50 50)"/><line x1="50" y1="50" x2="50" y2="15" stroke="#ef4444" stroke-width="3" stroke-linecap="round" transform="rotate(${b} 50 50)"/><circle cx="50" cy="50" r="4"/></svg><div style="font-weight:800">${label}</div><div>${fmt(h,m)}</div></div>`}
const fmt=(h,m)=>{h=((h%24)+24)%24;return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`};
function timeWidget(){
 const d=document.createElement("div");d.className="card widget";
 d.innerHTML=`<h3>${UI.timeTitle}</h3>
 <p>${LANG==="ar"?"كل خط طول = ٤ دقائق، وكل ١٥° = ساعة. شرق جرينتش ⬅ تسبق، غرب جرينتش ⬅ تتأخر.":"Each longitude line = 4 minutes, so 15° = 1 hour. EAST of Greenwich → ahead. WEST → behind."}</p>
 <label>${UI.timeQ}: <b id="lt"></b></label><input type="range" id="lh" min="0" max="23" value="18">
 <label>${UI.city}: <b id="lv"></b></label><input type="range" id="lon" min="-90" max="180" step="15" value="30">
 <div class="clocks" id="clk"></div><div class="info" id="tInfo"></div>
 <div class="card" style="background:#fff"><b>⚽ ${LANG==="ar"?"مسألة الكتاب ص١٢":"Book problem p.12"}:</b> ${LANG==="ar"?"مباراة الساعة ٦ مساءً بتوقيت لندن (خط صفر). القاهرة على خط ٣٠° شرقًا. متى تُعرض في القاهرة؟":"A match starts at 6 pm London time (0°). Cairo is on 30° east. What time is it in Cairo?"}
 <div class="opts" id="tq"></div></div>`;
 const upd=()=>{const h=+d.querySelector("#lh").value,lon=+d.querySelector("#lon").value,diff=lon/15;
  d.querySelector("#lt").textContent=fmt(h,0);d.querySelector("#lv").textContent=`${Math.abs(lon)}° ${lon>=0?UI.east:UI.west}`;
  d.querySelector("#clk").innerHTML=clockSVG(h,0,UI.london)+clockSVG(h+diff,0,`${Math.abs(lon)}° ${lon>=0?UI.east:UI.west}`);
  const rel=diff>0?UI.ahead:diff<0?UI.behind:UI.same;
  d.querySelector("#tInfo").innerHTML=`${Math.abs(lon)}° ÷ 15 = <b>${Math.abs(diff)} ${UI.hours}</b> ${ARR} ${rel}`+(lon===30?` 🇪🇬 ${LANG==="ar"?"(القاهرة!)":"(Cairo!)"}`:"")};
 d.querySelector("#lh").oninput=upd;d.querySelector("#lon").oninput=upd;upd();
 const o=[["٦ مساءً","6 pm"],["٨ مساءً","8 pm"],["٤ مساءً","4 pm"]];
 d.querySelector("#tq").innerHTML=o.map((x,i)=>`<button class="opt" data-i="${i}">${LANG==="ar"?x[0]:x[1]}</button>`).join("");
 d.querySelector("#tq").onclick=e=>{const b=e.target.closest(".opt");if(!b)return;if(b.dataset.i==="1"){b.classList.add("ok");beep(true);star();toast(`30 ÷ 15 = 2 ${ARR} 6 + 2 = 8 🎉`)}else{b.classList.add("no");beep(false)}};
 return d;
}

VIEWS.map=m=>{
 m.innerHTML=`<div class="tabs2"><button class="btn on" data-m="explore">${UI.mapExplore}</button><button class="btn" data-m="hunt">${UI.mapHunt}</button><button class="btn" data-m="rhunt">${UI.mapRegions}</button></div><div class="card widget" id="mapBox"></div>`;

  const ask=()=>{if(round>=pool.length){box.querySelector("#hq").innerHTML=UI.won;box.querySelector("#hi").innerHTML=`<div class="result">${UI.score}: ${score}/${pool.length}</div><button class="btn" id="again">${UI.playAgain}</button>`;box.querySelector("#again").onclick=()=>set(mode);if(score>=pool.length*.8)confetti();return}

 const speeds=[0.75,0.9,1.1];
 const voices=()=>speechSynthesis.getVoices();
 const pick=l=>{const v=voices();return l==="ar"?(v.find(x=>/^ar[-_]EG/i.test(x.lang))||v.find(x=>/^ar/i.test(x.lang))):(v.find(x=>/^en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang)))};
 // split mixed text into Arabic / non-Arabic runs so each is read by the right voice
 function runs(text){const out=[];let buf="",lang=null;
  for(const w of text.replace(/\s+/g," ").trim().split(/(\s+)/)){const l=AR.test(w)?"ar":(/[A-Za-z]/.test(w)?"en":null);
   if(l&&lang&&l!==lang){out.push([lang,buf]);buf="";}if(l)lang=l;buf+=w}
  if(buf.trim())out.push([lang||(AR.test(buf)?"ar":"en"),buf]);return out}
 let queue=[],audio=null,gen=0;
 function chunks(t,n){const out=[];let c="";for(const w of t.split(" ")){if((c+" "+w).length>n&&c){out.push(c);c=w}else c=c?c+" "+w:w}if(c)out.push(c);return out}
 function done(){if(cur)cur.classList.remove("ra-reading");document.getElementById("ra-stop").style.display="none"}
 function next(g){if(g!==gen)return;const it=queue.shift();if(!it)return done();
  const v=pick(it.l);
  if(it.l==="ar"&&!v){ // no Arabic voice on this device (e.g. Chrome on Linux): use Google Translate speech
   audio=new Audio("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ar&ttsspeed="+(rate<0.8?0.5:1)+"&q="+encodeURIComponent(it.t));
   audio.playbackRate=rate>1?1.1:1;audio.onended=audio.onerror=()=>next(g);audio.play().catch(()=>next(g));return}
  const u=new SpeechSynthesisUtterance(it.t);u.lang=it.l==="ar"?"ar-EG":"en-GB";if(v)u.voice=v;u.rate=rate;u.onend=u.onerror=()=>next(g);speechSynthesis.speak(u)}
 function stop(){gen++;queue=[];speechSynthesis.cancel();if(audio){audio.pause();audio=null}done()}
 function speak(text,el){stop();cur=el||null;if(cur)cur.classList.add("ra-reading");
  const parts=runs(String(text).replace(/[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}️‍]/gu,""));if(!parts.length)return;
  document.getElementById("ra-stop").style.display="inline-block";
  parts.forEach(([l,t])=>chunks(t.trim(),l==="ar"&&!pick("ar")?180:600).forEach(c=>queue.push({l,t:c})));next(gen)}
 window.RA={speak};
 const SEL="h1,h2,h3,h4,p,li,td,th,summary,label,.q,.opt,.tile,.info,.ans,.exam,.en,.fact>div,.note,.fa,.fb,.result,.say-text,button,div";
 document.addEventListener("click",e=>{if(!on)return;const bar=e.target.closest("#ra-bar");if(bar)return;
  let el=e.target.closest(SEL);while(el&&el.tagName==="DIV"&&el.children.length>6)el=null;
  if(!el)el=e.target;const txt=(el.innerText||el.textContent||"").trim();if(!txt)return;
  e.preventDefault();e.stopPropagation();speak(txt.slice(0,1200),el)},true);
 document.getElementById("ra-toggle").onclick=()=>{on=!on;document.body.classList.toggle("ra-on",on);if(!on){stop()}else speak(document.documentElement.lang==="en"?"Tap any words to hear them. Tap the green button again to stop.":"اضغط على أي كلام لتسمعه")};
 document.getElementById("ra-stop").onclick=stop;
 document.getElementById("ra-speed").onclick=e=>{rate=speeds[(speeds.indexOf(rate)+1)%speeds.length];e.target.textContent=(rate===0.75?"🐢 ":rate===1.1?"🐇 ":"")+rate+"×"};
 speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{};
})();
</script>
