:\b\n \n\u0007Acts as the pillar of the body and supports the whole body. The \nbackbone is made of many small connected bones, so you can bend \nyour body forward, backward, left, and right.\nBones don’t just support the body, they \nalso have the role of protecting it.\n"}], "assessment": [{"pdf": 5, "printed": 6, "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQgJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wgARCAQEAtYDAREAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAECAwQFBgf/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAffgHM5Xn8+tOXsTcaxGuEb5GSGq56OfWcd1T08s9fNCTUEgAsCALYiSbJWEggksVIABVJBICkggirExBYEErCFgEIWSoSYqtUlYSSBmzSFRFSstFqvY657/AEyAAOPx7aXn9xJ6+WmvPBFCAQITTl6nP0zvi9HhIJBBJYE1WJFACElRABAQFqkk0gELAKkkklSQAAAQFJBTl6Wd1WZQIstEWGZuGsVYquOqr2emfQdIAAON5/dp8uzr4V5VIqACAsJMCOfpcfW6c79/nqQqCYsKmWtgLIJIISQpIKkggqguQKRJBUAgkkAgEgKSICi4PL9K7qiFza5486khQliIki5jfCnby1Z63XPoekAAHG8/v1nCt4QVtJBABABCyV5eiefut28dunlhBK2QSsJBMqhKFAkgJUqAKqTEoBFTEUlhJWCRQCISbSFQSCQuHy/Uu6CDY3xrLNkZXSjV5nHNzJrY74qjv4Or6PJ6HpAAByOPq1HnokELCQQCSCYipIJXHw9tp6Mnf5kXE0LALCSQFlBKwCSEgggFipAJCCFUQpIiQWqIgE0JIJEKmC63m+pkdBBLKoJiC6TILJg59cM3U6nv+P6HrzAAHJ59NPOaBKkFVIlLNkJJFQXlrNV8/wBO/byW35FCxIWqASpILEEEgEAgkghIJJtCJoCElQSVktWQyVkLReshZLFiaTcpYUiCFgrLSbxY1rZ7anLvrc+tJay9L2fK9B6POAAOPz3qZY0hIIJMfP1zn0s6WTvy26eWKEkxj4e+W7+j5pBJIBAABIBBIIFTBBFFkvSIMlWMhkrMmQyVkLkigAAAAAAAAAANbHXl+f28vz+rp+r5/e9PjAAHJ59NOTHAoCnP0zj1yWKTUJbp5J6+QImqcfUx7Mnp+VCTC2ZJqIUJSC4WEEkVYgGSshJcyWZFy2ZDIWFAAAAAAAAAAAAAAAADm8fTp513vR5AABqZ1ilxRikxriNbz/QOlzq9vHyeHuhIsv6Pl3CFrz7Ty99/R8y1zBYsEkmsiSTVi5NSlixeshYvQAAAAAAAAAAAAAAAAAAAAAg5PPt1+nEAAABAg835PrYZZOt38fK8/tqF9D7Pk5LkiUQ3kvOSSQKQoAAAAAAAAAAAAAAAAAAAAAAAAAAAAaM1vXIAAAAA4vn+hocu8HS6+Xm8fWTLuel9fyQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAKFwAAYJ0z3mABizvhcPpYMaSwW1O16PBs3irLcgAAa+emSZ05239+ekurnrs650mqrKY5qbKS7m+V7AAAAAAAAAAAAAAAAAAAAAAABBI ists page 27. In this scan page 27 is germination homework; Sunlight and Growth begins on page 28 and its homework is on page 29. Verify the school edition before treating page 29 as assigned.</p>':''}<p><strong>Matching homework: printed pages ${l.homeworkPrinted.join(', ')}.</strong></p>${l.assessment.filter(p=>l.homeworkPrinted.includes(p.printed)).map(p=>page(p,'Assessment book')).join('')}${note('homework','My homework answers — use the original question numbers')}<p>No official answer key was supplied. Review written or spoken responses with a parent; these answers are not automatically scored.</p></section>`}if(tab==='practice'){out=quiz(l)+`<section class=card><h2>Textbook exercises and assessment models</h2><p>Use the textbook’s Try / Practise questions and the assessment book’s Weekly Assessment / Test sections. Shared models can cover earlier lessons too.</p><h3>Textbook questions</h3>${l.textbook.map(p=>page(p,'Textbook')).join('')}<h3>Weekly tests and classroom tasks</h3>${l.assessment.map(p=>page(p,'Assessment book')).join('')}${note('practice','My exercise / test answers')}<details><summary>Review my answer</summary><p>Reopen the explanation pages. Check each claim against a sentence, diagram or experiment. Correct your response below; ask a parent about anything unclear.</p>${note('correction','My corrected explanation')}</details><label><input type=checkbox data-done> I reviewed this lesson with evidence from the book.</label></section>`}if(tab==='sources'){out=`<section class=card><h2>Both books · source and scope</h2><p>English Ministry Science textbook, First Term 2026–2027: downloaded PDF has 110 pages. Assessment book: 62 scanned PDF pages; printed numbering is PDF page + 1 after the cover.</p><p>All original images are embedded for offline use. Searchable assessment text is OCR and may contain errors; the image controls the wording. No teacher answer key or invented automatic grading is included.</p><p><a href="https://drive.google.com/file/d/12XSa7KQlC-BIsLpm82x1XrCFtpUYAwWX/view">Full textbook online</a> · <a href="https://drive.google.com/file/d/1OjoipmjinEWTSUsR5TX6L2kpurfH0j95/view">Full assessment book online</a> · <a href="index.html">All chapters and lessons</a> · <a href="science-skills.html">Science skills and tools</a> · <a href="science-skills.html">Science skills and tools</a></p><p>Your notes stay in this browser on this device. Export them to keep a backup.</p><button onclick=exportNotes()>Export my answers</button></section>`}root.innerHTML=out;root.querySelectorAll('[data-note]').forEach(el=>{el.value=localStorage.getItem(key(el.dataset.note))||'';el.oninput=()=>localStorage.setItem(key(el.dataset.note),el.value)});let cb=root.querySelector('[data-done]');if(cb){cb.checked=localStorage.getItem(key('done'))==='true';cb.onchange=()=>localStorage.setItem(key('done'),cb.checked)}}function exportNotes(){let o={};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k.startsWith('science-en-2026:'))o[k]=localStorage.getItem(k)}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download='science-answers.json';a.click();URL.revokeObjectURL(a.href)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelector('#read').onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(root.innerText.slice(0,12000)))};document.querySelector('#stop').onclick=()=>speechSynthesis.cancel();render();</script></html>
