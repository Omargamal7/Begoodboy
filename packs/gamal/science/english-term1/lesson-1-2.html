007Fill in the blank with the correct word.\n\t\n\t\nJoints have (        ), which acts as a cushion so that bones do not \nrub directly against each other and wear out.\n"}, {"pdf": 11, "printed": 11, "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQgJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wgARCAOcAqMDAREAAhEBAxEB/8QAGgABAAMBAQEAAAAAAAAAAAAAAAMCBAUBBv/EABoBAQADAQEBAAAAAAAAAAAAAAADBAECBQb/2gAMAwEAAhADEAAAAfoqlcAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACmcgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABoAAABgAAAOgAAm62mL7vp6R5lMy+7fdizn1vmZ7uybtcz3drmDwFczwAAAAAAAAAAq4N9aPGet8Z6DwAu2oZXM93bNhzjlxVNfcog549Jeuoueasl3rNzxs6m3yWQAAHWAADR134yzbbvoPSPMm66FMyPMvu33YeeZ+uq5lt3w9MXEdcwAAAAAAAAACLni2gL7tcGWbHnNt68Z6CuZL13FnFm23vHxDzoa3Rlnrmae5Jt7hzj0ycR0znJxHo7l6s1oAAB1gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA8MvPHgB6eAAGnrq7QAAOhJKAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB0OpwAABgBvAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAOEYD6s9AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAKnGLG85B9CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD5iOHDV87tz3O1Pb4Zgqebjjhvu1zK4AAAHuvMABrpSWPprfoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAfDVqMden6fS2/QtJNxoK2jmOXrrFHFFnPpP13feos4h552dy1ZHmSbseYZd1j4ig54+mt+h15rQAAAAAAAAAAAAAAAAAAAAAAAAAAAAA+Mhq5annybseZHLY6e7LmeGfmOfruLOepLZ9MfEXJhrd2xcg54pma+5dHXeXmObeuLBUz88S719ne9aXroAAAAAAAAAAAAAAAAAAAAAAAAAAAADCfG1qOjmOB127FuKtSqwAAAAAAAADV3JLvfoaPQG+gN9B7oG+g9DfdAeg9aPdD0N9B7oehvoPdetHoPdegtuy70AAAAAB4YDUTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA4sFTtT2+Ja82u82b1qnp1LFD0uelSUoXAAAIyQiJQCMHhKCMkIyQAgLnhKAACIlABESgAAAjJCMkIiUAAAAAAAAHNir9KWx8/c8m+dR9c9Kl63p4ZSpEVJjWZzYYD0gIy5tJCE5pqLlTaDnkZ9AfOm8xFztHEN5cxEJ2jjkpoOeTkZ6do4xOYiQ6RUylTeZzIeE5U0GswmM3FDtgAAAAAHNir9KWxyrFGHqKbmTpV79yhcAAAAAAAAAAAAAAAAAAAAAAAAiJQAAAAREoAAAAAAAObFX6UtgAADCQlCYkM4JAWIy4Mx6dEjM5U9LlDaZShYmMp6SFSUzG4xnpQkLmknAAAAAAAAAAAAAAAAAAObFX6UtgAADCeHp6bTnE5CeFyE1FyAjNhEZyUHhY0GQsemc0AmITw9 ing.</p>`:''}${l.id==='4-1'?'<p class=warn>The supplied assignment lists page 27. In this scan page 27 is germination homework; Sunlight and Growth begins on page 28 and its homework is on page 29. Verify the school edition before treating page 29 as assigned.</p>':''}<p><strong>Matching homework: printed pages ${l.homeworkPrinted.join(', ')}.</strong></p>${l.assessment.filter(p=>l.homeworkPrinted.includes(p.printed)).map(p=>page(p,'Assessment book')).join('')}${note('homework','My homework answers — use the original question numbers')}<p>No official answer key was supplied. Review written or spoken responses with a parent; these answers are not automatically scored.</p></section>`}if(tab==='practice'){out=quiz(l)+`<section class=card><h2>Textbook exercises and assessment models</h2><p>Use the textbook’s Try / Practise questions and the assessment book’s Weekly Assessment / Test sections. Shared models can cover earlier lessons too.</p><h3>Textbook questions</h3>${l.textbook.map(p=>page(p,'Textbook')).join('')}<h3>Weekly tests and classroom tasks</h3>${l.assessment.map(p=>page(p,'Assessment book')).join('')}${note('practice','My exercise / test answers')}<details><summary>Review my answer</summary><p>Reopen the explanation pages. Check each claim against a sentence, diagram or experiment. Correct your response below; ask a parent about anything unclear.</p>${note('correction','My corrected explanation')}</details><label><input type=checkbox data-done> I reviewed this lesson with evidence from the book.</label></section>`}if(tab==='sources'){out=`<section class=card><h2>Both books · source and scope</h2><p>English Ministry Science textbook, First Term 2026–2027: downloaded PDF has 110 pages. Assessment book: 62 scanned PDF pages; printed numbering is PDF page + 1 after the cover.</p><p>All original images are embedded for offline use. Searchable assessment text is OCR and may contain errors; the image controls the wording. No teacher answer key or invented automatic grading is included.</p><p><a href="https://drive.google.com/file/d/12XSa7KQlC-BIsLpm82x1XrCFtpUYAwWX/view">Full textbook online</a> · <a href="https://drive.google.com/file/d/1OjoipmjinEWTSUsR5TX6L2kpurfH0j95/view">Full assessment book online</a> · <a href="index.html">All chapters and lessons</a> · <a href="science-skills.html">Science skills and tools</a></p><p>Your notes stay in this browser on this device. Export them to keep a backup.</p><button onclick=exportNotes()>Export my answers</button></section>`}root.innerHTML=out;root.querySelectorAll('[data-note]').forEach(el=>{el.value=localStorage.getItem(key(el.dataset.note))||'';el.oninput=()=>localStorage.setItem(key(el.dataset.note),el.value)});let cb=root.querySelector('[data-done]');if(cb){cb.checked=localStorage.getItem(key('done'))==='true';cb.onchange=()=>localStorage.setItem(key('done'),cb.checked)}}function exportNotes(){let o={};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k.startsWith('science-en-2026:'))o[k]=localStorage.getItem(k)}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download='science-answers.json';a.click();URL.revokeObjectURL(a.href)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelector('#read').onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(root.innerText.slice(0,12000)))};document.querySelector('#stop').onclick=()=>speechSynthesis.cancel();render();</script></html>
