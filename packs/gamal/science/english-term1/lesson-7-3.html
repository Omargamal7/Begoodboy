Q==", "text": "Chapter 7\nAnimal Growth and Reproduction\nAnimal Growth and Reproduction      \n      7-3 Comparing Animals and Preserving the Species\n78\n(1) \u0007How do cats have their babies? Choose the correct answer from below.\n\t\nA:\t They grow from seeds like plants.\n\t\nB:\t They lay eggs.\n\t\nC:\t They give birth to babies.\n(2) \u0007What do newborn kittens drink to grow?\n(3) \u0007How do fish like Tilapia reproduce? Choose the correct answer from below.\n\t\nA:\t They give birth to babies.\n\t\nB:\t They lay eggs.\n\t\nC:\t They multiply by dividing.\n(4) \u0007What do you call it when baby fish come out of eggs?\n(5) \u0007Group the following animals into “Animals that give birth to babies” and \n“Animals that lay eggs”.\n[   camel   /   snake   /   cat   /   frog   ]\n1  Which animals give birth to babies?\n2  Which animals lay eggs?\n"}, {"pdf": 79, "printed": 79, "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQgJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wgARCAOcAqMDAREAAhEBAxEB/8QAGgABAAMBAQEAAAAAAAAAAAAAAAMEAgUBBv/EABoBAQADAQEBAAAAAAAAAAAAAAADAQQCBQb/2gAMAwEAAhADEAAAAfp9OUAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADN0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAFgAAAoAAABm+QANL3z16eHivLAentXm6zdS89eKLzdaq4+ud1fhurGLoD08BJz1jrnF1Nx1H1Q9PDN14oY6j3Vx3Wq6KA1XUfcW+Zc3z7Ty68VquvV+KHq83wdb57ryQcbZ5FyLQK8kXtJeZIuo83VmOanLnvQbunm9AAADPXIAGuet1cldZVqrlrrw8UPV+0rycTcdAaX4Qdxzcd+rjvny6m479XF1zqnltVeL53XUHcdmOXN14eXW6upJFjrnxUXcEvHebr1eTy+NV3jribiWO+dGb59rvNx+Wk57zdeKl5kj6j1XSu6c2bl6vM6OfZ4qzHNPxLB3H6U5c+Ouakue1Dq7GX1AAAMXyAAAAB7V+XQEnPcfXAAAAAAAAk56j65A9q/LoAAAAAAAAAAAAADwqdxeKA9PAAC1zLurAAAvwaAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAOlBpAAAHMMHWAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAOEUz6g9AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIjjkp0TineqigAAAAAAAN30AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPk4oKGTzO1Pr+h07+KcvH5tWOGfvuHniHnk ment book’s Weekly Assessment / Test sections. Shared models can cover earlier lessons too.</p><h3>Textbook questions</h3>${l.textbook.map(p=>page(p,'Textbook')).join('')}<h3>Weekly tests and classroom tasks</h3>${l.assessment.map(p=>page(p,'Assessment book')).join('')}${note('practice','My exercise / test answers')}<details><summary>Review my answer</summary><p>Reopen the explanation pages. Check each claim against a sentence, diagram or experiment. Correct your response below; ask a parent about anything unclear.</p>${note('correction','My corrected explanation')}</details><label><input type=checkbox data-done> I reviewed this lesson with evidence from the book.</label></section>`}if(tab==='sources'){out=`<section class=card><h2>Both books · source and scope</h2><p>English Ministry Science textbook, First Term 2026–2027: downloaded PDF has 110 pages. Assessment book: 62 scanned PDF pages; printed numbering is PDF page + 1 after the cover.</p><p>All original images are embedded for offline use. Searchable assessment text is OCR and may contain errors; the image controls the wording. No teacher answer key or invented automatic grading is included.</p><p><a href="https://drive.google.com/file/d/12XSa7KQlC-BIsLpm82x1XrCFtpUYAwWX/view">Full textbook online</a> · <a href="https://drive.google.com/file/d/1OjoipmjinEWTSUsR5TX6L2kpurfH0j95/view">Full assessment book online</a> · <a href="index.html">All chapters and lessons</a> · <a href="science-skills.html">Science skills and tools</a> · <a href="science-skills.html">Science skills and tools</a></p><p>Your notes stay in this browser on this device. Export them to keep a backup.</p><button onclick=exportNotes()>Export my answers</button></section>`}root.innerHTML=out;root.querySelectorAll('[data-note]').forEach(el=>{el.value=localStorage.getItem(key(el.dataset.note))||'';el.oninput=()=>localStorage.setItem(key(el.dataset.note),el.value)});let cb=root.querySelector('[data-done]');if(cb){cb.checked=localStorage.getItem(key(
