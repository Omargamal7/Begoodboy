<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2f38">
<title>Science Showdown</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Theme: an original animal-arena game look (chunky buttons, loot crate, stars, coins). No outside art or fonts.
   Layout: compact top bar with the player card, six bottom tabs (Home, Learn, MCQ, T/F, Write, Mock), Parent view for answers and sources. */
:root{
  --ink:#14303a; --ink2:#3b5a63; --panel:#fff6dc; --panel2:#fffdf4; --line:#14303a;
  --yellow:#ffc42e; --yellow-d:#9a6400; --blue:#2368d8; --blue-d:#12408f; --green:#17803b; --green-d:#0b5026; --red:#c4322a; --red-d:#7f1c16;
  --leaf:#1f8a4c; --amber:#7a4b00; --amber-soft:#ffe7b3; --sky:#0b2f38; --petal:#f7d56b; --petal-line:#c9961c; --pollen:#e28a1f; --skin:#c08a63; --body:#5f86b5;
  --font:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:#0d4a55;color:var(--ink)}
body{min-height:100vh;min-height:100dvh;font-family:var(--font);font-size:18px;line-height:1.5;
  background-color:#0f5c52;
  background-image:radial-gradient(circle at 15% 12%,rgba(255,255,255,.07) 0 34px,transparent 35px),radial-gradient(circle at 82% 28%,rgba(255,255,255,.06) 0 46px,transparent 47px),radial-gradient(circle at 40% 70%,rgba(0,0,0,.08) 0 52px,transparent 53px),linear-gradient(180deg,#15796a 0%,#0d4a55 100%);
  background-size:220px 220px,300px 300px,260px 260px,100% 100%;}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance;font-weight:800}
h1{font-size:clamp(30px,8vw,44px);color:#fff;text-shadow:0 3px 0 #082a31,0 0 12px rgba(0,0,0,.35)}
h2{font-size:24px} h3{font-size:19px}
p{margin:0} ul,ol{margin:0;padding-left:22px}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--blue-d);overflow-wrap:anywhere}
:focus-visible{outline:4px solid #fff;outline-offset:2px;box-shadow:0 0 0 7px var(--blue)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lede{color:#e6fbf2;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.kicker{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.small{font-size:15px;color:var(--ink2)}

/* top bar (player card) */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--sky);border-bottom:4px solid #061d23}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sky)}
.hud{display:flex;align-items:center;gap:10px;padding-block:8px}
.avbtn{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:#1d6b78;padding:0;display:grid;place-items:center;overflow:hidden}
.pl{flex:1 1 auto;min-width:0;color:#fff}
.pl b{display:block;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{height:10px;border-radius:6px;background:#06232a;border:2px solid #06232a;overflow:hidden;margin-top:3px}
.xp i{display:block;height:100%;background:linear-gradient(#7df08f,#2fb55a);transition:width .4s}
.coin{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:#06232a;color:#ffe08a;font-weight:800;border-radius:999px;padding:5px 12px 5px 6px;font-variant-numeric:tabular-nums}
.coin svg{width:24px;height:24px}
.pbtn{flex:0 0 auto;min-height:44px;border-radius:12px;border:2px solid #7fb6bf;background:transparent;color:#fff;font-weight:800;font-size:14px;padding:4px 10px}
.pbtn[aria-pressed="true"]{background:#fff;color:var(--ink)}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--sky);border-top:4px solid #061d23;padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav .wrap{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding-block:6px}
.nb{min-height:56px;border:0;border-radius:12px;background:transparent;color:#cfeaf0;font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px}
.nb svg{width:24px;height:24px;fill:currentColor;stroke:currentColor}
.nb[aria-current="page"]{background:var(--yellow);color:#2b1a00}

main{padding-block:18px calc(98px + env(safe-area-inset-bottom,0px));outline:none}
main>section{display:flex;flex-direction:column;gap:14px}

/* panels */
.card{background:var(--panel);color:var(--ink);border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 rgba(0,0,0,.35);padding:14px 16px}
.card.green{background:#dff6e4}
.card h3{margin-bottom:6px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.scope{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px;margin-top:8px}
.scope li{display:flex;gap:12px;align-items:flex-start}
.scope .n{flex:0 0 88px;text-align:center;font-weight:800;font-size:14px;padding:4px 6px;border-radius:10px;background:#cdeedb;color:var(--green-d);border:2px solid var(--green-d)}

/* buttons */
.btn{min-height:52px;padding:10px 20px;border-radius:14px;border:3px solid #3a2300;background:linear-gradient(#ffd964,#ffb400);color:#2b1a00;font-weight:800;font-size:18px;box-shadow:0 5px 0 #3a2300;transition:transform .08s,box-shadow .08s}
.btn:active:not([disabled]){transform:translateY(4px);box-shadow:0 1px 0 #3a2300}
.btn.blue{background:linear-gradient(#4b8cf0,#2368d8);border-color:#0b2a63;color:#fff;box-shadow:0 5px 0 #0b2a63}
.btn.green{background:linear-gradient(#32b25a,#17803b);border-color:#073a1a;color:#fff;box-shadow:0 5px 0 #073a1a}
.btn.red{background:linear-gradient(#e2574d,#c4322a);border-color:#5b0f0a;color:#fff;box-shadow:0 5px 0 #5b0f0a}
.btn.ghost{background:var(--panel2);border-color:var(--line);color:var(--ink);box-shadow:0 5px 0 rgba(20,48,58,.55)}
.btn[disabled]{opacity:.5;cursor:default}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-height:46px;padding:6px 14px;border-radius:999px;border:3px solid var(--line);background:var(--panel2);font-weight:800;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.seg button[aria-pressed="true"]{background:var(--yellow);color:#2b1a00}
.chip{display:inline-block;font-size:13px;font-weight:800;padding:1px 10px;border-radius:999px;line-height:1.7;border:2px solid transparent}
.chip.tb{background:#cdeedb;color:var(--green-d);border-color:var(--green-d)}
.chip.chk{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
.chip.pg{background:#ffe9a8;color:var(--yellow-d);border-color:var(--yellow-d)}

/* learn */
.quote{border-left:5px solid var(--leaf);padding:2px 0 2px 12px}
.quote small{display:block;color:var(--ink2);font-size:14px;font-weight:700}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--yellow-d);margin:0 2px;color:transparent;user-select:none}
figure{margin:0} figcaption{font-size:14px;color:var(--ink2);margin-top:6px}
.fig{display:block;width:100%;max-width:440px;height:auto;margin-inline:auto}
.flow{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.flow li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;background:#e3f5e6;border-radius:12px;padding:8px 12px;border:2px solid #b7dfc0}
.flow li::before{content:counter(s);flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;font-size:15px;display:grid;place-items:center}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ab>div{border:2px solid #b8cdd3;border-radius:12px;padding:10px;background:var(--panel2)}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;list-style:none;padding:0;margin:0}
.stages li{text-align:center;background:var(--panel2);border:2px solid #b8cdd3;border-radius:12px;padding:6px 4px;font-size:15px;font-weight:800}
.stages svg{width:56px;height:84px;display:block;margin:0 auto 2px}
.stages .num{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:50%;background:var(--green);color:#fff;font-size:13px}

/* quiz rounds */
.prog{display:flex;gap:4px}
.prog i{flex:1;height:12px;border-radius:6px;background:#06232a;border:2px solid #06232a}
.prog i.on{background:#7df08f}
.prog i.bad{background:#ff9a90}
.prog i.cur{background:#ffd964;border-color:#fff}
.qtext{font-size:22px;line-height:1.4;margin-block:6px}
.gap{display:inline-block;min-width:3em;border-bottom:3px solid currentColor;margin:0 3px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;min-height:58px;padding:8px 14px;border-radius:14px;border:3px solid var(--line);background:var(--panel2);font-weight:700;font-size:18px;box-shadow:0 4px 0 rgba(20,48,58,.55);width:100%}
.opt .ltr{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800}
.opt:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 rgba(20,48,58,.55)}
.opt.wrong{background:#ffd9d4;border-color:var(--red)}
.opt.wrong .ltr{background:var(--red)}
.opt.right{background:#d3f5dc;border-color:var(--green)}
.opt.right .ltr{background:var(--green)}
.opt[disabled]{cursor:default}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfrow .btn{min-height:68px;font-size:22px}
.fb{border-radius:14px;border:3px solid var(--line);padding:12px 14px;outline:none}
.fb.ok{background:#d3f5dc;border-color:var(--green)}
.fb.no{background:#ffe3df;border-color:var(--red)}
.fb.mid{background:#fff0c2;border-color:var(--yellow-d)}
.fb .big{font-size:22px;font-weight:800}
.note{background:var(--amber-soft);border-left:6px solid var(--amber);border-radius:10px;padding:10px 12px;font-size:16px}
.stars{display:inline-flex;gap:4px;vertical-align:middle}
.stars svg{width:26px;height:26px}
.stars.big svg{width:46px;height:46px}
.sum{display:flex;gap:10px;flex-wrap:wrap}
.sum .pill{flex:1 1 90px;text-align:center;border-radius:14px;padding:8px;background:var(--panel2);border:3px solid var(--line)}
.sum .pill b{display:block;font-size:28px;line-height:1.1}
.crate{display:block;width:120px;height:auto;margin-inline:auto}
.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.calm *{animation:none!important;transition:none!important}

/* lobby */
.avs{display:flex;gap:10px;flex-wrap:wrap}
.av{width:68px;height:68px;border-radius:18px;border:3px solid var(--line);background:#cfeaf0;padding:0;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.av[aria-pressed="true"]{background:var(--yellow);outline:4px solid #fff}
.arenas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.arena{background:var(--panel);border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 rgba(0,0,0,.35);padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:132px}
.arena b{font-size:19px}
.arena:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.cards{display:flex;flex-wrap:wrap;gap:6px}

/* written practice */
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);background:var(--panel2);font-weight:800;font-size:17px;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.dot[aria-current="step"]{outline:4px solid #fff;background:var(--yellow)}
.dot.got{background:#7df08f}
.dot.again{background:#ffd08a}
textarea{width:100%;min-height:84px;border:3px solid var(--line);border-radius:14px;background:#fff;padding:10px 12px;resize:vertical;line-height:1.45}
label.fl{font-weight:800;font-size:16px;display:block;margin-bottom:6px}
.hint{background:#fff0b8;border:3px dashed var(--yellow-d);border-radius:14px;padding:12px 14px}
.answer{background:#d3f5dc;border:3px solid var(--green);border-radius:16px;padding:14px 16px;outline:none}
.answer .big{font-size:21px;line-height:1.4}
.answer .why{margin-top:10px;padding-top:10px;border-top:2px solid #a9dcb6}
.mark{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* mock assessment: a paper that copies the book's test layout */
.sheet{background:#fff;color:#111;border:3px solid #333;border-radius:8px;padding:16px 18px;font-family:"Segoe UI",Arial,sans-serif;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.sheet .tagw{border:2px solid #6a5a99;border-radius:10px;padding:2px 12px;font-weight:700;font-size:15px;color:#3d2f77}
.sheet .tagr{background:#6a5a99;color:#fff;border-radius:10px 10px 0 0;padding:2px 12px;font-size:14px}
.sheet h2{font-family:Georgia,"Times New Roman",serif;text-align:center;font-size:26px;margin:8px 0 12px}
.mq{margin-bottom:16px}
.mq p{font-size:18px;line-height:1.45}
.sheet textarea{border:0;border-radius:0;background-color:#fff;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,#777 31px 32px);background-position:0 4px;line-height:32px;padding:4px 2px;min-height:96px;font-family:inherit;color:#111;resize:vertical}
.sheet .ans{background:#e6f7ea;border-left:6px solid var(--green);padding:8px 12px;border-radius:6px;margin-top:6px}
.sheet .yours{background:#f1f1f1;border-left:6px solid #888;padding:8px 12px;border-radius:6px;margin-top:6px;white-space:pre-wrap}
.sheet .quote{border-left-color:#6a5a99}
.clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;color:#fff;text-shadow:0 2px 0 #082a31}

/* answers + sources */
.arow{border:3px solid var(--line);border-radius:14px;padding:12px;background:var(--panel);display:flex;flex-direction:column;gap:6px;break-inside:avoid}
.arow .q{font-weight:800}
details{border:3px solid var(--line);border-radius:14px;background:var(--panel)}
summary{cursor:pointer;padding:12px 14px;font-weight:800;min-height:46px}
details>div{padding:0 14px 14px}
details img{display:block;width:100%;height:auto;border-radius:8px;border:2px solid var(--line)}
h2.sec{color:#fff;text-shadow:0 2px 0 #082a31;margin-top:6px}

/* guess check + arena banner */
.verdict{border:3px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.verdict .big{font-size:22px;font-weight:800;margin-bottom:4px}
.verdict ul{display:flex;flex-direction:column;gap:6px}
.v-clear{background:#d3f5dc;border-color:var(--green)}
.v-some{background:#fff0c2;border-color:var(--yellow-d)}
.v-strong{background:#ffe3df;border-color:var(--red)}
.v-none{background:var(--panel2)}
.arenaBanner{border:3px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.arenaBanner svg{display:block;width:100%;height:auto}
code{font-size:15px;overflow-wrap:anywhere;background:#fff;border:2px solid #cfdde0;border-radius:6px;padding:1px 5px}
#rep{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;min-height:150px}

@media (max-width:420px){
  body{font-size:17px}
  .ab{grid-template-columns:1fr}
  .arenas{gap:10px}
  .pbtn{font-size:13px;padding:4px 8px}
  .coin{padding-right:9px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{
  .top,.bnav,.btn,.seg,.nav,.noprint{display:none!important}
  html,body{background:#fff!important;color:#000}
  h1,h2.sec,.lede{color:#000;text-shadow:none}
  .arow,.card{border-color:#999;box-shadow:none}
  main{padding:0}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap hud">
    <button class="avbtn" id="avBtn" data-act="view" data-v="lobby" type="button" aria-label="Home"></button>
    <div class="pl"><b id="plTxt">Rookie · Lv 1</b><div class="xp" aria-hidden="true"><i id="xpBar" style="width:0%"></i></div></div>
    <div class="coin" aria-label="Coins"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#ffc42e" stroke="#7a4b00" stroke-width="2"/><circle cx="12" cy="12" r="6" fill="none" stroke="#c98a00" stroke-width="2"/></svg><span id="coinTxt">0</span></div>
    <button class="pbtn" id="parentBtn" data-act="view" data-v="parent" type="button" aria-pressed="false">Parent</button>
  </div>
</header>
<main class="wrap" id="main" tabindex="-1"><noscript>This page needs JavaScript. Open it in a normal browser.</noscript></main>
<nav class="bnav" aria-label="Sections"><div class="wrap" id="bnav"></div></nav>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(function(){

/* ---------- Helpers ---------- */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function rx(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function say(t){ var l=document.getElementById("live"); if(l){ l.textContent=""; setTimeout(function(){ l.textContent=t; },30); } }
function gaps(q){ return esc(q).replace(/_{3,}/g,"<span class='gap'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>"); }
function maskText(t, masks){ var out=esc(t); (masks||[]).forEach(function(m){ out = out.replace(new RegExp(rx(esc(m)),"i"), "<span class='blank'>_____</span>"); }); return out; }
function qlist(it){ return it.quote.map(function(q){ return {t:q, p:it.qp}; }); }
function quotesHtml(it){ return qlist(it).map(function(q){ return "<p class='quote'>“"+esc(q.t)+"”<small>Textbook p. "+q.p+"</small></p>"; }).join(""); }
function groupById(id){ for(var i=0;i<GROUPS.length;i++){ if(GROUPS[i].id===id) return GROUPS[i]; } return GROUPS[1]; }
function cardById(id){ for(var i=0;i<LEARN.length;i++){ if(LEARN[i].id===id) return LEARN[i]; } return null; }
function paperById(id){ for(var i=0;i<MOCKS.length;i++){ if(MOCKS[i].id===id) return MOCKS[i]; } return MOCKS[0]; }
function paperItems(p){ return p.book ? groupById(p.book).items : p.items; }

function bank(mode){ return mode==="mcq"?MCQ:TF; }
function poolList(mode,key){
  var b=bank(mode), list;
  if(key==="5-3"||key==="6-1") list=b.filter(function(x){ return x.lesson===key; });
  else if(key==="missed") list=b.filter(function(x){ return store[mode][x.id]==="miss"; });
  else list=shuffle(b.slice()).slice(0,10);
  return shuffle(list.slice());
}
function missedCount(mode){ return bank(mode).filter(function(x){ return store[mode][x.id]==="miss"; }).length; }
function startRound(mode,key){
  var list=poolList(mode,key); if(!list.length) return;
  var r={mode:mode,key:key,ids:list.map(function(x){return x.id;}),idx:0,res:{},wrong:{},opts:{},answered:false,earned:0,crate:null,rid:Date.now(),t0:Date.now(),picks:[],cur:null};

/* ---------- Answer log and guess check (for the parent) ---------- */
function logPush(rec){ store.log.push(rec); if(store.log.length>600) store.log.splice(0, store.log.length-600); save(); }
function secs(n){ return n==null?"–":(n/1000).toFixed(1)+" s"; }
function pct(a,b){ return b?Math.round(100*a/b):0; }
function shortText(it, mode){ var t = mode==="tf" ? "“"+it.s+"”" : it.q; return t.length>110 ? t.slice(0,107)+"…" : t; }
function analyze(){
  var recs = store.log.filter(function(r){ return r.m==="mcq" || r.m==="tf"; });
  var per = {}, rounds = {}, order = [];
  var A = {n:0, fast:0, tapped:0, first:0, exp:0, mcqN:0, mcqFirst:0, tfN:0, tfFirst:0, wrong:0, t0:null, t1:null};
  recs.forEach(function(r){
    var it = itemById(r.m, r.q); if(!it) return;
    var nopt = r.m==="mcq" ? it.opts.length : 2, picks = r.p || [];
    var wrongPicks = picks.filter(function(x){ return !x[1]; }).length, quick = 0;
    for(var i=1;i<picks.length;i++){ if(picks[i][2]-picks[i-1][2] < 1500) quick++; }
    var fast = r.f!=null && r.f < 2000;
    var rapid = r.m==="mcq" && wrongPicks>=2 && quick>=2;
    var all = r.m==="mcq" && wrongPicks>=nopt-1;
    var key = r.m+":"+r.q, p = per[key];
    if(!p) p = per[key] = {m:r.m, q:r.q, it:it, shown:0, wrong:0, first:0, fastest:null, fast:0, rapid:0, all:0, last:null};
    p.shown++; p.wrong += r.w; if(r.first) p.first++;
    if(r.f!=null && (p.fastest===null || r.f<p.fastest)) p.fastest = r.f;
    if(fast) p.fast++; if(rapid) p.rapid++; if(all) p.all++; p.last = r.first ? "right" : "missed";
    A.n++; A.wrong += r.w; if(r.first) A.first++; if(fast) A.fast++; if(rapid||all) A.tapped++; A.exp += 1/nopt;
    if(r.m==="mcq"){ A.mcqN++; if(r.first) A.mcqFirst++; } else { A.tfN++; if(r.first) A.tfFirst++; }
    if(A.t0===null || r.t<A.t0) A.t0 = r.t; if(A.t1===null || r.t>A.t1) A.t1 = r.t;
    var g = rounds[r.rid];
    if(!g){ g = rounds[r.rid] = {rid:r.rid, t:r.t, m:r.m, k:r.k, n:0, first:0, fsum:0, flags:0}; order.push(r.rid); }
    g.n++; if(r.first) g.first++; g.fsum += (r.f||0); if(fast||rapid||all) g.flags++;
  });
  var v = {level:"none", title:"Not enough answers yet", reasons:[]};
  if(A.n >= 10){
    var fs = A.fast/A.n, acc = A.first/A.n;
    var coin = A.tfN>=10 && A.tfFirst/A.tfN <= 0.6;
    var strong = A.tapped>=3 || (fs>=0.4 && acc<=0.6);
    var some = A.tapped>=1 || fs>=0.25 || coin;
    v.level = strong ? "strong" : some ? "some" : "clear";
    v.title = strong ? "Strong signs of guessing" : some ? "Some signs of guessing" : "No clear signs of guessing";
    v.reasons.push(A.fast+" of "+A.n+" answers were picked in under 2 seconds ("+pct(A.fast,A.n)+"%).");
    v.reasons.push(A.tapped+" multiple-choice answers came after tapping through the options quickly, or after trying every wrong option.");
    if(A.mcqN) v.reasons.push("Multiple choice: "+A.mcqFirst+" of "+A.mcqN+" right on the first pick ("+pct(A.mcqFirst,A.mcqN)+"%). Picking at random would be right about "+Math.round(100*(A.exp - A.tfN*0.5)/Math.max(1,A.mcqN))+"% of the time.");
    if(A.tfN) v.reasons.push("True or False: "+A.tfFirst+" of "+A.tfN+" right ("+pct(A.tfFirst,A.tfN)+"%). Flipping a coin is right about 50% of the time.");
  }
  var list = Object.keys(per).map(function(k){ return per[k]; }).sort(function(a,b){ return b.wrong-a.wrong || b.shown-a.shown; });
  var tried = list.length, total = MCQ.length + TF.length;
  var rl = order.slice(-8).reverse().map(function(id){ return rounds[id]; });
  return {A:A, v:v, list:list, rounds:rl, tried:tried, total:total};
}
function writtenStats(){
  var s = {}; store.log.forEach(function(r){ if(r.m!=="wr") return; var o = s[r.q] || (s[r.q] = {got:0, again:0, peek:0}); if(r.mark==="got") o.got++; else o.again++; if(r.rv!=null && r.rv<3000) o.peek++; });
  return s;
}
function mockLines(){
  var out = [];
  MOCKS.forEach(function(p){
    var m = store.mock[p.id]; if(!m || !m.done) return;
    var items = paperItems(p), sc = mockScore(p.id), blanks = items.filter(function(it){ var t=(m.typed||{})[it.n]; return !(t && t.trim()); }).length;
    out.push({id:p.id, title:p.title, n:items.length, right:sc?sc.n:0, marked:sc?sc.t:0, blanks:blanks, secs:m.secs||0});
  });
  return out;
}
function reportText(){
  var a = analyze(), L = [], d = function(t){ return new Date(t).toLocaleString(); };
  L.push("Science Showdown: guess check");
  if(a.A.n) L.push("Answers logged: "+a.A.n+" (from "+d(a.A.t0)+" to "+d(a.A.t1)+")");
  L.push("Result: "+a.v.title);
  a.v.reasons.forEach(function(r){ L.push("- "+r); });
  var worst = a.list.filter(function(p){ return p.wrong>0; }).slice(0,8);
  if(worst.length){ L.push("Questions with the most wrong picks:"); worst.forEach(function(p){ L.push("- ["+(p.m==="mcq"?"MCQ":"T/F")+"] "+shortText(p.it,p.m)+": "+p.wrong+" wrong in "+p.shown+" showing"+(p.shown>1?"s":"")); }); }
  var ml = mockLines(); if(ml.length){ L.push("Mock papers:"); ml.forEach(function(x){ L.push("- "+x.title+": "+x.right+"/"+x.n+" right (self-marked), "+x.blanks+" left blank, "+fmt(x.secs)); }); }
  L.push("These are rules of thumb, not proof. A fast answer can also be a known answer.");
  return L.join("\n");
}
function pGuess(){
  var a = analyze(), v = a.v, ws = writtenStats(), ml = mockLines();
  var cls = {clear:"v-clear", some:"v-some", strong:"v-strong", none:"v-none"}[v.level], mk = {clear:"✓", some:"!", strong:"!!", none:"…"}[v.level];
  var h = "<div class='verdict "+cls+"' role='status'><div class='big'>"+mk+" "+esc(v.title)+"</div>"+
    (v.reasons.length ? "<ul>"+v.reasons.map(function(r){ return "<li>"+esc(r)+"</li>"; }).join("")+"</ul>" : "<p>Play the MCQ and True or False rounds. The check needs at least 10 logged answers.</p>")+
    "<p class='small'>Logged: "+a.A.n+" answers · "+a.tried+" of "+a.total+" questions tried"+(a.A.n?" · from "+esc(new Date(a.A.t0).toLocaleDateString())+" to "+esc(new Date(a.A.t1).toLocaleDateString()):"")+"</p></div>";
  h += "<div class='row'><button class='btn blue' type='button' data-act='copyrep'>Copy report</button></div>";
  if(ui.copied==="ok") h += "<p class='lede' role='status'>Report copied. Paste it into a message.</p>";
  h += "<details"+(ui.copied==="fail"?" open":"")+"><summary>Report text"+(ui.copied==="fail"?" (copy was blocked: it is selected, copy it by hand)":"")+"</summary><div><textarea id='rep' readonly rows='9'>"+esc(reportText())+"</textarea></div></details>";
  h += "<details><summary>How this is judged</summary><div class='stack'>"+
    "<p>These are rules of thumb chosen for this page. They are not from the school or from research, and they show signs, not proof. A quick answer can also be a known answer.</p>"+
    "<ul class='stack'><li><b>Fast:</b> the first pick came less than 2 seconds after the question appeared.</li>"+
    "<li><b>Tapped through:</b> on a multiple-choice question, two or more wrong picks with the taps less than 1.5 seconds apart, or every wrong option tried.</li>"+
    "<li><b>Strong signs:</b> 3 or more tapped-through answers, or 40% or more fast answers together with 60% or less right on the first pick.</li>"+
    "<li><b>Some signs:</b> any tapped-through answer, 25% or more fast answers, or True or False at 60% or less over 10 or more answers.</li>"+
    "<li><b>Needs data:</b> at least 10 logged answers. Only the last 600 answers are kept, on this device.</li></ul></div></details>";
  h += "<h2 class='sec'>Wrong picks for each question</h2>";
  var rows = a.list;
  if(!rows.length) h += "<p class='lede'>No answers logged yet.</p>";
  rows.forEach(function(p){
    var flags = "";
    if(p.fast) flags += " <span class='chip chk'>Under 2 s: "+p.fast+"×</span>";
    if(p.rapid) flags += " <span class='chip chk'>Tapped through: "+p.rapid+"×</span>";
    if(p.all) flags += " <span class='chip chk'>Tried every wrong option: "+p.all+"×</span>";
    h += "<div class='arow'><div class='q'><span class='chip pg'>"+(p.m==="mcq"?"MCQ":"T/F")+"</span> "+esc(shortText(p.it,p.m))+"</div>"+
      "<div><b>Wrong picks: "+p.wrong+"</b> · shown "+p.shown+"× · right on the first pick "+p.first+"× · fastest first pick "+secs(p.fastest)+"</div>"+
      (flags?"<div>"+flags+"</div>":"")+"</div>";
  });
  if(a.rounds.length){
    h += "<h2 class='sec'>Recent rounds</h2>";
    a.rounds.forEach(function(g){
      h += "<div class='arow'><div class='q'>"+esc(new Date(g.t).toLocaleString())+" · "+(g.m==="mcq"?"MCQ":"True or False")+" · "+esc(g.k==="mix"?"Mixed":g.k==="missed"?"Missed ones":g.k)+"</div><div>"+g.first+" of "+g.n+" right on the first pick · average first pick "+secs(g.fsum/g.n)+(g.flags?" · "+g.flags+" flagged":"")+"</div></div>";
    });
  }
  h += "<h2 class='sec'>Written drill (self-marked)</h2>";
  var wrows = WRITTEN.filter(function(it){ return ws[it.id] && ws[it.id].again; });
  if(!wrows.length) h += "<p class='lede'>No “Not yet” marks logged.</p>";
  wrows.forEach(function(it){ var o = ws[it.id]; h += "<div class='arow'><div class='q'>"+(it.id==="hw-b"?"Homework b":"Test "+it.id.charAt(1)+" question "+it.n)+": "+esc(shortText({q:it.q},"mcq"))+"</div><div><b>“Not yet” marks: "+o.again+"</b> · “I knew it” marks: "+o.got+(o.peek?" · answer shown within 3 s: "+o.peek+"×":"")+"</div></div>"; });
  h += "<h2 class='sec'>Mock papers (self-marked)</h2>";
  if(!ml.length) h += "<p class='lede'>No finished paper yet.</p>";
  ml.forEach(function(x){ h += "<div class='arow'><div class='q'>"+esc(x.title)+"</div><div><b>"+x.right+" of "+x.n+" right</b> ("+x.marked+" marked) · "+x.blanks+" left blank · time "+fmt(x.secs)+"</div></div>"; });
  h += "<div class='card stack'><h3>Clear the log</h3>"+(ui.confirmClear?"<p>This removes every logged answer on this device. Coins, stars and progress stay.</p><div class='row'><button class='btn red' type='button' data-act='clearyes'>Yes, clear the log</button><button class='btn ghost' type='button' data-act='clearno'>Keep it</button></div>":"<div class='row'><button class='btn ghost' type='button' data-act='clearlog'>Clear the log</button></div>")+"</div>";
  return h;
}
var LOCAL = location.protocol==="file:";
function fileRef(name){ var rel="../sources/ministry/"+name, lab="gamal/science/sources/ministry/"+name; return LOCAL ? "<a href='"+rel+"'>"+esc(lab)+"</a>" : "<code>"+esc(lab)+"</code>"; }
function vParent(){
  var T = [["guess","Guess check"],["answers","Answers"],["sources","Sources"]];
  var h = "<section aria-labelledby='h'><h1 id='h' tabindex='-1'>For parents</h1><div class='seg' role='group' aria-label='Parent area'>"+T.map(function(t){ return "<button type='button' data-act='ptab' data-v='"+t[0]+"' aria-pressed='"+(ui.parentTab===t[0])+"'>"+t[1]+"</button>"; }).join("")+"</div>";
  return h+(ui.parentTab==="guess"?pGuess():ui.parentTab==="answers"?pAnswers():pSources())+"</section>";
}
function arenaBanner(){
  var bush = function(x,y){ return "<g transform='translate("+x+" "+y+")'><circle cx='0' cy='0' r='13' fill='#2c7a3b' "+OL+"/><circle cx='15' cy='5' r='11' fill='#359447' "+OL+"/><circle cx='-14' cy='6' r='10' fill='#359447' "+OL+"/></g>"; };
  var crate = function(x,y){ return "<g transform='translate("+x+" "+y+")'><rect x='-11' y='-11' width='22' height='22' rx='3' fill='#c98a3a' "+OL+"/><path d='M-11 0H11M0 -11V11' stroke='#ffc42e' stroke-width='4'/></g>"; };
  return "<div class='arenaBanner'><svg viewBox='0 0 360 150' role='img' aria-label='A top-down animal arena with bushes, a pond, crates and a dashed safe zone around your fighter'>"+
    "<rect width='360' height='150' fill='#4caa57'/><circle cx='60' cy='30' r='40' fill='#57b862'/><circle cx='300' cy='120' r='46' fill='#57b862'/><circle cx='230' cy='20' r='26' fill='#44a050'/>"+
    "<ellipse cx='58' cy='112' rx='40' ry='22' fill='#4aa3d8' "+OL+"/><ellipse cx='50' cy='108' rx='16' ry='6' fill='#8fd0f2'/>"+
    bush(300,38)+bush(36,40)+bush(318,100)+bush(120,128)+crate(250,112)+crate(96,30)+crate(330,66)+
    "<circle cx='180' cy='75' r='62' fill='none' stroke='#fff' stroke-width='4' stroke-dasharray='10 8'/>"+
    "<g transform='translate(146 41) scale(1.06)'>"+avatarBody(store.avatar)+"</g></svg></div>";
}

/* ---------- Render + events ---------- */
var main=document.getElementById("main");
var NAVS=[["lobby","Home"],["learn","Learn"],["mcq","MCQ"],["tf","T / F"],["write","Write"],["mock","Mock"]];
document.getElementById("bnav").innerHTML = NAVS.map(function(n){ return "<button class='nb' type='button' data-act='view' data-v='"+n[0]+"'>"+icon(n[0])+"<span>"+n[1]+"</span></button>"; }).join("");
function hud(){
  var lv=level();
  document.getElementById("plTxt").textContent=RANKS[Math.min(lv-1,RANKS.length-1)]+" · Lv "+lv;
  document.getElementById("xpBar").style.width=(store.coins%100)+"%";
  document.getElementById("coinTxt").textContent=store.coins;
  document.getElementById("avBtn").innerHTML=avatar(store.avatar,40);
  document.body.classList.toggle("calm",!!store.calm);
}
function pauseClock(){ if(!ui.mockRun) return; var pm=mstate(ui.mockRun.id); pm.secs=elapsed(ui.mockRun.id); ui.mockRun=null; save(); }
function render(focus){
  if(ui.mockRun && (ui.view!=="mock" || ui.paper!==ui.mockRun.id)) pauseClock();
  var v=ui.view, html;
  if(v==="learn") html=vLearn();
  else if(v==="mcq"||v==="tf") html = ui.round && ui.round.mode===v ? vRound(v) : vPicker(v);
  else if(v==="write") html=vWrite();
  else if(v==="mock") html=vMock();
  else if(v==="parent") html=vParent();
  else html=vLobby();
  main.innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll(".nb"), function(b){ if(b.getAttribute("data-v")===v) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  document.getElementById("parentBtn").setAttribute("aria-pressed", String(v==="parent"));
  hud();
  if(focus){ var h=document.getElementById("h"); if(h) h.focus({preventScroll:true}); window.scrollTo(0,0); }
}
function setView(v){ ui.view=v; render(true); }

setInterval(function(){ var c=document.getElementById("clock"); if(c && ui.mockRun && ui.view==="mock" && ui.mockRun.id===ui.paper) c.textContent=fmt(elapsed(ui.mockRun.id)); },250);

document.addEventListener("input", function(e){
  var t=e.target; if(!t) return;
  if(t.id==="typed"){ store.typed[t.getAttribute("data-id")]=t.value; save(); }
  else if(t.getAttribute && t.getAttribute("data-mock")){ var m=mstate(t.getAttribute("data-mock")); m.typed[t.getAttribute("data-n")]=t.value; save(); }
});

function touchRec(r, it, mode){
  var now=Date.now();
  if(!r.cur){
    r.cur={t:now, rid:r.rid, m:mode, q:it.id, k:r.key, w:0, first:false, f:null, d:null, p:r.picks, open:true};
    store.log.push(r.cur);
    if(store.log.length>600) store.log.splice(0, store.log.length-600);
  }
  var w=0; r.picks.forEach(function(x){ if(!x[1]) w++; });
  r.cur.w=w; r.cur.f=r.picks.length?r.picks[0][2]:null; r.cur.d=now-r.t0;
  save();
}
function finishItem(r, it, mode, ok){
  var now=Date.now();
  r.answered=true;
  var wrongN=(r.wrong[it.id]||[]).length + (mode==="tf" && !ok ? 1 : 0);
  var first = ok && wrongN===0;
  r.res[it.id]= first?"first":"miss";
  store[mode][it.id]= first?"first":"miss";
  if(first) r.earned+=award(mode+":"+it.id,10);
  touchRec(r, it, mode);
  r.cur.first=first; r.cur.open=false; r.cur.w=wrongN; save();
  say(first?"Correct":"Not quite. The answer is shown.");
}

document.addEventListener("click", function(e){
  var el=e.target.closest?e.target.closest("[data-act]"):null; if(!el) return;
  var a=el.getAttribute("data-act"), v=el.getAttribute("data-v"), id=el.getAttribute("data-id");
  if(el.tagName==="A") e.preventDefault();
  if(el.disabled) return;
  if(a==="view"){ setView(v); }
  else if(a==="parent"){ ui.parentTab=v; ui.view="parent"; render(true); }
  else if(a==="ptab"){ ui.parentTab=v; ui.copied=""; ui.confirmClear=false; render(false); }
  else if(a==="avatar"){ store.avatar=v; save(); render(false); }
  else if(a==="calm"){ store.calm=!store.calm; save(); render(false); }
  else if(a==="lesson"){ ui.lesson=v; render(false); }
  else if(a==="pool"){ ui.picker[ui.view]=v; render(false); }
  else if(a==="play"){ startRound(ui.view, ui.picker[ui.view]); }
  else if(a==="play-missed"){ startRound(ui.view,"missed"); }
  else if(a==="again"){ startRound(ui.round.mode, ui.round.key==="missed"?ui.picker[ui.round.mode]:ui.round.key); }
  else if(a==="quit"){ ui.round=null; render(true); }
  else if(a==="pick"){
    var r=ui.round; if(!r||r.answered) return;
    var it=itemById("mcq",r.ids[r.idx]), i=parseInt(el.getAttribute("data-i"),10), o=r.opts[it.id][i];
    r.picks.push([i, o.ok?1:0, Date.now()-r.t0]);
    if(!o.ok) store.mcq[it.id]="miss";
    touchRec(r, it, "mcq");
    if(o.ok){ finishItem(r,it,"mcq",true); render(false); var f=document.getElementById("fb"); if(f){ f.focus({preventScroll:true}); f.scrollIntoView({block:"nearest"}); } }
    else { (r.wrong[it.id]=r.wrong[it.id]||[]).push(i); say("Not this one. Try another answer."); render(false); var w=main.querySelector(".opt.wrong"); if(w && !store.calm) w.classList.add("shake"); }
  }
  else if(a==="tf"){
    var r2=ui.round; if(!r2||r2.answered) return;
    var it2=itemById("tf",r2.ids[r2.idx]), ok2=(v==="true")===it2.a; r2.picks.push([v==="true"?1:0, ok2?1:0, Date.now()-r2.t0]); finishItem(r2,it2,"tf",ok2); render(false); var f2=document.getElementById("fb"); if(f2){ f2.focus({preventScroll:true}); f2.scrollIntoView({block:"nearest"}); }
  }
  else if(a==="rnext"){ var r3=ui.round; r3.idx++; r3.answered=false; r3.picks=[]; r3.cur=null; r3.t0=Date.now(); render(true); }
  else if(a==="crate"){
    var r4=ui.round, left=LEARN.filter(function(c){ return store.cards.indexOf(c.id)<0; }), pickFrom=left.length?left:LEARN;
    var same=pickFrom.filter(function(c){ return r4.key==="5-3"||r4.key==="6-1" ? c.lesson===r4.key : true; }); if(same.length) pickFrom=same;
    var c=pickFrom[Math.floor(Math.random()*pickFrom.length)], isNew=store.cards.indexOf(c.id)<0;
    if(isNew){ store.cards.push(c.id); save(); }
    r4.crate={id:c.id,isNew:isNew}; render(false); say("Fact card: "+c.title);
  }
  else if(a==="group"){ ui.group=v; ui.idx=0; ui.queue=null; ui.view="write"; render(true); }
  else if(a==="goto"){ ui.idx=parseInt(v,10); render(false); window.scrollTo(0,0); }
  else if(a==="hint"){ ui.hint[id]=!ui.hint[id]; render(false); }
  else if(a==="reveal"){ ui.shown[id]=true; if(ui.wtId===id) ui.rv[id]=Date.now()-ui.wtAt; render(false); var an=document.getElementById("ans"); if(an){ an.focus({preventScroll:true}); an.scrollIntoView({block:"nearest"}); } }
  else if(a==="mark"){ store.got[id]=v; ui.shown[id]=true; if(v==="got") award("wr:"+id,10); logPush({t:Date.now(), m:"wr", q:id, mark:v, rv:(ui.rv[id]!=null?ui.rv[id]:null)}); render(false); }
  else if(a==="next"){ ui.idx++; render(false); window.scrollTo(0,0); }
  else if(a==="prev"){ if(ui.idx>0) ui.idx--; render(false); window.scrollTo(0,0); }
  else if(a==="retry"){ var g=groupById(ui.group); ui.queue=g.items.filter(function(it){ return store.got[it.id]!=="got"; }).map(function(it){ return it.id; }); ui.idx=0; ui.shown={}; render(true); }
  else if(a==="restart"){ ui.idx=0; ui.queue=null; ui.shown={}; ui.hint={}; render(true); }
  else if(a==="learncard"){ var cd=cardById(v); ui.lesson=cd?cd.lesson:"all"; ui.view="learn"; render(false); var t=document.getElementById("card-"+v); if(t) t.scrollIntoView({block:"start"}); }
  else if(a==="paper"){ ui.paper=v; render(false); }
  else if(a==="clock"){
    if(ui.mockRun && ui.mockRun.id===ui.paper){ var m0=mstate(ui.paper); m0.secs=elapsed(ui.paper); ui.mockRun=null; save(); }
    else { if(ui.mockRun){ var mo=mstate(ui.mockRun.id); mo.secs=elapsed(ui.mockRun.id); } ui.mockRun={id:ui.paper,t0:Date.now()}; }
    render(false);
  }
  else if(a==="finish"){ var m1=mstate(ui.paper); m1.secs=elapsed(ui.paper); if(ui.mockRun && ui.mockRun.id===ui.paper) ui.mockRun=null; m1.done=true; save(); render(true); }
  else if(a==="mmark"){ var m2=mstate(ui.paper), n=el.getAttribute("data-n"); m2.marks[n]=v; if(v==="ok") award("mock:"+ui.paper+":"+n,10); save(); render(false); }
  else if(a==="retake"){ var m3=mstate(ui.paper); m3.typed={}; m3.marks={}; m3.done=false; m3.secs=0; if(ui.mockRun && ui.mockRun.id===ui.paper) ui.mockRun=null; save(); render(true); }
  else if(a==="copyrep"){
    var txt=reportText();
    var fin=function(ok){ ui.copied=ok?"ok":"fail"; render(false); if(!ok){ var ta=document.getElementById("rep"); if(ta){ ta.focus(); ta.select(); } } };
    try{ navigator.clipboard.writeText(txt).then(function(){ fin(true); }, function(){ fin(false); }); }catch(err){ fin(false); }
  }
  else if(a==="clearlog"){ ui.confirmClear=true; render(false); }
  else if(a==="clearno"){ ui.confirmClear=false; render(false); }
  else if(a==="clearyes"){ store.log=[]; ui.confirmClear=false; ui.copied=""; save(); render(false); }
});

render(false);
})();
</script>
</body>
</html>
