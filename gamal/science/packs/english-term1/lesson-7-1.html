ion. This is very important to preserve \neach type of animal and human, and to continue life on Earth.\nDiscuss the following questions about the growth of cats with your classmates.\n1  \u0007Are all cats the same size?\n2  \u0007Have you ever seen a kitten grow? What changes did you notice?\n3  \u0007Have you ever seen other animals change their \nshape as they grow? How did they change?\n4  \u0007Do cats give birth to babies or lay eggs?\n5  \u0007Have you ever seen a mother cat taking care \nof her kittens?\n6  \u0007Do all animals give birth to babies like cats \ndo?\nLet's think about how cats grow!\n"}], "assessment": [{"pdf": 44, "printed": 45, "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQgJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wgARCAQEAtYDAREAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAECBAMFBgf/xAAaAQEBAQEBAQEAAAAAAAAAAAAAAQIDBAUG/9oADAMBAAIQAxAAAAH354jzdLpg+T7dZ3ssstavJkdfDnej5Vak14787yfczO/z8nv8y5BUBKoFqKoABKwkEFiCQVlmyCJYLJKwkFliwWiqyCyARUAkrAqQC61ShJUqtYmpINqFsRAoIgULRQzNX1ffI8P5+mjl69Hn+vsSyy1NksjN9PyN3TxzVl5nj+5ZrP8Ab8CYFVhIsiBNRJBCgElYQQCSpYgiBBNRFiAWKFgCSxAJIqBAEFSSpJBWIqq1EXCVNtRLYqKiKCSxCySZer6vvkeE8/TF832Y5+nbW3bazpxuYJt6efp+v4UErhef6mPy93S9vwF52WCqSVkggggVEFmyZaoIJIqsSBAqSWAKlihYAqSSSCCCxAKllhKxNsSStShUhdqQQWJJIIJNcSIVJJmaep7weA8/o0+L79l6HXz970/Kx+fXg+X65ZZadf2/nZZtWJw9+Jw+p0fb8TZfPYgollhIKRFRCoiKiJStqIBABCCSpIiQUJWEFiQQSCCAWICwAQTEVBEa6rLY2IIBKisKESCxJUGbt6jtB4Hye3V5fuSb3O+s5vTy4XH11aJavR+/4ORrjYxs98bPsy+nh2OURVag1lTVFAkLCQQAVBBJUoQAIIUREJNsSQWqVhIi1sSSQSTURCpqnLpLKxZKTprKkLdJJFWCyuuJKEyWskgpLBlbnqu+R4Tx/Q1+X7E2XTM7ebXzunPaFslrPX/S+Bv1zA5nn9WvnpV7NlxsY2azbUvrKoKxW2hrihrihRaFCxqiEgqCCxWJIKkggIUQl1giFkFlCMfHr5/m+4gykSVUQgtSRdImIWyTEUsSzAiqKrN9Hz/ce75I8r5foczyfYlJk6HfxYHH1QLbSb+uPY/Q/PyY+OlJrzni+tqx1yO3GLnD5em0VkiLXNszbcX3j0Ht+bl74zQkgkgoVjSsGuIt15moqUloQVSVhBBEAspUsVBapiho5+zm+b7qSd4265Y+emS46 ing="lazy" src="${p.image}" alt="${kind}, printed page ${p.printed}"><details><summary>Searchable text · check against the original image</summary><pre>${esc(p.text)}</pre></details></details>`}function quiz(l){return '<section class=card><h2>Learn it, then retrieve it</h2><p>Read the source sentence first. Cover it, then complete the same sentence from memory.</p>'+l.checks.map((q,i)=>`<article><details open><summary>Source sentence</summary><p>${esc(q.evidence)}</p></details><p>${esc(q.prompt)}</p><select data-check="${i}"><option value="">Choose a word</option>${[...q.options].sort().map(w=>`<option>${w}</option>`).join('')}</select><button onclick="checkAnswer(${i},this)">Check</button><p aria-live=polite></p></article>`).join('')+'</section>'}function checkAnswer(i,b){let q=D[cur].checks[i],a=b.previousElementSibling.value;b.nextElementSibling.textContent=a===q.answer?'Yes. '+q.evidence:'Read the source sentence again, then try once more.'}function render(){let l=D[cur];document.querySelector('#title').textContent=l.id+' · '+l.title;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));let out='';if(tab==='learn'){out=`<section class=card><h2>1. Explore the question</h2><p>${esc(l.prompt)}</p>${note('prediction','Before reading: what do you think?')}</section><section class=card><h2>2. Read and investigate</h2><div>${l.checks.map(q=>`<p class=card>${esc(q.evidence)}</p>`).join('')}</div><p>Open each original textbook page. Follow the diagrams and experiments in order.</p>${l.textbook.map(p=>page(p,'Textbook')).join('')}</section><section class=card><h2>3. Close the book and explain</h2>${note('recall','Explain what you learned. What evidence supports your explanation?')}<button onclick="tab='practice';render()">Try exercises →</button></section>`}if(tab==='homework'){out=`<section class=card><h2>Assessment book · Homework Performance</h2><p>Complete the section headed <strong>Homework Performance</strong> on the es. Assessment book: 62 scanned PDF pages; printed numbering is PDF page + 1 after the cover.</p><p>All original images are embedded for offline use. Searchable assessment text is OCR and may contain errors; the image controls the wording. No teacher answer key or invented automatic grading is included.</p><p><a href="https://drive.google.com/file/d/12XSa7KQlC-BIsLpm82x1XrCFtpUYAwWX/view">Full textbook online</a> · <a href="https://drive.google.com/file/d/1OjoipmjinEWTSUsR5TX6L2kpurfH0j95/view">Full assessment book online</a> · <a href="index.html">All chapters and lessons</a> · <a href="science-skills.html">Science skills and tools</a> · <a href="science-skills.html">Science skills and tools</a></p><p>Your notes stay in this browser on this device. Export them to keep a backup.</p><button onclick=exportNotes()>Export my answers</button></section>`}root.innerHTML=out;root.querySelectorAll('[data-note]').forEach(el=>{el.value=localStorage.getItem(key(el.dataset.note))||'';el.oninput=()=>localStorage.setItem(key(el.dataset.note),el.value)});let cb=root.querySelector('[data-done]');if(cb){cb.checked=localStorage.getItem(key('done'))==='true';cb.onchange=()=>localStorage.setItem(key('done'),cb.checked)}}function exportNotes(){let o={};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k.startsWith('science-en-2026:'))o[k]=localStorage.getItem(k)}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download='science-answers.json';a.click();URL.revokeObjectURL(a.href)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelector('#read').onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(root.innerText.slice(0,12000)))};document.querySelector('#stop').onclick=()=>speechSynthesis.cancel();render();</script></html>
