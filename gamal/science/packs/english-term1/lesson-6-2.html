r children until they grow up.\n \u0007Similarities between Parents and Children\nChildren look like their parents because they inherit features from their \nfather and mother.\nLook at this photo and discuss with your classmates.\nCan you find any features that are common to them?\n•\u0007What features does a boy share with his mother?\n•\u0007What features does a girl share with her father?\nLet’s describe the similarities and differences among them.\nLet's find similarities and differences in the family!\nConnection of Life and Parents' Role\n"}], "assessment": [{"pdf": 38, "printed": 39, "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQgJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wgARCAQEAtYDAREAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAIBAwQFBgf/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAffg5vNAyGWzDNZa3Ny0KAACUtFpSyABRGIETFLiIRAxyxQsRIqUtJKqLiyRIy1KpBLBOlRiMtFRhjCYiiEEAoFxVtmIsmsJBJBcLbS4nVgpZG9udLoAGhi1Fpl0LtagAAAAAAAAAAAAARRAiRlpIrSJYll0gCJGJ0LoVESMQMEuMiYpCCoAqoxVY4nbRBBGoVEx2qiKw1itxVh09BJ7PEAGhzTTVt3a2dAAAAAAAAAAAAAAAAAAAAAAAAAAEUUYD5b6kc2ZcLMkVJV1AspZBIFLEktrZOSKxWCSsHosz3XPIA5PNuVk0zUAAAAAAAAAAAAAAAAAAAAAAAAAAABhPlXpM3IQOlJqau3mVLqabObaYdNmOaUsDItrGKJESVts2egzPb88gCEToAAAAAAAAAAAAAAAADSOHvXb553TCZDn1I6MKAAAAAAAwx8q9VzRQjKKyQjVa2CrIVOMcURWydsSMLc6bEZpNiOznPocwAAAAAAAAAAAAAAAAAAADxfS6RkrYjdxOzh5rtexmdzIAAAAAACJw9pLBIlAEVFkiSWs5LWRkMsTkstc8kwKQoAAAAQi6141DqApKXkm8ZDMapzl303a14szEDJQAAAAGEwkajF1pVPLcrdgAAAAAAAAAAAAAACiwCiJMAAAAAAA85HXjzNekjxtcw6JiXCbZI6ieqPNHHOquWTSNxdM7qaxtVkjWOpWQwETCdCgKLhQRRdAAAAAAAAAAAAAAAAAAAAAAAAADnRVbRjJFRhFb5ZREmYTXi6uMJqrSYow1nNQ1o1F2ltOknOXZS13rOXL0E3DBbsJyI3l3bJGA3iZYLLFWABFGIzUAAAAAAAAAAAAAAAAAOVEjCaBsmyYjt0AAAABRYABRjiJrgwEjCuBN44RtLBJS65jLJGidU5q5UzlFHQrUizGYV20xG7XorEAKCAAoAAAAAAAAAAAeEjcKJG0bpA6tZQAAAAAAAAAAAAQJgAAA58b9CgYyyBGMZFbSBlNisMCyiRRZEszVkAAAABAmAAAAABCgAAAAAAA t need a «healthy diet» and grew normally just through\n\nsleep only, how would that affect the strength of his muscles and physical\nstructure? Discuss the effect on his health.\n\n3. What is meant by reproduction? And what is its benefit?\n\n4. What happens if a one type of living organism Stops reproduction?\n\nWeekly Assessment\n\nTest (1)\n1. Complete: the main stages of human growth starts from\n\ngrow healthy and strong, strength, and e1 \"\nmilk, vegetables, and fruits. nergy, which can be obtained from\n\nfa)\n\n($3) CamScanner\n"}], "facts": ["\u0007Every human life begins from a father and a mother.", "Parents take good care of and protect their children until they grow up.", "Children look like their parents because they inherit features from their", "Look at this photo and discuss with your classmates."], "assigned": [], "prompt": "your father or mother”?", "checks": [], "homeworkPrinted": [39]}];let cur=0,tab='learn';const root=document.querySelector('#body'),sel=document.querySelector('#lesson');D.forEach((l,i)=>sel.add(new Option(l.id+' · '+l.title,i)));sel.onchange=()=>{cur=+sel.value;render()};function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function key(s){return 'science-en-2026:'+D[cur].id+':'+s}function note(id,label){return `<label>${label}<textarea data-note="${id}" placeholder="Write here, or tell your parent aloud."></textarea></label>`}function page(p,kind){return `<details><summary>${kind} · printed page ${p.printed} (PDF ${p.pdf})</summary><img loading="lazy" src="${p.image}" alt="${kind}, printed page ${p.printed}"><details><summary>Searchable text · check against the original image</summary><pre>${esc(p.text)}</pre></details></details>`}function quiz(l){return '<section class=card><h2>Learn it, then retrieve it</h2><p>Read the source sentence first. Cover it, then complete the same sentence from memory.</p>'+l.checks.map((q,i)=>`<article><details open><summary>Source sentence</summary><p>${esc(q.evidence)}</p></details><p>${esc(q.prompt)}</p><select data-check="${i}"><option value="">Choose a word</option>${[...q.options].sort().map(w=>`<option>${w}</option>`).join('')}</select><button onclick="checkAnswer(${i},this)">Check</button><p aria-live=polite></p></article>`).join('')+'</section>'}function checkAnswer(i,b){let q=D[cur].checks[i],a=b.previousElementSibling.value;b.nextElementSibling.textContent=a===q.answer?'Yes. '+q.evidence:'Read the source sentence again, then try once more.'}function render(){let l=D[cur];document.querySelector('#title').textContent=l.id+' · '+l.title;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));let out='';if(tab==='learn'){out=`<section class=card><h2>1. Explore the question</h2><p>${esc(l.prompt)}</p>${note('prediction','Before reading: what do you think?')}</section><section class=card><h2>2. Read and investigate</h2><div>${l.checks.map(q=>`<p class=card>${esc(q.evidence)}</p>`).join('')}</div><p>Open each original textbook page. Follow the diagrams and experiments in order.</p>${l.textbook.map(p=>page(p,'Textbook')).join('')}</section><section class=card><h2>3. Close the book and explain</h2>${note('recall','Explain what you learned. What evidence supports your explanation?')}<button onclick="tab='practice';render()">Try exercises →</button></section>`}if(tab==='homework'){out=`<section class=card><h2>Assessment book · Homework Performance</h2><p>Complete the section headed <strong>Homework Performance</strong> on the reference pages below. A shared page may also contain the next lesson or a test; only the matching homework section belongs here.</p>${l.assigned.length?`<p class=badge>Assignment page references on these shared pages: ${l.assigned.join(', ')}. Match the lesson heading before answering.</p>`:''}${l.id==='4-1'?'<p class=warn>The supplied assignment lists page 27. In this scan page 27 is germination homework; Sunlight and Growth begins on page 28 and its homework is on page 29. Verify the school edition before treating page 29 as assigned.</p>':''}<p><strong>Matching homework: printed pages ${l.homeworkPrinted.join(', ')}.</strong></p>${l.assessment.filter(p=>l.homeworkPrinted.includes(p.printed)).map(p=>page(p,'Assessment book')).join('')}${note('homework','My homework answers — use the original question numbers')}<p>No official answer key was supplied. Review written or spoken responses with a parent; these answers are not automatically scored.</p></section>`}if(tab==='practice'){out=quiz(l)+`<section class=card><h2>Textbook exercises and assessment models</h2><p>Use the textbook’s Try / Practise questions and the assessment book’s Weekly Assessment / Test sections. Shared models can cover earlier lessons too.</p><h3>Textbook questions</h3>${l.textbook.map(p=>page(p,'Textbook')).join('')}<h3>Weekly tests and classroom tasks</h3>${l.assessment.map(p=>page(p,'Assessment book')).join('')}${note('practice','My exercise / test answers')}<details><summary>Review my answer</summary><p>Reopen the explanation pages. Check each claim against a sentence, diagram or experiment. Correct your response below; ask a parent about anything unclear.</p>${note('correction','My corrected explanation')}</details><label><input type=checkbox data-done> I reviewed this lesson with evidence from the book.</label></section>`}if(tab==='sources'){out=`<section class=card><h2>Both books · source and scope</h2><p>English Ministry Science textbook, First Term 2026–2027: downloaded PDF has 110 pages. Assessment book: 62 scanned PDF pages; printed numbering is PDF page + 1 after the cover.</p><p>All original images are embedded for offline use. Searchable assessment text is OCR and may contain errors; the image controls the wording. No teacher answer key or invented automatic grading is included.</p><p><a href="https://drive.google.com/file/d/12XSa7KQlC-BIsLpm82x1XrCFtpUYAwWX/view">Full textbook online</a> · <a href="https://drive.google.com/file/d/1OjoipmjinEWTSUsR5TX6L2kpurfH0j95/view">Full assessment book online</a> · <a href="index.html">All chapters and lessons</a> · <a href="science-skills.html">Science skills and tools</a> · <a href="science-skills.html">Science skills and tools</a></p><p>Your notes stay in this browser on this device. Export them to keep a backup.</p><button onclick=exportNotes()>Export my answers</button></section>`}root.innerHTML=out;root.querySelectorAll('[data-note]').forEach(el=>{el.value=localStorage.getItem(key(el.dataset.note))||'';el.oninput=()=>localStorage.setItem(key(el.dataset.note),el.value)});let cb=root.querySelector('[data-done]');if(cb){cb.checked=localStorage.getItem(key('done'))==='true';cb.onchange=()=>localStorage.setItem(key('done'),cb.checked)}}function exportNotes(){let o={};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k.startsWith('science-en-2026:'))o[k]=localStorage.getItem(k)}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download='science-answers.json';a.click();URL.revokeObjectURL(a.href)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelector('#read').onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(root.innerText.slice(0,12000)))};document.querySelector('#stop').onclick=()=>speechSynthesis.cancel();render();</script></html>
