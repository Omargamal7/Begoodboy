A Plant’s Yearly Cycle\n2-1 Changes over a Year\t\nChanges in the Seasons\nChapter 2\n21\nLet’s observe a yearly cycle!\nLet’s check the order of how a luffa changes.\n1  \u0007Check with pictures and encyclopedias:\n•\u0007Let’s look at the order of when the seeds were planted, when the flowers \nbloomed, and when the fruit turned brown.\n•Let’s find out the seasons when the flowers bloom and the fruits grow.\n2  \u0007After withering:\n•\u0007Let’s focus on the fact that plants don’t just “wither \nand die”, but they produce seeds to continue \ntheir life cycle the following year.\n3  \u0007Discovery:\n•\u0007Let’s research the yearly cycles of other plants and present \nour findings.\n \u0007Plants grow and change their appearance significantly depending on \nseasonal temperature.\n•\u0007Summer (When the temperature is high):   \nSeeds sprout, grow their stems tall, spread their leaves wide, and produce \nflowers.\n•\u0007Winter (When the temperature is low):   \nPlants start to wither, but they produce seeds for the next generation. \nThey wait for the next warm season.\n▼A Tomato’s Yearly Cycle\nWhat color and shape \nare luffa seeds?\n"}], "assessment": [{"pdf": 10, "printed": 11, "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQgJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wgARCAQEAtYDAREAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAEEAwIFBgf/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAffg4PnsGDeKPp4NZWRNRZKaNM3Nx65uPXeWKkEgm1EIJUkrKQLYkkg2XUhCkAiko2BBAABBMapNsRIsiCkiWaSLdYWTEmpAWLINYlZISTakQCZFolbunoO+AB57hcPXlS9HDSWxw7ZefTaWK1Zx9M4evPDvDNt+b0ZsagE1KgSACSQagAk1IBIUkAkkBYATWNqgEQIJAFRAAEEwURZEQmohSIFbLJJCQI2CzV3T0HfIA8xjFL0+fLz62vN3xkwqAAY95q+jhj1m15fTn57kGpJtaABsAQkALJAIJAIAJIJIJjVJULIlmogQSBWsDZAWBItINY0BKkgAGwISZSSTbsXNu92yAPHdfLvz6XvP6NTBJtUAgEKFlP1ebHqXPH6sspUkG1okgG1ImoNYhNlKSCCQSsIABAAqSICIqSYiggQSEKBJ
