 rubber\nband.\n\n2. Leave it for a period of time.\n\na. Observation\nb. Conclusior\n\n* Research - Life Applications: Search for other examples\nof the two phenomena «Evaporation» and «Condensation»\nin your daily life, other than the examples mentioned in the\nschool textbook, Explain how that happened, and present the\nresults in the form of a «wall poster» or a short presentation,\n\n($3) CamScanner\n"}, {"pdf": 56, "printed": 57, "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQgJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wgARCAQEAtYDAREAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAEEAgMFBgf/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAfvwDly1Vy79MbFaSCFyZEQZWIyQZWAQZBEEm2IEEAmpWCUAmAqASBCkomwSSQSKiAJCkggkkUESQKmBAJrURUkkpNREnWrGgAAHLLlL2udEqsEGIyuYggiXAjBBJFZMkQJIqIAWzE0QJYJJIQKQJWCaRqwFlCyQihMTUSkgE1IAiRUGYEgk1UGiSSaJJ0rtQAAGIiTVSSoEJgxLBmFRLkzGYgzUCIqIgUiCSDVqQRUwXVQTEAhJCqSTSJoSokkyg0dKwAQQSaqJZCDMQSTUxNCRUgiJrSa03HWgAAMyCVlCgQmDnLBEKiIlyZjJFQQQhYhUESFmw0kKQSpJIJCwkEkqJsg1KsEkgg0K0AqokkUJhSIMxqpBJNJJtEoUZJTpWzpQAAGYmSbQBBk5xiWKAgRkzLFZgRWZBBJkiAJpBSAACVEEpCyAk0BJJNsJMTU1IiagkAkAgyaNAgEg0TSJqbIjMarZ2oAABAARBFcpcnMAkzCkZXQqIGQmRELASAFCRbEgkhVIAEVMCbANAUJNEkCkTQAkEGSTZIAJINAmtJAMqNJZoAABACMmazEE2ykkmgSBQAiBBBBkiXJAIjJC5BkmMgUgKRAAsRJNFhJJJIMkAkglJtmMJk6LNaiKQNEE1JJJCBEW9LLNAAAIAzJC7pQAAAAAAAAAAAAAARAIIMgLkkiIABBAFSRHiExKCSFEmQmlkEEmCRQgkJmyFxE2elXrKAABEIGDpoBBIAAAAAAAAAAAAAAAAAAAAAAAIPzzfOYkwdI5VCbIOcTbJsLkklSQaiFUSJNA+smvXaAAA5Qymt1NAAAAAAAAAAZNAAAAAAAAAAAAAAAiPzzpz1GamOsvVM25kzXaMk25SvLgg60Iki3QMmiImvq832GgAAK+WZbGpqgAAAAIiaAAAAAAAAAAAAAAAAAAAAR8J15zJkGCCCTCwbIOgMIl3QRquhC6EbqT6fGrigAAco6igMxipEVLfH3qxJ6cng9LzPWwytWrEQd0ynTN8zbmvevY5ywlKr2YNHk61bi0zJIAAAAAAAAAAgAAAgAKBAhZKgAKAGDYAAAhQRUt+f663Jw1a9eljNLd9DM9bnONtfUmWxEAyZokExwrC+Xu+ziUWqG3JfqOePG1e2baST3c5AAAAAAAAAAAAAAAAAAAAAAA5R1oAAAAIpacl6pYjpJKhQAAAAAACFD ntent=l.id+' · '+l.title;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));let out='';if(tab==='learn'){out=`<section class=card><h2>1. Explore the question</h2><p>${esc(l.prompt)}</p>${note('prediction','Before reading: what do you think?')}</section><section class=card><h2>2. Read and investigate</h2><div>${l.checks.map(q=>`<p class=card>${esc(q.evidence)}</p>`).join('')}</div><p>Open each original textbook page. Follow the diagrams and experiments in order.</p>${l.textbook.map(p=>page(p,'Textbook')).join('')}</section><section class=card><h2>3. Close the book and explain</h2>${note('recall','Explain what you learned. What evidence supports your explanation?')}<button onclick="tab='practice';render()">Try exercises →</button></section>`}if(tab==='homework'){out=`<section class=card><h2>Assessment book · Homework Performance</h2><p>Complete the section headed <strong>Homework Performance</strong> on the reference pages below. A shared page may also contain the next lesson or a test; only the matching homework section belongs here.</p>${l.assigned.length?`<p class=badge>Assignment page references on these shared pages: ${l.assigned.join(', ')}. Match the lesson heading before answering.</p>`:''}${l.id==='4-1'?'<p class=warn>The supplied assignment lists page 27. In this scan page 27 is germination homework; Sunlight and Growth begins on page 28 and its homework is on page 29. Verify the school edition before treating page 29 as assigned.</p>':''}<p><strong>Matching homework: printed pages ${l.homeworkPrinted.join(', ')}.</strong></p>${l.assessment.filter(p=>l.homeworkPrinted.includes(p.printed)).map(p=>page(p,'Assessment book')).join('')}${note('homework','My homework answers — use the original question numbers')}<p>No official answer key was supplied. Review written or spoken responses with a parent; these answers are not automatically scored.</p></section>`}if(tab==='practice'){out=quiz(l)+`<section class=card><h2>Textbook exercises and assessment models</h2><p>Use the textbook’s Try / Practise questions and the assessment book’s Weekly Assessment / Test sections. Shared models can cover earlier lessons too.</p><h3>Textbook questions</h3>${l.textbook.map(p=>page(p,'Textbook')).join('')}<h3>Weekly tests and classroom tasks</h3>${l.assessment.map(p=>page(p,'Assessment book')).join('')}${note('practice','My exercise / test answers')}<details><summary>Review my answer</summary><p>Reopen the explanation pages. Check each claim against a sentence, diagram or experiment. Correct your response below; ask a parent about anything unclear.</p>${note('correction','My corrected explanation')}</details><label><input type=checkbox data-done> I reviewed this lesson with evidence from the book.</label></section>`}if(tab==='sources'){out=`<section class=card><h2>Both books · source and scope</h2><p>English Ministry Science textbook, First Term 2026–2027: downloaded PDF has 110 pages. Assessment book: 62 scanned PDF pages; printed numbering is PDF page + 1 after the cover.</p><p>All original images are embedded for offline use. Searchable assessment text is OCR and may contain errors; the image controls the wording. No teacher answer key or invented automatic grading is included.</p><p><a href="https://drive.google.com/file/d/12XSa7KQlC-BIsLpm82x1XrCFtpUYAwWX/view">Full textbook online</a> · <a href="https://drive.google.com/file/d/1OjoipmjinEWTSUsR5TX6L2kpurfH0j95/view">Full assessment book online</a> · <a href="index.html">All chapters and lessons</a> · <a href="science-skills.html">Science skills and tools</a></p><p>Your notes stay in this browser on this device. Export them to keep a backup.</p><button onclick=exportNotes()>Export my answers</button></section>`}root.innerHTML=out;root.querySelectorAll('[data-note]').forEach(el=>{el.value=localStorage.getItem(key(el.dataset.note))||'';el.oninput=()=>localStorage.setItem(key(el.dataset.note),el.value)});let cb=root.querySelector('[data-do
