ing about 9 months inside the mother’s \nbody. Infants are very small and completely depend on their mothers for \nfood, care, and protection.\n•\u0007Childhood:\b\n \nThis is the stage when humans start walking, talking, and going to school. \nTheir bones and muscles get stronger.\n•\u0007After childhood, human growth continues through youth, adulthood, and \nold age.\nConnection of Life and Growth\n"}], "assessment": [{"pdf": 36, "printed": 37, "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQgJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wgARCAQEAtYDAREAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAEDAgQFBgf/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAffgHOxfN8rr6cv1c7bdnlrYyyivUo3MOuZzej59W80ELJiCSCCQQQspCyQIkgkEAgEggRFsJIBCxGVYyFJBNTE0kVEsmKKSxURgQY1jGS4pisErKZwIRLkZpmez9Wb6AAHMxfN87xvVzul6fn1ZEGRmQlO2h6M4bnQ82ruWoJTGFqIpChBBlAEKMjEkxiaEQrKMQkKpAikKQIBIBEKAQrEkxXOTGsJYMEUXERJBbSMiBGNZEp7f05voAAcjDyNlPR1PNqUzAMiEE28v0zDpOp5dZ80EBRAEARUxAAJEuNSQSRCoBMRURFCSImoAiATCoIJiKyMQZS40QYLCQYrgsyZGSYLmSZAyIBie29ONigABwo8d2z0/Lu3LJMirUyLpYMYyIrk+vNidLybRAWELBIEARSJBJCkKSVwJSFEmCZS4VIEKggQoRE1EZGKFkEAEAxWExIlGSZKqIlJJIMyAYntfTm+gAB56zhZt3G52Ubmn6cxZGl2W75tW89IGv0c/1Y6PDWxwqsYypELJFkwXGJqIkEkCSbcSCRAViTEVETaSBGNTAEmItSSQCCCQKiWTEgwJi0xoYmQiUlYAMiD2XpzfQAA8/ZyuGqSvpnT9WcSwGZMm/wANXcalVyPVm+uh5N4wJJQpItmQqIAqIkkgEAEEmJJiIihJAhUExNYwIJIJBABAUkmKjEiMrJIVAJNJQhZko9j6c30AAOEcThY1OR7MW0LVhMqQOt4t4xJpdprd89fx9IiCZJtSQFyBAIiSAADEEkAGBJBAAAIMiCIipEKgExABNYyyQQSYgGZjACpBMYmZJ7D05uoAAcSODytPXPN9OLrZXoZurcxWUYnU4b2ONmNPpND057Hm3lhETURBiBAEEAAiJoYxIIoTEVEQQQARUxIIBiFlMzEgkroSSIELiTCoiCSKiAJMqgSRpjXtes2KAAHFjh8nO9eaOkuXp51YnO1kSiOty6dTjS6+poejPQ4bu5osiXGKyuogIGKYkqTEkxiDEEAUiCCARGNBE1MQQDEkkEEg8/7MNzJM5akyWpZIWU2TFKjG3EgySViRbE0TE+o8rtQAAOTlxcXj+3EWWr6flrldM35cjWVZR6HG+/yoAAAARBiYLhFZgVxguEYlcYlZBiSZRjUxgQQYiICTSMSAIipjGkBb5714azFuyuWZNuK2JSYV  is germination homework; Sunlight and Growth begins on page 28 and its homework is on page 29. Verify the school edition before treating page 29 as assigned.</p>':''}<p><strong>Matching homework: printed pages ${l.homeworkPrinted.join(', ')}.</strong></p>${l.assessment.filter(p=>l.homeworkPrinted.includes(p.printed)).map(p=>page(p,'Assessment book')).join('')}${note('homework','My homework answers — use the original question numbers')}<p>No official answer key was supplied. Review written or spoken responses with a parent; these answers are not automatically scored.</p></section>`}if(tab==='practice'){out=quiz(l)+`<section class=card><h2>Textbook exercises and assessment models</h2><p>Use the textbook’s Try / Practise questions and the assessment book’s Weekly Assessment / Test sections. Shared models can cover earlier lessons too.</p><h3>Textbook questions</h3>${l.textbook.map(p=>page(p,'Textbook')).join('')}<h3>Weekly tests and classroom tasks</h3>${l.assessment.map(p=>page(p,'Assessment book')).join('')}${note('practice','My exercise / test answers')}<details><summary>Review my answer</summary><p>Reopen the explanation pages. Check each claim against a sentence, diagram or experiment. Correct your response below; ask a parent about anything unclear.</p>${note('correction','My corrected explanation')}</details><label><input type=checkbox data-done> I reviewed this lesson with evidence from the book.</label></section>`}if(tab==='sources'){out=`<section class=card><h2>Both books · source and scope</h2><p>English Ministry Science textbook, First Term 2026–2027: downloaded PDF has 110 pages. Assessment book: 62 scanned PDF pages; printed numbering is PDF page + 1 after the cover.</p><p>All original images are embedded for offline use. Searchable assessment text is OCR and may contain errors; the image controls the wording. No teacher answer key or invented automatic grading is included.</p><p><a href="https://drive.google.com/file/d/12XSa7KQlC-BIsLpm82x1XrCFtpUYAwWX/view">Full textbook online</a> · <a href="https://drive.google.com/file/d/1OjoipmjinEWTSUsR5TX6L2kpurfH0j95/view">Full assessment book online</a> · <a href="index.html">All chapters and lessons</a> · <a href="science-skills.html">Science skills and tools</a> · <a href="science-skills.html">Science skills and tools</a></p><p>Your notes stay in this browser on this device. Export them to keep a backup.</p><button onclick=exportNotes()>Export my answers</button></section>`}root.innerHTML=out;root.querySelectorAll('[data-note]').forEach(el=>{el.value=localStorage.getItem(key(el.dataset.note))||'';el.oninput=()=>localStorage.setItem(key(el.dataset.note),el.value)});let cb=root.querySelector('[data-done]');if(cb){cb.checked=localStorage.getItem(key('done'))==='true';cb.onchange=()=>localStorage.setItem(key('done'),cb.checked)}}function exportNotes(){let o={};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k.startsWith('science-en-2026:'))o[k]=localStorage.getItem(k)}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download='science-answers.json';a.click();URL.revokeObjectURL(a.href)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelector('#read').onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(root.innerText.slice(0,12000)))};document.querySelector('#stop').onclick=()=>speechSynthesis.cancel();render();</script></html>
