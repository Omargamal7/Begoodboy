v/2Q==", "text": "Structure and Nutrients of a Seed\n29\n3-1 Inside the Seed\t\nConditions for Germination\nChapter 3\nLet’s dissect and check the seed!\nLet’s observe kidney beans closely and find the secret of germination.\nSteps\n1  \u0007Peel the seed coat:  \u0007Peel the seed coat of a kidney bean that has been \nsoaked in water overnight to make it soft, and split it in half.\n2  \u0007Observe:  \u0007Look closely inside with a magnifying glass and find the embryo, \nwhich will become the “sprout” in the future.\n3  \u0007Apply iodine solution:\b\n \n\u0007Add a drop of iodine solution on the split cross-section and observe how the \ncolor changes.\n•\u0007Check if it contains starch from the color change of the seed.\n4  \u0007Discovery:\b\n \n\u0007Cut the cotyledon of a seed that has germinated and grown for a few days, \nadd a drop of iodine solution on it, and observe if the color changes. \n \u0007When a plant seed sprouts, it is called germination.\n \u0007Inside the seed, there is a part that will become a new plant and a part that \nstores the nutrients needed for the sprout to grow.\n•\u0007Cotyledon:\nThe part that makes up most of seeds like \nkidney beans. It is packed with starch, which \nbecomes the nutrient for germination.\n \u0007Iodine test for starch:\nWhen you put iodine solution on starch, the color changes to blue-black.\nCotyledon\nPart that will \nbecome \nleaves, stems, \nand roots\n25\n"}], "assessment": [{"pdf": 16, "printed": 17, "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQgJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wgARCAQEAtYDAREAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAECBAMFBgf/xAAaAQEBAQEBAQEAAAAAAAAAAAAAAQIEAwUG/9oADAMBAAIQAxAAAAH35qy4vjbRUxseuL59unHSbhozfXPv9OPf68kFQQLYKpEsAgFSAQCSAQSSQQTCpUQIVJWBFSIshYqURVZAISy1CSsFSEmWErbMUWq1LJZJtmLIJlhZitlyrU8fX7n6/wA8DVHG8LE1zvH6Wjy7x hared models can cover earlier lessons too.</p><h3>Textbook questions</h3>${l.textbook.map(p=>page(p,'Textbook')).join('')}<h3>Weekly tests and classroom tasks</h3>${l.assessment.map(p=>page(p,'Assessment book')).join('')}${note('practice','My exercise / test answers')}<details><summary>Review my answer</summary><p>Reopen the explanation pages. Check each claim against a sentence, diagram or experiment. Correct your response below; ask a parent about anything unclear.</p>${note('correction','My corrected explanation')}</details><label><input type=checkbox data-done> I reviewed this lesson with evidence from the book.</label></section>`}if(tab==='sources'){out=`<section class=card><h2>Both books · source and scope</h2><p>English Ministry Science textbook, First Term 2026–2027: downloaded PDF has 110 pages. Assessment book: 62 scanned PDF pages; printed numbering is PDF page + 1 after the cover.</p><p>All original images are embedded for offline use. Searchable assessment text is OCR and may contain errors; the image controls the wording. No teacher answer key or invented automatic grading is included.</p><p><a href="https://drive.google.com/file/d/12XSa7KQlC-BIsLpm82x1XrCFtpUYAwWX/view">Full textbook online</a> · <a href="https://drive.google.com/file/d/1OjoipmjinEWTSUsR5TX6L2kpurfH0j95/view">Full assessment book online</a> · <a href="index.html">All chapters and lessons</a> · <a href="science-skills.html">Science skills and tools</a> · <a href="science-skills.html">Science skills and tools</a></p><p>Your notes stay in this browser on this device. Export them to keep a backup.</p><button onclick=exportNotes()>Export my answers</button></section>`}root.innerHTML=out;root.querySelectorAll('[data-note]').forEach(el=>{el.value=localStorage.getItem(key(el.dataset.note))||'';el.oninput=()=>localStorage.setItem(key(el.dataset.note),el.value)});let cb=root.querySelector('[data-done]');if(cb){cb.checked=localStorage.getItem(key('done'))==='true';cb.onchange=()=>localStorage.setItem(key('done'),cb.checked)}}function exportNotes(){let o={};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k.startsWith('science-en-2026:'))o[k]=localStorage.getItem(k)}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download='science-answers.json';a.click();URL.revokeObjectURL(a.href)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelector('#read').onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(root.innerText.slice(0,12000)))};document.querySelector('#stop').onclick=()=>speechSynthesis.cancel();render();</script></html>
