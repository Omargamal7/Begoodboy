6Pco7nNqicg48atsqrJzUtL7a4wvEfFAVx+dTCnFYglVe366I/KkSZG2nbpNpfMVDDL7frqnIjC8hPHf9DVKBUCoAznNmn4NkvRIyYzXalOWW9MW8Y/XWFoyVxYv487NmzZs2bNmzZs2bNmzZs2bNmzZs2bNmzZs2bNmzZs2f6t/9k=", "text": "Cloud Cover and Weather\n81\n8-1 Clouds and Weather\t\nChanges in Weather\nChanges in Weather\nChapter 8\nLet’s check the cloud cover and decide the weather!\nLet’s look at the sky and determine what the weather is now.\n1  \u0007Divide the sky:\nImagine dividing the whole sky into 8 blocks.\n2  \u0007Count the clouds:\nCheck how many blocks are covered by clouds (the cloud cover).\n3  \u0007Determine the weather:\n\u0007If the cloud cover is “6” or less, write down “Sunny”. If it is “7” or more, write \ndown “Cloudy”.\n4  \u0007Discovery:\n\u0007What color are the clouds on \na rainy day? Let’s compare \nthem with a sunny day.\n \u0007We use the cloud cover to determine the weather. If we consider the \nwhole sky as “8”, we use numbers from 0 to 8 to show how much of the sky \nis covered by clouds.\n•When the cloud cover is 0 to 6:  Sunny\n•When the cloud cover is 7 to 8:  Cloudy\n\t *\u0007No matter the cloud cover, if it is raining or snowing, the weather is “rain” \nor “snow”.\n \u0007When the weather changes, the cloud cover increases or decreases, and \nthe clouds change their shapes.\n"}], "assessment": [{"pdf": 48, "printed": 49, "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQgJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wgARCAQEAtYDAREAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAEEAgMFBgf/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAfvweNynzvn1Z6upokmpIC+bx58HP1e3Xd1ghYCRURFAQSQSCYgA0soACyQSQEmCgQkWxIUAKRJJIJIiamFImskRokGUg2ImpBokgiJSV3Xv950oAePyeLz1KZZ5Zwq1rW7vnAzL5fLjZ29Dr1xGKzE1IqAQCSASQTGiDRJBIWEEgRNIAgkyZACk0pCyDRBBJMSQEyuTokkEEkwJJFagQQaNVo+g7zpQA8vnfD5XhMUOXOQbS711Y10i0UuWK+cev3681zQEihAIJIBJJMSQSCQCFlIWQEkhUEVECAFh at happens if:\n\nClouds gathered in the sky and covered 7 parts or more of the sky (divided into\n8 parts)?\n\n¢ Small Cloud Observer\nTools: Compass - Clock - Pen and observation card,\nSteps:\n\n1. Stand in an open area and choose a fixed\n«reference point» in the sky (such as a\nschool building peak - Top of the tree),\n\n2. Use the compass to accurately determine\nEast and West directions.\n\n3. Observe the clouds next to your «Fixed\nReference Point» for 15 minutes.\n4. Record in the observation card.\n\n60)\n\n($3) CamScanner\n"}], "facts": ["When we look up at the sky, how do we decide if it is", "Check how many blocks are covered by clouds (the cloud cover).", "\u0007If the cloud cover is “6” or less, write down “Sunny”. If it is “7” or more, write", "\u0007We use the cloud cover to determine the weather. If we consider the", "whole sky as “8”, we use numbers from 0 to 8 to show how much of the sky", "*\u0007No matter the cloud cover, if it is raining or snowing, the weather is “rain”"], "assigned": [], "prompt": "“sunny” or “cloudy”?", "checks": [{"evidence": "80 Clouds and Weather Clouds and Weather Chapter Chapter 8 .....", "prompt": "80 _____ and Weather Clouds and Weather Chapter Chapter 8 .....", "answer": "clouds", "options": ["clouds", "evaporation", "condensation"]}, {"evidence": "2 Count the clouds: Check how many blocks are covered by clouds (the cloud cover).", "prompt": "2 Count the _____: Check how many blocks are covered by clouds (the cloud cover).", "answer": "clouds", "options": ["clouds", "evaporation", "condensation"]}, {"evidence": "If we consider the whole sky as “8”, we use numbers from 0 to 8 to show how much of the sky is covered by clouds.", "prompt": "If we consider the whole sky as “8”, we use numbers from 0 to 8 to show how much of the sky is covered by _____.", "answer": "clouds", "options": ["clouds", "evaporation", "condensation"]}], "homeworkPrinted": [50]}];let cur=0,tab='learn';const root=document.querySelector('#body'),sel=document.querySelector('#lesson');D.forEach((l,i)=>sel.add(new Option(l.id+' · '+l.title,i)));sel.onchange=()=>{cur=+sel.value;render()};function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function key(s){return 'science-en-2026:'+D[cur].id+':'+s}function note(id,label){return `<label>${label}<textarea data-note="${id}" placeholder="Write here, or tell your parent aloud."></textarea></label>`}function page(p,kind){return `<details><summary>${kind} · printed page ${p.printed} (PDF ${p.pdf})</summary><img loading="lazy" src="${p.image}" alt="${kind}, printed page ${p.printed}"><details><summary>Searchable text · check against the original image</summary><pre>${esc(p.text)}</pre></details></details>`}function quiz(l){return '<section class=card><h2>Learn it, then retrieve it</h2><p>Read the source sentence first. Cover it, then complete the same sentence from memory.</p>'+l.checks.map((q,i)=>`<article><details open><summary>Source sentence</summary><p>${esc(q.evidence)}</p></details><p>${esc(q.prompt)}</p><select data-check="${i}"><option value="">Choose a word</option>${[...q.options].sort().map(w=>`<option>${w}</option>`).join('')}</select><button onclick="checkAnswer(${i},this)">Check</button><p aria-live=polite></p></article>`).join('')+'</section>'}function checkAnswer(i,b){let q=D[cur].checks[i],a=b.previousElementSibling.value;b.nextElementSibling.textContent=a===q.answer?'Yes. '+q.evidence:'Read the source sentence again, then try once more.'}function render(){let l=D[cur];document.querySelector('#title').textContent=l.id+' · '+l.title;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));let out='';if(tab==='learn'){out=`<section class=card><h2>1. Explore the question</h2><p>${esc(l.prompt)}</p>${note('prediction','Before reading: what do you think?')}</section><section class=card><h2>2. Read and investigate</h2><div>${l.checks.map(q=>`<p class=card>${esc(q.evidence)}</p>`).join('')}</div><p>Open each original textbook page. Follow the diagrams and experiments in order.</p>${l.textbook.map(p=>page(p,'Textbook')).join('')}</section><section class=card><h2>3. Close the book and explain</h2>${note('recall','Explain what you learned. What evidence supports your explanation?')}<button onclick="tab='practice';render()">Try exercises →</button></section>`}if(tab==='homework'){out=`<section class=card><h2>Assessment book · Homework Performance</h2><p>Complete the section headed <strong>Homework Performance</strong> on the reference pages below. A shared page may also contain the next lesson or a test; only the matching homework section belongs here.</p>${l.assigned.length?`<p class=badge>Assignment page references on these shared pages: ${l.assigned.join(', ')}. Match the lesson heading before answering.</p>`:''}${l.id==='4-1'?'<p class=warn>The supplied assignment lists page 27. In this scan page 27 is germination homework; Sunlight and Growth begins on page 28 and its homework is on page 29. Verify the school edition before treating page 29 as assigned.</p>':''}<p><strong>Matching homework: printed pages ${l.homeworkPrinted.join(', ')}.</strong></p>${l.assessment.filter(p=>l.homeworkPrinted.includes(p.printed)).map(p=>page(p,'Assessment book')).join('')}${note('homework','My homework answers — use the original question numbers')}<p>No official answer key was supplied. Review written or spoken responses with a parent; these answers are not automatically scored.</p></section>`}if(tab==='practice'){out=quiz(l)+`<section class=card><h2>Textbook exercises and assessment models</h2><p>Use the textbook’s Try / Practise questions and the assessment book’s Weekly Assessment / Test sections. Shared models can cover earlier lessons too.</p><h3>Textbook questions</h3>${l.textbook.map(p=>page(p,'Textbook')).join('')}<h3>Weekly tests and classroom tasks</h3>${l.assessment.map(p=>page(p,'Assessment book')).join('')}${note('practice','My exercise / test answers')}<details><summary>Review my answer</summary><p>Reopen the explanation pages. Check each claim against a sentence, diagram or experiment. Correct your response below; ask a parent about anything unclear.</p>${note('correction','My corrected explanation')}</details><label><input type=checkbox data-done> I reviewed this lesson with evidence from the book.</label></section>`}if(tab==='sources'){out=`<section class=card><h2>Both books · source and scope</h2><p>English Ministry Science textbook, First Term 2026–2027: downloaded PDF has 110 pages. Assessment book: 62 scanned PDF pages; printed numbering is PDF page + 1 after the cover.</p><p>All original images are embedded for offline use. Searchable assessment text is OCR and may contain errors; the image controls the wording. No teacher answer key or invented automatic grading is included.</p><p><a href="https://drive.google.com/file/d/12XSa7KQlC-BIsLpm82x1XrCFtpUYAwWX/view">Full textbook online</a> · <a href="https://drive.google.com/file/d/1OjoipmjinEWTSUsR5TX6L2kpurfH0j95/view">Full assessment book online</a> · <a href="index.html">All chapters and lessons</a> · <a href="science-skills.html">Science skills and tools</a> · <a href="science-skills.html">Science skills and tools</a></p><p>Your notes stay in this browser on this device. Export them to keep a backup.</p><button onclick=exportNotes()>Export my answers</button></section>`}root.innerHTML=out;root.querySelectorAll('[data-note]').forEach(el=>{el.value=localStorage.getItem(key(el.dataset.note))||'';el.oninput=()=>localStorage.setItem(key(el.dataset.note),el.value)});let cb=root.querySelector('[data-done]');if(cb){cb.checked=localStorage.getItem(key('done'))==='true';cb.onchange=()=>localStorage.setItem(key('done'),cb.checked)}}function exportNotes(){let o={};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k.startsWith('science-en-2026:'))o[k]=localStorage.getItem(k)}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download='science-answers.json';a.click();URL.revokeObjectURL(a.href)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelector('#read').onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(root.innerText.slice(0,12000)))};document.querySelector('#stop').onclick=()=>speechSynthesis.cancel();render();</script></html>
