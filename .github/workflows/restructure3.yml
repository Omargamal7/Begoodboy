name: restructure3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restructure3.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/restructure3.sh
          git add -A
          git commit -m "Pass 3: shared science to Gamal only, social studies to Murad only; drop announcements"
          git push origin HEAD:main
