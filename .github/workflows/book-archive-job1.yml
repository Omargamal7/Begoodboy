name: One-shot verified book archive
on:
  push:
    branches: [main]
    paths: ['sync/2026-10-25-ministry-books/ingest-plan.json']
permissions:
  contents: write
concurrency:
  group: job1-ministry-books-20261025
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Archive exact verified PDFs and remove one-shot transport
        run: python3 tools/source/ingest-job1-20261025.py
