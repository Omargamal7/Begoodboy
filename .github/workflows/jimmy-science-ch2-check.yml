name: Jimmy Science Chapter 2 verification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/jimmy-science-ch2-check.yml
      - lessons/jimmy-science-t2.js
      - assets/jimmy-science-ch2/**
      - assets/sheet.js
      - tools/build-jimmy-science-ch2.js
      - tools/check-jimmy-science-ch2.js
permissions:
  contents: read
jobs:
  all-lessons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - name: Verify every lesson after shared text correction
        env:
          CHROMIUM: /usr/bin/google-chrome
        run: node tools/check.js
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - name: Build and check offline pack
        env:
          CHROMIUM: /usr/bin/google-chrome
        run: |
          node --check lessons/jimmy-science-t2.js
          node tools/build-jimmy-science-ch2.js
          node tools/check-jimmy-science-ch2.js
      - name: Save phone review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jimmy-science-ch2-review
          path: qa-jimmy-science-ch2
          retention-days: 1
