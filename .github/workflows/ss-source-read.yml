name: Read Grade 5 Social Studies source
on:
  push:
    branches: [main]
    paths: [.github/workflows/ss-source-read.yml, tools/read-ss-source.py]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Ministry book
        env:
          SS_BOOK_URL: https://elearnningcontent.blob.core.windows.net/elearnningcontent/2026/Primary/Primary5/Term1/StudentBook/Social_prim5_T1.pdf
        run: |
          python3 -m pip install --user --break-system-packages pymupdf Pillow
          python3 tools/read-ss-source.py "$SS_BOOK_URL" /tmp/ss-source
      - uses: actions/upload-artifact@v4
        with:
          name: ss-source
          path: /tmp/ss-source
          retention-days: 1
