name: restructure4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restructure4.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/restructure4.sh
          cat RESTRUCTURE-REPORT-4.md >> "$GITHUB_STEP_SUMMARY"
          git add -A
          git commit -m "Pass 4: release books into subject folders, rebuild split science PDFs, move app page data"
          git push origin HEAD:main
          gh release delete school-term1-2026 --yes --cleanup-tag
