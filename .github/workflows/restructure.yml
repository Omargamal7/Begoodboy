name: restructure
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/restructure.yml']
permissions:
  contents: write
jobs:
  restructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restructure and commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/restructure.sh | tee -a "$GITHUB_STEP_SUMMARY"
          git add -A
          git commit -m "Restructure: <kid>/<subject>/{sources,packs}; ict -> computer"
          git push origin HEAD:main
