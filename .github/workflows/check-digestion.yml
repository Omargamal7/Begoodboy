name: Check Murad digestion lessons
on:
  push:
    branches: [codex/murad-science-digestion]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser checks
        run: |
          npm install --no-save playwright
          mkdir -p qa-output
          node --check lessons/murad-science-t3.js
          node --check assets/sheet.js
          node tools/build-digestion.js
      - name: Check all lesson flows and the standalone science copy
        env:
          CHROMIUM: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          node tools/check.js 2>&1 | tee qa-output/all-lessons.log
          node tools/check-digestion.js 2>&1 | tee qa-output/science.log
          shot_dir="$(sed -n 's/^Screenshots in //p' qa-output/all-lessons.log | tail -1)"
          cp "$shot_dir"*.png qa-output/
      - name: Keep screenshots and check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digestion-browser-checks
          path: qa-output/
          retention-days: 1
