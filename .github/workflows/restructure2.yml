name: restructure2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restructure2.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/restructure2.sh | tee -a "$GITHUB_STEP_SUMMARY"
          git add -A
          git commit -m "Restructure pass 2: docs, class packs and shared sources into each subject"
          git push origin HEAD:main
