<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Murad's Grammar Blocks</title>
<style>
/* One calm column. Same header, same buttons, same feedback place on every screen. Blocks are the frame and the reward only. */
:root{
  --bg:#eef1ea; --card:#fbfbf7; --ink:#22302a; --soft:#4f5d55; --line:#b8c2b5;
  --accent:#3f6b2b; --accent-ink:#ffffff; --accent-soft:#dde9d4;
  --ok:#2f6420; --ok-soft:#e1efd8; --no:#8a3f22; --no-soft:#f5e3da;
  --b1:#7a9a4e; --b2:#8b6a4a; --b3:#8c918c; --b4:#3f8f88; --empty:#dfe3db;
  --focus:#1d4ed8;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#161c18; --card:#222a24; --ink:#e7ede5; --soft:#b1bdb2; --line:#425045;
  --accent:#a3cf82; --accent-ink:#14200e; --accent-soft:#2d3b27;
  --ok:#a3cf82; --ok-soft:#24361d; --no:#eeb092; --no-soft:#41291f;
  --b1:#6d8c45; --b2:#7d5f42; --b3:#737872; --b4:#4aa59d; --empty:#2c352e;
  --focus:#93b4ff; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:19px;line-height:1.55;padding:16px 16px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{line-height:1.25;margin:0}
h1{font-size:1.5rem} h2{font-size:1.25rem} h3{font-size:1.1rem}
p{margin:0}
.muted{color:var(--soft)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
header.top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:48px;padding:10px 16px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{min-height:44px;padding:8px 12px;font-size:.95rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row.end{justify-content:flex-end}
/* build strip: one block per finished part */
.build{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.build span{height:22px;border-radius:3px;background:var(--empty);border:1px solid var(--line)}
.build span.on{border-color:transparent}
.build span.on:nth-child(4n+1){background:var(--b1)} .build span.on:nth-child(4n+2){background:var(--b2)}
.build span.on:nth-child(4n+3){background:var(--b3)} .build span.on:nth-child(4n){background:var(--b4)}
/* part list */
.parts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.parts button{width:100%;text-align:left;min-height:56px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:flex;gap:12px;align-items:center}
.parts .num{flex:none;width:40px;height:40px;border-radius:6px;display:grid;place-items:center;font-weight:800;background:var(--empty)}
.parts .done .num{background:var(--accent);color:var(--accent-ink)}
.parts .t{display:flex;flex-direction:column}
.parts small{color:var(--soft);font-size:.9rem}
/* progress */
.prog{height:10px;border-radius:6px;background:var(--empty);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
/* rule card */
.rule ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.pic{display:flex;flex-wrap:wrap;gap:12px}
.pic figure{margin:0;flex:1 1 220px;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.pic figcaption{font-size:.95rem;color:var(--soft)}
.blocks{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.blk{padding:6px 10px;border-radius:4px;font-weight:700;border:2px solid var(--line);background:var(--accent-soft)}
.blk.v{background:var(--ok-soft)}
.blk.plain{background:transparent;border-style:dashed}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.8rem}
.days span{border:1px solid var(--line);border-radius:4px;padding:4px 0}
.days span b{display:block;font-size:1rem}
.line{position:relative;height:44px;border-bottom:3px solid var(--soft);margin:0 8px}
.line .now{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-weight:800}
.line .now i{display:block;width:4px;height:26px;background:var(--accent)}
.line .l,.line .r{position:absolute;bottom:4px;font-size:.85rem;color:var(--soft)}
.line .l{left:0}.line .r{right:0}
/* question */
.dir{font-size:.95rem;color:var(--soft)}
.stem{font-size:1.2rem;font-weight:600}
.blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--ink);margin:0 2px}
.hint{font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:stretch}
.opt .choice{flex:1;text-align:left;min-height:52px;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-size:1.1rem}
.opt .choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.opt .choice .mk{display:inline-block;width:1.6em;font-weight:800}
.say{flex:none;min-width:48px;min-height:48px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:.85rem;padding:4px 8px}
.say.reading,.reading{outline:3px solid var(--focus);outline-offset:2px}
.fb{border-radius:10px;padding:12px 14px;border:2px solid var(--line);min-height:56px}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.no{background:var(--no-soft);border-color:var(--no)}
.fb .head{font-weight:800}
.fb.ok .head{color:var(--ok)} .fb.no .head{color:var(--no)}
.parent{border:2px dashed var(--line);border-radius:10px;padding:12px}
/* review */
.rev{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rev li{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.95rem}
.rev .r{font-weight:800}
.big{font-size:1.3rem;font-weight:800}
.bar{padding:10px 12px;gap:8px}
.buildrow{display:flex;align-items:center;gap:10px}
.buildrow h2{font-size:1rem;white-space:nowrap}
.buildrow .build{flex:1}
.readbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.95rem}
.readbar .btn.small{min-height:44px;padding:6px 10px}
footer{font-size:.85rem;color:var(--soft)}
@media (max-width:480px){body{font-size:18px;padding:12px 12px 32px}.build{gap:3px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Murad's Grammar Blocks</h1>
      <p class="muted">November test, 26 November · Grammar book pages 10 to 31</p>
    </div>
    <div class="tools">
      <button class="btn ghost small" id="theme" type="button">Dark colours</button>
    </div>
  </header>

  <div class="card bar">
    <div class="buildrow"><h2 id="buildhead">Build: 0 of 12</h2><div class="build" id="build" aria-hidden="true"></div></div>
    <div class="readbar" aria-label="Read aloud settings"><span>Read aloud:</span>
      <button class="btn ghost small" id="rate" type="button">Speed: normal</button>
      <button class="btn ghost small" id="stop" type="button">Stop reading</button></div>
  </div>

  <main id="main" class="card"></main>

  <footer id="foot"></footer>
</div>

<script type="application/json" id="data">/*DATA*/</script>
<script>
(function(){
"use strict";
const D=JSON.parse(document.getElementById("data").textContent);
const PARTS=D.parts, R=D.reasons, KEY="murad-grammar-2026-11-26-v1";
const main=document.getElementById("main");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- saved progress (browser storage may be unavailable) ---------- */
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||"null");if(v&&v.first)return v}catch(e){}return{first:{},done:{},pos:null,theme:null}}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- theme ---------- */
const themeBtn=document.getElementById("theme");
function applyTheme(){const dark=S.theme==="dark";document.documentElement.dataset.theme=dark?"dark":"light";themeBtn.textContent=dark?"Light colours":"Dark colours"}
themeBtn.onclick=()=>{S.theme=S.theme==="dark"?"light":"dark";save();applyTheme()};
applyTheme();

/* ---------- read aloud: only when a button is pressed ---------- */
let rate=0.9, speaking=null;
const rateBtn=document.getElementById("rate");
rateBtn.onclick=()=>{rate=rate===0.9?0.7:0.9;rateBtn.textContent=rate===0.9?"Speed: normal":"Speed: slow"};
function stopRead(){try{speechSynthesis.cancel()}catch(e){}if(speaking){speaking.classList.remove("reading");speaking=null}}
document.getElementById("stop").onclick=stopRead;
function speak(text,el){stopRead();if(!("speechSynthesis" in window))return;
  try{const u=new SpeechSynthesisUtterance(text);u.lang="en-GB";u.rate=rate;
    const v=speechSynthesis.getVoices().find(x=>/^en[-_]GB/i.test(x.lang))||speechSynthesis.getVoices().find(x=>/^en/i.test(x.lang));if(v)u.voice=v;
    if(el){speaking=el;el.classList.add("reading")}
    u.onend=u.onerror=()=>{if(el)el.classList.remove("reading");if(speaking===el)speaking=null};
    speechSynthesis.speak(u)}catch(e){}}
main.addEventListener("click",e=>{const b=e.target.closest(".say");if(!b)return;
  const t=document.getElementById(b.dataset.for);speak(b.dataset.text||(t?t.innerText:""),t||b)});
const sayBtn=(forId,label,text)=>`<button class="say" type="button" data-for="${forId}"${text?` data-text="${esc(text)}"`:""} aria-label="Read aloud: ${esc(label)}">🔊 Read</button>`;

/* ---------- helpers ---------- */
function seeded(id){let h=2166136261;for(const c of id){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return(h>>>0)/4294967296}}
function options(it){ if(it.tf) return ["True","False"];
  const o=[it.a,...it.d], r=seeded(it.id);
  for(let i=o.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[o[i],o[j]]=[o[j],o[i]]}return o}
const scored=p=>p.items.filter(i=>!i.parent);
const firstRight=p=>scored(p).filter(i=>S.first[i.id]===i.a).length;
const partDone=p=>!!S.done[p.id];
function stemHTML(q){return esc(q).replace(/___/g,'<span class="blank" aria-label="blank">&nbsp;</span>')}
function stemSpoken(q){return q.replace(/___/g," blank ")}

function renderBuild(){
  const n=PARTS.filter(partDone).length;
  document.getElementById("build").innerHTML=PARTS.map(p=>`<span class="${partDone(p)?"on":""}"></span>`).join("");
  document.getElementById("buildhead").textContent=`Build: ${n} of ${PARTS.length}`;
}

/* ---------- pictures (each shows the form or time the rule describes) ---------- */
function pic(kind){
  const B=(t,c)=>`<span class="blk${c?" "+c:""}">${esc(t)}</span>`;
  const fig=(cap,body)=>`<figure>${body}<figcaption>${esc(cap)}</figcaption></figure>`;
  const days=`<div class="days" aria-hidden="true">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<span>${d}<b>✓</b></span>`).join("")}</div>`;
  const now=`<div class="line" aria-hidden="true"><span class="l">before</span><span class="now">now<i></i></span><span class="r">later</span></div>`;
  switch(kind){
    case "simple": return fig("Present simple: something that happens every day, like a habit.",days)+fig("Singular subject: verb + s.",`<div class="blocks">${B("He")}${B("plays","v")}${B("tennis","plain")}</div>`);
    case "neg": return fig("Singular subject: does + not + verb.",`<div class="blocks">${B("She")}${B("does not")}${B("work","v")}</div>`)+fig("Plural subject, I, you: do + not + verb.",`<div class="blocks">${B("I")}${B("do not")}${B("like","v")}</div>`);
    case "question": return fig("Singular subject: does + subject + verb.",`<div class="blocks">${B("When")}${B("does")}${B("she")}${B("work","v")}${B("?","plain")}</div>`)+fig("Plural subject, I, you: do + subject + verb.",`<div class="blocks">${B("Do")}${B("you")}${B("like","v")}${B("chocolate?","plain")}</div>`);
    case "now": return fig("Present continuous: an action happening now.",now)+fig("am, is or are + verb + ing.",`<div class="blocks">${B("He")}${B("is")}${B("working","v")}</div>`);
    case "both": return fig("Present simple: every day.",days)+fig("Present continuous: now.",now);
    case "if0": return fig("Type 0: If + present simple, present simple.",`<div class="blocks">${B("If you heat water,")}${B("it boils.","v")}</div>`);
    case "if1": return fig("Type 1: If + present simple, will + infinitive.",`<div class="blocks">${B("If you study hard,")}${B("you will pass the exam.","v")}</div>`)+fig("Result clause first: no comma.",`<div class="blocks">${B("You will pass the exam","v")}${B("if you study hard.")}</div>`);
    case "stative": return fig("Stative verbs: a state. Not used in the continuous form.",`<div class="blocks">${["think","love","have","be","believe","see","hear","smell"].map(w=>B(w)).join("")}</div>`)+fig("Dynamic verbs: an activity.",`<div class="blocks">${["drive","watch","listen"].map(w=>B(w,"v")).join("")}</div>`);
    case "future": return fig("will + verb: decisions, promises, offers, predictions.",`<div class="blocks">${B("I")}${B("will")}${B("call","v")}${B("you.","plain")}</div>`)+fig("be going to + verb: plans, and predictions from evidence.",`<div class="blocks">${B("It")}${B("is going to")}${B("rain.","v")}</div>`);
  }
  return "";
}

/* ---------- screens ---------- */
function home(){
  stopRead();S.pos=null;save();renderBuild();
  const total=PARTS.reduce((n,p)=>n+p.items.length,0);
  main.innerHTML=`
    <h2 id="h">All parts</h2>
    <p>There are ${PARTS.length} parts. Each part is one page of your grammar book. You read the rule, then you answer that page's questions one at a time.</p>
    <p class="muted">${total} questions in all. Pick any part. You can stop after any question and come back later.</p>
    <ul class="parts">${PARTS.map((p,k)=>`<li class="${partDone(p)?"done":""}"><button type="button" data-k="${k}">
      <span class="num">${partDone(p)?"✓":k+1}</span>
      <span class="t"><span>Part ${k+1} of ${PARTS.length}: ${esc(p.title)}</span>
      <small>Book page ${p.page} · ${p.items.length} questions${partDone(p)?` · finished, first try ${firstRight(p)} of ${scored(p).length}`:started(p)?" · started":""}</small></span></button></li>`).join("")}</ul>`;
  main.querySelectorAll(".parts button").forEach(b=>b.onclick=()=>learn(+b.dataset.k));
  focusHead();
}
const started=p=>p.items.some(i=>i.id in S.first);
function focusHead(){const h=document.getElementById("h");if(h){h.tabIndex=-1;h.focus({preventScroll:false})}}

function learn(k){
  stopRead();const p=PARTS[k],L=p.learn;S.pos={k,i:null};save();
  main.innerHTML=`
    <p class="muted">Part ${k+1} of ${PARTS.length} · Step 1 of 2: the rule</p>
    <div class="row" style="justify-content:space-between;align-items:center">
      <h2 id="h">${esc(L.head)}</h2>${sayBtn("rule","the rule")}
    </div>
    <div class="rule" id="rule"><p class="muted">From your grammar book, page ${L.page}.</p><ul>${L.lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul></div>
    <div class="pic">${pic(L.pic)}</div>
    <div class="row end">
      <button class="btn ghost" type="button" id="back">Back to all parts</button>
      <button class="btn" type="button" id="go">Start the questions (${p.items.length})</button>
    </div>`;
  document.getElementById("back").onclick=home;
  document.getElementById("go").onclick=()=>{const i=p.items.findIndex(x=>!(x.id in S.first)&&!x.parent);ask(k,i<0?0:i)};
  focusHead();
}

function ask(k,i){
  stopRead();const p=PARTS[k],it=p.items[i],n=p.items.length;S.pos={k,i};save();
  const head=`<p class="muted">Part ${k+1} of ${PARTS.length} · Step 2 of 2 · Question ${i+1} of ${n}</p>
    <div class="prog" aria-hidden="true"><i style="width:${Math.round(100*i/n)}%"></i></div>
    <p class="dir">Book page ${p.page}: ${esc(p.dir)}</p>`;
  if(it.parent){
    main.innerHTML=`${head}<h2 id="h">Parent check: this question is not scored</h2>
      <div class="parent"><p class="stem" id="stem">${stemHTML(it.q)}</p>
      <p>Choices: ${options(it).map(esc).join(" · ")}</p>
      <p>School's model answer: <b>${esc(it.a)}</b></p><p>${esc(it.parent)}</p></div>
      <div class="row end"><button class="btn ghost" type="button" id="back">Back to all parts</button>
      <button class="btn" type="button" id="next">${i+1<n?"Next question":"See my answers"}</button></div>`;
    document.getElementById("back").onclick=home;
    document.getElementById("next").onclick=()=>i+1<n?ask(k,i+1):review(k);
    focusHead();return;
  }
  const opts=options(it);let sel=null,solved=false;
  main.innerHTML=`${head}
    <div class="row" style="justify-content:space-between;align-items:flex-start;gap:8px">
      <h2 id="h" class="stem"><span id="stem">${stemHTML(it.q)}</span>${it.v?` <span class="hint">(${esc(it.v)})</span>`:""}</h2>
      ${sayBtn("stem","the question",stemSpoken(it.q)+(it.v?". The verb is: "+it.v.replace("/"," and "):""))}
    </div>
    <div class="opts" role="group" aria-labelledby="h">${opts.map((o,j)=>`<div class="opt">
      <button class="choice" type="button" aria-pressed="false" data-j="${j}" id="o${j}"><span class="mk">${String.fromCharCode(65+j)}.</span>${esc(o)}</button>
      ${sayBtn("o"+j,"choice "+String.fromCharCode(65+j),o.replace(/…/g,", then, "))}</div>`).join("")}</div>
    <div class="fb" id="fb" role="status" aria-live="polite"><p class="muted">Choose an answer, then press "Check my answer".</p></div>
    <div class="row end" id="acts">
      <button class="btn ghost" type="button" id="back">Back to all parts</button>
      <button class="btn" type="button" id="check" disabled>Check my answer</button>
    </div>`;
  const fb=document.getElementById("fb"),acts=document.getElementById("acts");
  document.getElementById("back").onclick=home;
  const choices=[...main.querySelectorAll(".choice")];
  choices.forEach(b=>b.onclick=()=>{if(solved)return;sel=+b.dataset.j;choices.forEach(c=>c.setAttribute("aria-pressed",String(c===b)));document.getElementById("check").disabled=false});
  document.getElementById("check").onclick=()=>{
    if(sel===null)return;const pick=opts[sel];
    if(!(it.id in S.first)){S.first[it.id]=pick;save()}
    if(pick===it.a){
      solved=true;choices.forEach(c=>c.disabled=true);
      fb.className="fb ok";fb.innerHTML=`<div class="row" style="justify-content:space-between"><div id="fbt"><p class="head">✓ Correct.</p><p>${esc(it.a)}</p></div>${sayBtn("fbt","the feedback")}</div>`;
      acts.innerHTML=`<button class="btn ghost" type="button" id="back">Back to all parts</button>
        <button class="btn" type="button" id="next">${i+1<n?"Next question":"See my answers"}</button>`;
      document.getElementById("back").onclick=home;
      const nx=document.getElementById("next");nx.onclick=()=>i+1<n?ask(k,i+1):review(k);nx.focus();
    }else{
      fb.className="fb no";fb.innerHTML=`<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div id="fbt"><p class="head">✗ Not this one.</p><p>The book's answer is: <b>${esc(it.a)}</b></p><p>Why: ${esc(R[it.why])}</p></div>${sayBtn("fbt","the feedback")}</div>`;
      acts.innerHTML=`<button class="btn ghost" type="button" id="rule">Read the rule again</button>
        <button class="btn" type="button" id="again">Try again</button>`;
      document.getElementById("rule").onclick=()=>learn(k);
      const ag=document.getElementById("again");
      ag.onclick=()=>ask(k,i);ag.focus();
    }
  };
  focusHead();
}

function review(k){
  stopRead();const p=PARTS[k];S.done[p.id]=true;S.pos=null;save();renderBuild();
  const sc=scored(p),right=firstRight(p),blocks=PARTS.filter(partDone).length;
  main.innerHTML=`<p class="muted">Part ${k+1} of ${PARTS.length} · Finished</p>
    <h2 id="h">You placed a block. Your build has ${blocks} of ${PARTS.length} blocks.</h2>
    <p class="big">First try: ${right} of ${sc.length} correct.</p>
    <h3>Your first answers</h3>
    <ul class="rev">${p.items.map((it,j)=>{
      if(it.parent)return `<li>Question ${j+1}: parent check, not scored. School's answer: ${esc(it.a)}</li>`;
      const f=S.first[it.id];const ok=f===it.a;
      return `<li><span class="r">${ok?"✓ Correct":"✗ Not correct"}</span> · Question ${j+1}: ${esc(it.q)}<br>Your first answer: ${f?esc(f):"no answer"}${ok?"":` · Book's answer: <b>${esc(it.a)}</b>`}</li>`}).join("")}</ul>
    <div class="row end">
      <button class="btn ghost" type="button" id="redo">Start this part again</button>
      <button class="btn ghost" type="button" id="back">Back to all parts</button>
      ${k+1<PARTS.length?`<button class="btn" type="button" id="next">Next part</button>`:""}
    </div>`;
  document.getElementById("back").onclick=home;
  document.getElementById("redo").onclick=()=>{p.items.forEach(it=>delete S.first[it.id]);delete S.done[p.id];save();renderBuild();learn(k)};
  const nx=document.getElementById("next");if(nx)nx.onclick=()=>learn(k+1);
  focusHead();
}

document.getElementById("foot").textContent="Every rule and question on this page comes from the Grade 6 Grammar and Sentence Structure book (pages 10 to 31). Answers come from the school's model answers. Your answers are saved on this device only.";
renderBuild();
if(S.pos&&PARTS[S.pos.k]){const{k,i}=S.pos;i===null?learn(k):ask(k,Math.min(i,PARTS[k].items.length-1))}else home();
})();
</script>
